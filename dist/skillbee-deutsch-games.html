          openIconModal(obj[field] || "", function (e) { obj[field] = e; btn.textContent = e || "＋ icon"; store.save(); });
        });
        return btn;
      }

      function openIconModal(current, onPick) {
        var overlay = el("div", { class: "adm-modal-overlay" });
        overlay.addEventListener("click", function (e) { if (e.target === overlay) overlay.remove(); });
        var searchInp = el("input", { class: "adm-input", attrs: { type: "text", placeholder: "search icons (dog, apple, red…)" } });
        var grid = el("div", { class: "adm-icon-grid big" });
        function fill(qq) {
          grid.innerHTML = "";
          var listE = (window.EmojiPick && window.EmojiPick.search) ? window.EmojiPick.search(qq || "") : [];
          if (!listE.length) { grid.appendChild(el("span", { class: "adm-blank-hint", text: "No icon — try another word." })); return; }
          listE.slice(0, 200).forEach(function (e) {
            grid.appendChild(el("button", { class: "adm-icon-opt" + (current === e ? " sel" : ""), attrs: { type: "button" }, text: e, on: { click: function () { onPick(e); overlay.remove(); } } }));
          });
        }
        searchInp.addEventListener("input", function () { fill(searchInp.value); });
        fill("");
        overlay.appendChild(el("div", { class: "adm-modal-card" }, [
          el("div", { class: "adm-modal-title", text: "Pick an icon" }),
          searchInp, grid,
          el("button", { class: "btn ghost adm-modal-cancel", text: "Cancel", on: { click: function () { overlay.remove(); } } })
        ]));
        document.body.appendChild(overlay);
        setTimeout(function () { try { searchInp.focus(); } catch (e) {} }, 50);
      }

      function delRowBtn(title, onClick) {
        return el("button", { class: "adm-del", html: "✕", attrs: { title: title }, on: { click: onClick } });
      }

      function addRowBtn(label, onClick) {
        return el("button", { class: "btn small adm-add-row", html: label, on: { click: onClick } });
      }

      function emptyState(msg) {
        return el("p", { class: "adm-empty", text: msg });
      }

      /* ---------------- export / import / reset ---------------- */
      function doExport() {
        try {
          var blob = new Blob([store.exportJSON()], { type: "application/json" });
          var url = URL.createObjectURL(blob);
          var a = document.createElement("a");
          a.href = url;
          a.download = "skillbee-deutsch-content.json";
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(function () { URL.revokeObjectURL(url); }, 500);
          toast("File downloaded ✓");
        } catch (e) {
          alert("Export not possible: " + e.message);
        }
      }

      function doImport() {
        var inp = document.createElement("input");
        inp.type = "file";
        inp.accept = "application/json,.json";
        inp.onchange = function () {
          var file = inp.files && inp.files[0];
          if (!file) return;
          var reader = new FileReader();
          reader.onload = function () {
            try {
              store.importJSON(String(reader.result));
              currentGame = null;
              currentExercise = null;
              render();
              toast("Content imported ✓");
            } catch (e) {
              alert("Import failed: " + e.message);
            }
          };
          reader.readAsText(file);
        };
        inp.click();
      }

      // Reset wipes ALL content back to defaults — irreversible. Gate it behind a
      // deliberate "type the word to confirm" modal so it can't be hit by accident.
      function doReset() {
        var overlay = el("div", { class: "adm-overlay" });
        function close() { overlay.remove(); }
        overlay.addEventListener("click", function (e) { if (e.target === overlay) close(); });

        var input = el("input", {
          class: "adm-input",
          attrs: { type: "text", placeholder: "Type RESET", autocapitalize: "characters", autocomplete: "off", spellcheck: "false" }
        });
        var goBtn = el("button", { class: "btn danger", text: "Reset everything", attrs: { disabled: "true" } });
        function matches() { return input.value.trim().toUpperCase() === "RESET"; }
        input.addEventListener("input", function () { goBtn.disabled = !matches(); });
        input.addEventListener("keydown", function (e) { if (e.key === "Enter" && matches()) goBtn.click(); });
        goBtn.addEventListener("click", function () {
          if (!matches()) return;
          close(); // close this modal first, so the PIN keypad shows on its own
          function run() {
            store.reset();
            currentGame = null;
            currentExercise = null;
            render();
            toast("Reset to defaults");
          }
          // Require the teacher PIN (fresh, every time) before actually wiping.
          if (window.TeacherGate && window.TeacherGate.verify) window.TeacherGate.verify(run);
          else run();
        });

        overlay.appendChild(el("div", { class: "adm-modal" }, [
          el("div", { class: "adm-modal-title", text: "⚠️ Reset ALL content?" }),
          el("p", {
            class: "adm-hint",
            html: "This erases <b>every exercise and word you've added</b> across all games and restores the built-in defaults. <b>It can't be undone.</b> Consider clicking <b>⬇ Backup</b> first."
          }),
          el("label", { class: "live-label", text: "Type RESET to confirm" }),
          input,
          el("div", { class: "adm-modal-actions" }, [
            el("button", { class: "btn ghost", text: "Cancel", on: { click: close } }),
            goBtn
          ])
        ]));
        document.body.appendChild(overlay);
        setTimeout(function () { try { input.focus(); } catch (e) {} }, 50);
      }

      render();
    }
  };
})();


/* ==== js/live/firebase.js ==== */
/* =====================================================================
   LiveDB — thin wrapper around Firebase Firestore for Live Class Mode.
   Loaded only in the hosted (online) app; the offline file has no
   Firebase, so LiveDB.available() returns false and Live Mode shows a
   friendly "online only" message instead of breaking.
   ===================================================================== */
(function () {
  var firebaseConfig = {
    apiKey: "AIzaSyB6cUPKYzxb_HFpyISG5k5yok_zUWbmgDw",
    authDomain: "skillbee-gamification.firebaseapp.com",
    projectId: "skillbee-gamification",
    storageBucket: "skillbee-gamification.firebasestorage.app",
    messagingSenderId: "826364816558",
    appId: "1:826364816558:web:59abca483a808e52f6513f"
  };

  var db = null;
  var initError = null;

  (function init() {
    try {
      if (typeof firebase === "undefined" || !firebase.initializeApp) {
        initError = "no-sdk";
        return;
      }
      firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
      // ignoreUndefinedProperties: without it, ONE `undefined` field anywhere in
      // a payload makes the SDK throw the entire write away — synchronously,
      // inside whichever click handler asked for it (this froze the host's
      // Reveal button in every game whose scorer omitted a field). Dropping the
      // stray field is always better than losing the write.
      var settings = { ignoreUndefinedProperties: true };
      if (!window.__FIRESTORE_EMULATOR__) {
        // Long-polling is more reliable behind corporate/school proxies than
        // the default streaming transport.
        settings.experimentalForceLongPolling = true;
        settings.useFetchStreams = false;
      }
      try { db.settings(settings); } catch (e) {}
      if (window.__FIRESTORE_EMULATOR__) {
        // Test-only: point at a local Firestore emulator. Never set in production.
        try { db.useEmulator(window.__FIRESTORE_EMULATOR__.host, window.__FIRESTORE_EMULATOR__.port); } catch (e) {}
      }
    } catch (e) {
      initError = e;
    }
  })();

  function serverTs() {
    return firebase.firestore.FieldValue.serverTimestamp();
  }

  var ALPHABET = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // no I/O/0/1 to avoid confusion
  function genCode() {
    var c = "";
    for (var i = 0; i < 4; i++) c += ALPHABET[Math.floor(Math.random() * ALPHABET.length)];
    return c;
  }

  var LiveDB = {
    available: function () {
      return !!db;
    },
    error: function () {
      return initError;
    },
    serverTs: serverTs,

    /* ---------------- rosters ---------------- */
    createRoster: function (name, students) {
      var ref = db.collection("rosters").doc();
      return ref.set({ name: name, students: students, createdAt: serverTs() }).then(function () {
        return ref.id;
      });
    },
    updateRoster: function (id, data) {
      return db.collection("rosters").doc(id).set(data, { merge: true });
    },
    deleteRoster: function (id) {
      return db.collection("rosters").doc(id).delete();
    },
    getRoster: function (id) {
      return db.collection("rosters").doc(id).get().then(function (d) {
        return d.exists ? Object.assign({ id: d.id }, d.data()) : null;
      });
    },

    /* ---------------- sessions ---------------- */
    createSession: function (data) {
      function attempt(tries) {
        var code = genCode();
        var ref = db.collection("sessions").doc(code);
        return ref.get().then(function (d) {
          if (d.exists && tries < 10) return attempt(tries + 1);
          return ref.set(Object.assign({ createdAt: serverTs() }, data)).then(function () {
            return code;
          });
        });
      }
      return attempt(0);
    },
    getSession: function (code) {
      return db.collection("sessions").doc(code).get().then(function (d) {
        return d.exists ? Object.assign({ code: d.id }, d.data()) : null;
      });
    },
    listenSession: function (code, cb) {
      return db.collection("sessions").doc(code).onSnapshot(
        function (d) {
          cb(d.exists ? Object.assign({ code: d.id }, d.data()) : null, null);
        },
        function (e) {
          cb(null, e);
        }
      );
    },
    updateSession: function (code, data) {
      return db.collection("sessions").doc(code).set(data, { merge: true });
    },
    // A student's claimed roster slot lives in its OWN document at
    // sessions/{code}/joined/{studentId}, with a heartbeat the client refreshes.
    // A name is "free" again once its heartbeat is older than JOIN_STALE_MS.
    JOIN_STALE_MS: 15000, // 15s (~3 missed 5s heartbeats) — see claimName/presence

    // A stable per-BROWSER token so we can tell "the same phone reconnecting"
    // (allowed to keep its name) from "a different phone grabbing the same name"
    // (refused). Two students can't be distinguished by (id, name) alone.
    deviceToken: function () {
      try {
        var t = localStorage.getItem("skillbee_device_token");
        if (!t) { t = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem("skillbee_device_token", t); }
        return t;
      } catch (e) { return "d-" + Math.random().toString(36).slice(2); }
    },

    // The claim/heartbeat presence system needs the NEWER firestore.rules (the
    // sessions/{code}/joined subcollection block). Rules deploy MANUALLY in the
    // Firebase console — GitHub Pages only publishes the app — so a newer app
    // can meet an older ruleset, where every /joined access is denied and nobody
    // can join any room. Never hard-depend on that infra step: on the first
    // permission-denied we flip to the legacy session-doc `joined` map (allowed
    // by every ruleset this app has shipped). Joining then works exactly as it
    // did pre-presence; only stale-name detection is lost until the rules from
    // firestore.rules are pasted into the console.
    _joinLegacy: false,
    _legacyClaim: function (code, studentId, studentName) {
      var patch = { joined: {} };
      patch.joined[studentId] = { name: studentName, at: Date.now() };
      return db.collection("sessions").doc(code).set(patch, { merge: true }).then(function () { return true; });
    },
    _isDenied: function (e) { return !!(e && e.code === "permission-denied"); },

    // Claim a name ATOMICALLY. A Firestore transaction makes the read-check-write
    // one indivisible step: if two DIFFERENT phones tap the same name at once, one
    // wins and the other's transaction retries, sees the fresh claim by a
    // different owner, and fails with { code:"name-taken" } — no silent overwrite.
    // The true owner may always re-claim (reconnect); a slot whose heartbeat has
    // gone stale (owner gone) is reclaimable by anyone.
    claimName: function (code, studentId, studentName, owner) {
      if (LiveDB._joinLegacy) return LiveDB._legacyClaim(code, studentId, studentName);
      var ref = db.collection("sessions").doc(code).collection("joined").doc(studentId);
      var STALE = LiveDB.JOIN_STALE_MS;
      return db.runTransaction(function (tx) {
        return tx.get(ref).then(function (d) {
          if (d.exists) {
            var data = d.data() || {};
            var hb = data.heartbeat;
            var ms = (hb && hb.toMillis) ? hb.toMillis() : 0;
            // Held by a DIFFERENT device with a fresh heartbeat — refuse.
            if (ms && (Date.now() - ms) < STALE && data.owner !== owner) {
              return Promise.reject({ code: "name-taken" });
            }
          }
          tx.set(ref, { name: studentName, owner: owner, joinedAt: serverTs(), heartbeat: serverTs() });
          return null;
        });
      }).then(function () { return true; }).catch(function (e) {
        if (LiveDB._isDenied(e)) {
          LiveDB._joinLegacy = true;
          return LiveDB._legacyClaim(code, studentId, studentName);
        }
        return Promise.reject(e);
      });
    },
    // Refresh this student's heartbeat (called every few seconds while joined).
    heartbeat: function (code, studentId) {
      if (LiveDB._joinLegacy) return Promise.resolve(); // no presence system to feed
      return db.collection("sessions").doc(code).collection("joined").doc(studentId)
        .set({ heartbeat: serverTs() }, { merge: true })
        .catch(function (e) { if (LiveDB._isDenied(e)) LiveDB._joinLegacy = true; });
    },
    // Explicitly give up a slot (tab close / leave) so the name frees instantly.
    leaveSession: function (code, studentId) {
      function legacyLeave() {
        var patch = { joined: {} };
        patch.joined[studentId] = firebase.firestore.FieldValue.delete();
        return db.collection("sessions").doc(code).set(patch, { merge: true }).catch(function () {});
      }
      if (LiveDB._joinLegacy) return legacyLeave();
      return db.collection("sessions").doc(code).collection("joined").doc(studentId)
        .delete().catch(function (e) {
          if (LiveDB._isDenied(e)) { LiveDB._joinLegacy = true; return legacyLeave(); }
        });
    },
    // Live view of every claimed slot: [{ id, name, heartbeat(ms) }]. A pending
    // serverTimestamp reads back null momentarily — treat that as "just now".
    listenJoined: function (code, cb) {
      // Legacy source: adapt the session doc's `joined` map to the same shape.
      // It has no heartbeats, so report every joined name as fresh — joined
      // students simply always count as present (the pre-presence behavior).
      function listenLegacy() {
        return db.collection("sessions").doc(code).onSnapshot(
          function (d) {
            var j = (d.exists && d.data().joined) || {};
            cb(Object.keys(j).map(function (id) {
              return { id: id, name: (j[id] && j[id].name) || "", heartbeat: Date.now() };
            }));
          },
          function () { cb([]); }
        );
      }
      if (LiveDB._joinLegacy) return listenLegacy();
      var inner = db.collection("sessions").doc(code).collection("joined").onSnapshot(
        function (snap) {
          var arr = [];
          snap.forEach(function (d) {
            var x = d.data() || {};
            var hb = (x.heartbeat && x.heartbeat.toMillis) ? x.heartbeat.toMillis() : Date.now();
            arr.push({ id: d.id, name: x.name, heartbeat: hb });
          });
          cb(arr);
        },
        function (e) {
          // A listen error is terminal for this listener. If it's the rules
          // gap, swap to the legacy source in place — same cb, same unsub.
          if (LiveDB._isDenied(e)) { LiveDB._joinLegacy = true; inner = listenLegacy(); return; }
          cb([]);
        }
      );
      return function () { try { inner(); } catch (e) {} };
    },

    /* ---------------- answers ---------------- */
    // Answers are WRITE-ONCE documents (the rules forbid updates), and one room
    // hosts MANY games via "Play another game". Every answer is therefore
    // namespaced by `seq` (the session's gameSeq): without it, game 2's
    // question 0 would collide with game 1's docs — the new answers rejected by
    // write-once, and the host re-scoring game 1's stale answers.
    submitAnswer: function (code, qIndex, studentId, payload, seq) {
      seq = seq || 0;
      var id = seq + "_" + qIndex + "_" + studentId; // one answer per student per question per game
      var ref = db.collection("sessions").doc(code).collection("answers").doc(id);
      return ref.set(Object.assign({ questionIndex: qIndex, gameSeq: seq, studentId: studentId, ts: serverTs() }, payload));
    },
    // Per-match progress for the individual match game (Hör-Paare). Each matched
    // pair — and the final "done" state — is its own write-once document, so the
    // host can show a live progress bar per student. `key` (the running matched
    // count) makes each id unique per milestone. Reuses the same write-once
    // answers rule, so no security-rules change is needed.
    submitProgress: function (code, qIndex, studentId, key, payload, seq) {
      seq = seq || 0;
      var id = seq + "_" + qIndex + "_" + studentId + "_" + key;
      var ref = db.collection("sessions").doc(code).collection("answers").doc(id);
      return ref.set(Object.assign({ questionIndex: qIndex, gameSeq: seq, studentId: studentId, ts: serverTs() }, payload));
    },
    // Both equality filters together need no composite index (zig-zag merge).
    listenAnswers: function (code, qIndex, cb, seq) {
      return db
        .collection("sessions").doc(code).collection("answers")
        .where("questionIndex", "==", qIndex)
        .where("gameSeq", "==", seq || 0)
        .onSnapshot(
          function (snap) {
            var arr = [];
            snap.forEach(function (d) { arr.push(d.data()); });
            cb(arr);
          },
          function (e) { cb([], e); }
        );
    },
    getAnswers: function (code, qIndex, seq) {
      return db
        .collection("sessions").doc(code).collection("answers")
        .where("questionIndex", "==", qIndex)
        .where("gameSeq", "==", seq || 0)
        .get()
        .then(function (snap) {
          var arr = [];
          snap.forEach(function (d) { arr.push(d.data()); });
          return arr;
        });
    },
    // Speed Challenge answers. The deployed security rules only accept an
    // answer while the session has status "question" AND the answer's
    // questionIndex equals round.index — so Speed runs under status "question"
    // with this sentinel round index, which every speed answer carries; the
    // student's REAL position rides in `pos` (the doc id keeps one write-once
    // doc per position per student per game).
    SPEED_ROUND_INDEX: -9,
    submitSpeedAnswer: function (code, pos, studentId, payload, seq) {
      seq = seq || 0;
      var id = seq + "_s" + pos + "_" + studentId;
      var ref = db.collection("sessions").doc(code).collection("answers").doc(id);
      return ref.set(Object.assign({ questionIndex: LiveDB.SPEED_ROUND_INDEX, pos: pos, gameSeq: seq, studentId: studentId, ts: serverTs() }, payload));
    },
    // Speed Challenge is student-paced: every phone is on its own question, so the
    // host can't watch "the current question" — it watches every answer OF THIS
    // GAME (gameSeq-filtered, like listenAnswers: a room hosts many games) and
    // derives each student's progress + running score from it.
    listenAllAnswers: function (code, cb, seq) {
      return db
        .collection("sessions").doc(code).collection("answers")
        .where("gameSeq", "==", seq || 0)
        .onSnapshot(
          function (snap) {
            var arr = [];
            snap.forEach(function (d) { arr.push(d.data()); });
            cb(arr);
          },
          function (e) { cb([], e); }
        );
    },

    /* ---------------- teacher PIN config ---------------- */
    getConfig: function () {
      return db.collection("config").doc("teacher").get().then(function (d) {
        return d.exists ? d.data() : null;
      });
    },
    setConfig: function (data) {
      return db.collection("config").doc("teacher").set(data, { merge: true });
    },

    /* ---------------- shared content bank (cloud sync) ---------------- */
    getContent: function () {
      return db.collection("content").doc("bank").get().then(function (d) {
        return d.exists ? d.data() : null;
      });
    },
    setContent: function (payload) {
      // Full overwrite — the whole content bank is written each time.
      return db.collection("content").doc("bank").set(payload);
    },
    listenContent: function (cb) {
      return db.collection("content").doc("bank").onSnapshot(
        function (d) { cb(d.exists ? d.data() : null); },
        function () { /* ignore transient listen errors */ }
      );
    },

    /* ---------------- cumulative leaderboards ---------------- */
    getLeaderboard: function (rosterId) {
      return db.collection("leaderboards").doc(rosterId).get().then(function (d) {
        return d.exists ? d.data() : { scores: {} };
      });
    },
    saveLeaderboard: function (rosterId, scores) {
      return db.collection("leaderboards").doc(rosterId).set(
        { scores: scores, updatedAt: serverTs() },
        { merge: true }
      );
    }
  };

  window.LiveDB = LiveDB;
})();


/* ==== js/live/liveGames.js ==== */
/* =====================================================================
   LiveGames — adapts each game to the shared Live Class flow.
   Each adapter provides:
     meta          { name, emoji, contentType }
     buildRounds(topic)              -> [ round, ... ]
     hostContent(el, round)          -> render the board's question area
     playerContent(el, round, api)   -> tap UI; api.submit(payload)
     score(round, payload, elapsedMs, timeLimit) -> { correct, points }
     correctLabel(round)             -> text shown at reveal
     speakOnReveal(round)            -> German text to pronounce (or null)
   The Live controller supplies all the surrounding chrome (room code,
   timer, answered counter, leaderboard, podium).
   ===================================================================== */
(function () {
  function kit() {
    return window.App.kit;
  }

  /* Jewel-toned shape/colour set for up to 4 answer buttons (Skillbee gem theme).
     Diamond leads (the Skillbee mark); shapes stay distinct for colourblind clarity. */
  var SHAPES = ["◆", "●", "▲", "■"];
  var COLORS = ["#0A84FF", "#FF3B67", "#12C08A", "#FFA51F"];

  // Build up to `n` wrong options. Uses the teacher's custom ones first (from the
  // admin editor), then tops up with auto-generated ones from `autoPool`. Never
  // includes the correct answer; blanks/duplicates are dropped. If the teacher
  // set nothing, this behaves exactly like the previous auto-only generation.
  function wrongOptions(custom, correct, autoPool, n) {
    var out = [];
    (custom || []).forEach(function (d) {
      d = String(d).trim();
      if (d && d !== correct && out.indexOf(d) < 0) out.push(d);
    });
    if (out.length < n) {
      var pool = autoPool.filter(function (x) { return x !== correct && out.indexOf(x) < 0; });
      kit().sample(pool, n - out.length).forEach(function (x) { out.push(x); });
    }
    return out.slice(0, n);
  }

  /* ---- General MCQ (was Vokabel-Quiz): a question + up to 4 options, where the
     question AND each option is independently text · audio · image · icon. The
     fast, timed, speed-scored Kahoot flow is unchanged — only rendering adapts.
     Quick content comes from vocab words (German text ↔ English text options);
     typed content comes from an authored `mcq` list. */
  function mcqCorrect(round) { return (round.options || []).filter(function (o) { return o.correct; })[0] || null; }
  function mcqSide(s, fallback) {
    if (s && typeof s === "object" && typeof s.type === "string") return { type: s.type, value: String(s.value == null ? "" : s.value) };
    return { type: fallback || "text", value: String(s == null ? "" : s) };
  }
  // German-ish text to pronounce at reveal: an audio side if there is one, else
  // the text question, else a text answer.
  function mcqSpeak(round) {
    var q = round.question || {};
    if (q.type === "audio") return q.value;
    var c = mcqCorrect(round);
    if (c && c.type === "audio") return c.value;
    if (q.type === "text") return q.value;
    if (c && c.type === "text") return c.value;
    return null;
  }
  // A phone option rendered by type + a shape badge. AUDIO options split into
  // two SEPARATE controls — a play side that replays as often as the student
  // likes (never submits) and a ✓ Choose side that commits. Choose unlocks
  // after the first listen, which the old tap-twice flow also guaranteed —
  // minus its trap of the second tap submitting when you just wanted to hear
  // it again. Every other type submits on the first tap, so the fast Kahoot
  // feel is unchanged.
  function mcqOptionButton(el, opt, i, submit) {
    if (!window.MatchTiles.isAudio(opt)) {
      var btn = el("button", { class: "live-opt phone mt-" + (opt.type || "text"), attrs: { style: "--c:" + COLORS[i] } },
        [el("span", { class: "opt-shape", text: SHAPES[i] })].concat(window.MatchTiles.content(el, opt)));
      btn.addEventListener("click", function () { submit(); });
      return btn;
    }
    var playLbl = el("span", { class: "match-slabel", text: "Hear it" });
    var playBtn = el("button", { class: "mcq-audio-play", attrs: { type: "button", "aria-label": "Play option " + (i + 1) } },
      [el("span", { class: "match-ico", text: "🔊" }), playLbl]);
    var chooseBtn = el("button", { class: "mcq-audio-choose", attrs: { type: "button", disabled: "true" }, text: "Listen first" });
    playBtn.addEventListener("click", function () {
      try { window.MatchTiles.play(kit(), opt); } catch (e) {}
      playLbl.textContent = "Play again";
      if (chooseBtn.disabled) { chooseBtn.disabled = false; chooseBtn.textContent = "✓ Choose"; }
    });
    chooseBtn.addEventListener("click", function () { if (!chooseBtn.disabled) submit(); });
    return el("div", { class: "live-opt phone mt-audio split", attrs: { style: "--c:" + COLORS[i] } },
      [el("span", { class: "opt-shape", text: SHAPES[i] }), playBtn, chooseBtn]);
  }

  function choiceAdapter(meta) {
    return {
      meta: meta,
      timeLimit: 20000,
      pickLabel: "Exercise",
      mcq: true,
      buildRounds: function (topic) {
        var rounds = [];
        // 1) Authored typed MCQ (image/audio/icon/text questions + options).
        (topic.mcq || []).forEach(function (m) {
          if (!m || !m.question) return;
          var q = mcqSide(m.question, "text");
          var opts = (m.options || []).map(function (o) { return { type: (o && o.type) || "text", value: String((o && o.value) || ""), correct: !!(o && o.correct) }; })
            .filter(function (o) { return o.value !== ""; });
          if (!q.value || opts.length < 2 || !opts.some(function (o) { return o.correct; })) return;
          rounds.push({ type: "mcq", question: q, options: kit().shuffle(opts.slice(0, 4)) });
        });
        // 2) Quick auto-generate from vocab → German-text question, English-text options.

  /* ==================================================================
     Lücken-Text (Fill in the Blank) — a general fill-in-the-blank format.
     A sentence has one OR MANY blanks (___1___, ___2___, …). The teacher
     picks Tap (a shared word bank of answers + distractors) or Type (an
     inline text box per blank). Any content set that provides sentences +
     blanks can plug in — case articles are just the first data set. See the
     schema in js/data-cases.js. This game replaces the old case-only
     "Fall-Detektiv"; its single-blank case sentences migrate in unchanged
     (one blank each), and it keeps reading the same "cases" content bank.
     ================================================================== */
  var ARTICLE_POOL = ["der", "die", "das", "den", "dem", "des"];
  function caseDistractors(s) {
    return wrongOptions(s.distractors, s.correct, ARTICLE_POOL, 3);
  }

  // Answer matching: case-insensitive, punctuation stripped, ä/ö/ü/ß folded to
  // ae/oe/ue/ss — the same lenient rules used by Hör gut zu!'s type mode.
  function ltNorm(s) {
    return String(s == null ? "" : s).toLowerCase()
      .replace(/[.,!?;:"'“”„«»()¡¿…\-–—]/g, "")
      .replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss")
      .trim();
  }

  // If a sentence uses plain "___" gaps (legacy), number them ___1___, ___2___…
  // in reading order so every blank has a stable id. Already-numbered sentences
  // are returned untouched.
  function ensureNumbered(sentence, blanks) {
    if (/___\d+___/.test(sentence)) return sentence;
    var i = 0;
    return sentence.replace(/_{2,}/g, function () {
      var b = blanks[i]; i++;
      return "___" + (b ? b.id : i) + "___";
    });
  }

  // How many blanks a sentence marks (numbered ___N___ if present, else plain ___).
  function countGaps(sentence) {
    var numbered = (String(sentence).match(/___\d+___/g) || []).length;
    return numbered || (String(sentence).match(/_{2,}/g) || []).length;
  }

  // Build the tap-mode word bank: the teacher's list if given, otherwise the
  // correct answers topped up with plausible article distractors so tap mode
  // isn't trivial. Always includes every correct answer, de-duplicated.
  function buildWordBank(corrects, provided) {
    var out = [];
    (Array.isArray(provided) ? provided : []).forEach(function (w) { w = String(w).trim(); if (w && out.indexOf(w) < 0) out.push(w); });
    corrects.forEach(function (c) { if (c && out.indexOf(c) < 0) out.push(c); });
    if (out.length < corrects.length + 1) {
      var pool = ARTICLE_POOL.filter(function (a) { return out.indexOf(a) < 0; });
      kit().sample(pool, (corrects.length + 1) - out.length).forEach(function (a) { out.push(a); });
    }
    return out;
  }

  // Accept BOTH the new multi-blank schema and the legacy single-blank case
  // rows (sentence + correct + distractors) a teacher may have in the editor,
  // and normalise to { sentence, blanks:[{id,correct}], wordBank, explanation }.
  function normBlankEntry(s) {
    if (!s) return null;
    if (Array.isArray(s.blanks) && s.blanks.length) {
      var sentence = String(s.sentence || "");
      if (sentence.indexOf("___") < 0) return null;               // no blank marker
      var blanks = s.blanks.map(function (b, i) {
        return { id: (b.id != null ? b.id : i + 1), correct: String(b.correct == null ? "" : b.correct).trim() };
      }).filter(function (b) { return b.correct !== ""; });
      if (!blanks.length) return null;
      // Skip half-finished rows: an unfilled gap would render a slot that can't
      // be scored, so only play sentences whose gaps all have answers.
      if (countGaps(sentence) !== blanks.length) return null;
      var wordBank = buildWordBank(blanks.map(function (b) { return b.correct; }), s.wordBank);
      return { sentence: ensureNumbered(sentence, blanks), blanks: blanks, wordBank: wordBank, explanation: s.explanation || "" };
    }
    // Legacy: one blank marked by "___", with a single correct article.
    if (s.sentence && String(s.sentence).indexOf("___") >= 0 && s.correct) {
      var sent = String(s.sentence).replace(/_{2,}/, "___1___");
      return {
        sentence: sent,
        blanks: [{ id: 1, correct: String(s.correct).trim() }],
        wordBank: [String(s.correct).trim()].concat(caseDistractors(s)),
        explanation: s.explanation || ""
      };
    }
    return null;
  }

  // The full correct sentence, blanks filled in — for reveal + pronunciation.
  function fillBlanksText(round) {
    var byId = {};
    (round.blanks || []).forEach(function (b) { byId[b.id] = b.correct; });
    return String(round.sentence).replace(/___(\d+)___/g, function (_, n) {
      return byId[n] != null ? byId[n] : "___";
    });
  }

  // Host board: the sentence with visible numbered gaps, no answers shown.
  function blanksHostNodes(el, sentence) {
    return String(sentence).split(/(___\d+___)/).map(function (part) {
      var m = /^___(\d+)___$/.exec(part);
      if (m) return el("span", { class: "lt-gap", text: "＿＿" });
      return part ? el("span", { text: part }) : document.createTextNode("");
    });
  }

  var blanksAdapter = {
    meta: { name: "Lücken-Text", emoji: "✏️", contentType: "cases" },
    timeLimit: 20000,           // used only as a fallback elapsed cap; no countdown

    blanks: true,               // routes to the fill-in player + per-blank reveal
    statefulPlayer: true,       // the phone widget builds once per round (no rebuild)
    pickLabel: "Exercise",
    typeLabels: {

    getTopics: function () {

      var list = (store && store.exercisesFor) ? store.exercisesFor("cases") : [];
      return list.map(function (e) {

        return { id: e.id, name: e.name, emoji: "✏️", english: n + (n === 1 ? " sentence" : " sentences") };

    },
    // The interactive fill-in widget — self-contained so both Live and the Solo
    // wrapper reuse it. api.submit({ blanks: { id: text } }) once every gap is set.
    playerContent: function (el, round, api) {
      var typing = round.answerMode === "type";
      var order = [];            // blank ids in reading order
      var state = {};            // id -> { value, fromBank, el }
      var bankBtns = [];         // { btn, word, usedBy }
      var submitBtn;

      function refresh() {
        var allFilled = order.length && order.every(function (id) { return state[id].value !== ""; });
        if (submitBtn) submitBtn.disabled = !allFilled;
      }
      function nextEmptyId() {
        for (var k = 0; k < order.length; k++) { if (state[order[k]].value === "") return order[k]; }
        return null;
      }
      function doSubmit() {
        if (submitBtn && submitBtn.disabled) return;
        var answers = {};
        order.forEach(function (id) { answers[id] = state[id].value; });
        api.submit({ blanks: answers });
      }
      function fillSlot(id, word, bankIdx) {
        var st = state[id];
        st.value = word; st.fromBank = (bankIdx == null ? null : bankIdx);
        st.el.textContent = word; st.el.classList.remove("empty"); st.el.classList.add("filled");
        refresh();
      }
      function clearSlot(id) {              // tap mode: return the word to the bank
        var st = state[id];
        if (st.value === "") return;
        var bi = st.fromBank;
        st.value = ""; st.fromBank = null;
        st.el.textContent = "＿＿"; st.el.classList.add("empty"); st.el.classList.remove("filled");
        if (bi != null && bankBtns[bi]) { bankBtns[bi].usedBy = null; bankBtns[bi].btn.classList.remove("used"); bankBtns[bi].btn.disabled = false; }
        refresh();
      }
      function placeWord(bankIdx) {
        var entry = bankBtns[bankIdx];
        if (!entry || entry.usedBy != null) return;
        var id = nextEmptyId();
        if (id == null) return;
        entry.usedBy = id; entry.btn.classList.add("used"); entry.btn.disabled = true;
        fillSlot(id, entry.word, bankIdx);
        try { kit().beep && kit().beep("good"); } catch (e) {}
      }

      var sentEl = el("div", { class: "lt-sentence phone" });
      String(round.sentence).split(/(___\d+___)/).forEach(function (part) {
        var m = /^___(\d+)___$/.exec(part);
        if (m) {
          var id = parseInt(m[1], 10);
          order.push(id);
          state[id] = { value: "", fromBank: null, el: null };
          var slot;
          if (typing) {
            slot = el("input", { class: "lt-input", attrs: { type: "text", size: "6", "aria-label": "blank " + id, autocapitalize: "off", autocomplete: "off", spellcheck: "false", placeholder: "?" } });
            slot.addEventListener("input", function () { state[id].value = slot.value.trim(); refresh(); });
            slot.addEventListener("keydown", function (ev) {
              if (ev.key !== "Enter") return;
              ev.preventDefault();

              if (pos >= 0 && pos < order.length - 1) { try { state[order[pos + 1]].el.focus(); } catch (e) {} }

            });
          } else {
            slot = el("button", { class: "lt-slot empty", attrs: { type: "button" }, text: "＿＿", on: { click: function () { clearSlot(id); } } });

      if (typing) {
        children.push(el("div", { class: "lt-typehint", text: "Tap a blank and type the missing word." + (order.length > 1 ? " Enter jumps to the next." : "") }));
        setTimeout(function () { try { state[order[0]].el.focus(); } catch (e) {} }, 60);
      } else {
        var bank = el("div", { class: "lt-bank" });
        kit().shuffle((round.wordBank || []).slice()).forEach(function (w, i) {
          var btn = el("button", { class: "lt-word", attrs: { type: "button" }, text: w, on: { click: function () { placeWord(i); } } });
          bankBtns.push({ btn: btn, word: w, usedBy: null });
          bank.appendChild(btn);
        });
        children.push(bank);
      }
      submitBtn = el("button", { class: "btn primary lt-submit", text: "Submit", attrs: { disabled: "true" }, on: { click: doSubmit } });
      children.push(submitBtn);
      refresh();
      return el("div", { class: "lt-player" }, children);
    },
    // Per-blank partial credit: 0…1000 points scaled by the share of blanks right.
    score: function (round, payload, elapsedMs, timeLimit) {
      var ans = (payload && payload.blanks) || {};
      var blanks = round.blanks || [];
      var total = blanks.length || 1;
      var matched = 0;
      blanks.forEach(function (b) {
        var g = ltNorm(ans[b.id]);
        if (g !== "" && g === ltNorm(b.correct)) matched++;
      });
      return { correct: matched === total, points: Math.round((matched / total) * 1000), matched: matched, total: total };
    },
    correctLabel: function (round) { return fillBlanksText(round); },
    speakOnReveal: function (round) { return fillBlanksText(round); }
  };

  /* ---- Wortmonster (Word Monster): build compound nouns from two tiles ---- */
  // Join two parts the German way: the second part's first letter becomes
  // lower-case (Hand + Schuh -> Handschuh). Used for teacher-added rows.
  function joinCompound(a, b) {
    b = String(b || "");
    return String(a || "") + (b ? b.charAt(0).toLowerCase() + b.slice(1) : "");
  }

  var compoundAdapter = {
    meta: { name: "Wortmonster", emoji: "🧟", contentType: "compounds" },
    timeLimit: 20000,

    getTopics: function () {

      var list = (store && store.exercisesFor) ? store.exercisesFor("compounds") : [];
      return list.map(function (e) {
        var n = (e.items || []).length;

      });
    },
    buildRounds: function (topic) {

      var raw = (e && e.items) || window.CompoundData || [];

      var all = raw.filter(function (c) { return c && c.partA && c.partB; }).map(function (c) {

        };

        var decoys = kit().sample(others, 5).map(function (o) { return kit().shuffle([o.partA, o.partB])[0]; });
        var seen = {}, tiles = [];
        kit().shuffle([c.partA, c.partB].concat(decoys)).forEach(function (t) { if (!seen[t]) { seen[t] = 1; tiles.push(t); } });
        return {
          type: "compound", meaning: c.meaning, emoji: c.emoji, tiles: tiles,
          partA: c.partA, partB: c.partB, compound: c.compound, gender: c.gender,

      function renderAnswer() {

        built.forEach(function (t, i) { answerRow.appendChild(el("button", { class: "wm-tile chosen", text: t, on: { click: function () { unpick(i); } } })); });

        el("div", { class: "wm-hint", text: "Tap two parts in order" }),

    },
    score: function (round, payload, elapsedMs, timeLimit) {

      if (!correct) return { correct: false, points: 0 };

      return { correct: true, points: Math.round(500 + 500 * frac) };
    },
    correctLabel: function (round) { return round.gender + " " + round.compound; },

  };

  /* ---- Hör gut zu! (Listen Carefully!): pick OR type the word you heard ----
     The smartboard speaks the word/sentence; the teacher picks Tap (4 options)
     or Type at setup. Type mode is lenient about how it's typed (case,
     punctuation, and ae/oe/ue/ss for ä/ö/ü/ß — most phones can't type those)
     but strict about word CHOICE. It scores by the % of words right and shows
     each phone a word-by-word green/red diff. Same logic for words & sentences. */

  // Lenient normalisation for one word (used only for comparing, not display).
  function typeNorm(w) {
    w = String(w == null ? "" : w).toLowerCase();
    w = w.replace(/[.,!?;:"'“”„«»()¡¿…\-–—]/g, "");
    return w.replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss").trim();
  }
  function typeWords(s) { return String(s == null ? "" : s).trim().split(/\s+/).filter(Boolean); }
  // Position-sensitive word diff, shared by host scoring and the on-phone result.
  function typeDiff(typed, correct) {
    var t = typeWords(typed), c = typeWords(correct), matched = 0;
    var typedRow = t.map(function (w, i) {
      return { word: w, status: i >= c.length ? "extra" : (typeNorm(w) === typeNorm(c[i]) ? "correct" : "wrong") };
    });
    var correctRow = c.map(function (w, i) {
      if (i < t.length && typeNorm(t[i]) === typeNorm(w)) matched++;
      return { word: w, missing: i >= t.length };
    });
    return { typedRow: typedRow, correctRow: correctRow, matched: matched, total: c.length };
  }

  var listenAdapter = {

  // so the manual authoring and the quick word-pair flow coexist in one round.
  function roundPairs(q) {
    var out = [];

    // a list of entries { left, right } that all share those two types.

        var rv = String(en.right == null ? "" : en.right).trim();
        if (lv && rv) out.push({ q: { type: lt, value: lv }, a: { type: rt, value: rv } });
      });

    // Back-compat: the earlier per-pair form { question:{type,value}, answer:… }.
    if (q && Array.isArray(q.pairs)) {

      // Listen & Unscramble: the audio plays on the BOARD (host) only — the phone
      // is sent just the shuffled tiles, so the answer sentence never reaches it
      // (strictly no text leak). In Solo, the rendered host content supplies the
      // audio button, so a lone player can still hear + replay it.
      if (round.mode === "listen-unscramble" && round.targetAudio) {
        var plays = 0, pbtn;
        var plabel = function () { return plays === 0 ? "🔊 Play the sentence" : "🔁 Play again"; };
        pbtn = el("button", { class: "btn primary big listen-play", on: { click: function () { plays++; try { kit().speak(round.targetAudio.value, { rate: round.speed || 1 }); } catch (e) {} pbtn.innerHTML = plabel(); } } });
        pbtn.innerHTML = plabel();
        children.push(el("div", { class: "scr-player-audio" }, [el("div", { class: "listen-emoji", text: "🎧" }), pbtn]));
      }
      children.push(answerRow, bankRow);
      submitBtn = el("button", { class: "btn primary scr-submit", text: "Submit", attrs: { disabled: "true" }, on: { click: function () { if (built.length !== tiles.length) return; api.submit({ words: built.map(function (p) { return tiles[p]; }) }); } } });
      children.push(submitBtn);
      renderAnswer();
      return el("div", { class: "scr-player" }, children);
    },
    score: function (round, payload, elapsedMs, timeLimit) {
      var built = (payload && payload.words) || [];
      var ok = built.join(" ") === (round.correctWords || []).join(" ");
      if (!ok) return { correct: false, points: 0 };
      var frac = Math.max(0, 1 - elapsedMs / timeLimit);
      return { correct: true, points: Math.round(500 + 500 * frac) };
    },
    correctLabel: function (round) { return round.answer; },
    speakOnReveal: function (round) { return round.answer; },
    // Speed Challenge: the hint block rides on the phone. Listen-unscramble
    // needs no extra prompt node — playerContent already shows the play button
    // whenever targetAudio is present (it ships only in speed sets for Live).
    phonePrompt: function (el, round) {
      if (round.mode === "listen-unscramble") return null;
      return tfBlockNode(el, round.context, "context", round.mode === "question-answer" ? "Question" : "Meaning", round.speed);
    }
  };

  /* ---- Hangman (Galgenmännchen) — spell the word a REFERENCE block describes ----
     Every round carries a reference (text / audio / image / icon, the shared
     Wahr-oder-Falsch block) shown on the board; the phone shows the blanks + a
     letter grid and guesses exactly as before. The target `word` rides on the
     round (needed for local letter-checking) but is never displayed until it's
     guessed — the same way Lücken-Text type mode ships its answer. */
  var HANG_ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÜ".split("");
  var HANG_MAX_WRONG = 6;
  var HANG_FACES = ["😀", "🙂", "😐", "😟", "😧", "😨", "💀"];
  function hangIsLetter(ch) { return /[A-ZÄÖÜ]/.test(ch); }
  var hangmanAdapter = {
    meta: { name: "Hangman", emoji: "🔤", contentType: "hangman" },
    timeLimit: 45000,
    pickLabel: "Exercise",
    hangman: true,
    statefulPlayer: true,
    getTopics: function () {
      var store = window.ContentStore;
      var list = (store && store.exercisesFor) ? store.exercisesFor("hangman") : [];
      return list.map(function (e) {
        var n = (e.items || []).filter(function (it) { return it && String(it.word || "").trim(); }).length;
        return { id: e.id, name: e.name, emoji: e.emoji || "🔤", english: n + (n === 1 ? " word" : " words") };
      });
    },
    buildRounds: function (topic) {
      var store = window.ContentStore;
      var e = (store && store.exercise) ? store.exercise("hangman", topic && topic.id) : null;
      var items = ((e && e.items) || []).filter(function (it) { return it && String(it.word || "").trim() !== ""; });
      return kit().sample(items, Math.min(10, items.length)).map(function (it) {
        return {
          type: "hangman",
          reference: { type: (it.reference && it.reference.type) || "text", value: String((it.reference && it.reference.value) || "") },
          word: String(it.word).trim()
        };
      });
    },
    hostContent: function (el, round) {
      return el("div", { class: "hang-host" }, [
        el("div", { class: "hang-tag", text: "🔤 Spell the German word" }),
        tfBlockNode(el, round.reference, "reference", "Clue"),
        el("div", { class: "hang-hostnote", text: "Students guess the letters on their phones." })
      ]);
    },
    playerContent: function (el, round, api) {
      var full = String(round.word || "");
      var letters = full.toUpperCase().split("");
      var guessed = {}, wrong = 0, done = false;
      var faceEl = el("div", { class: "hang-face", text: HANG_FACES[0] });
      var heartsEl = el("div", { class: "hang-hearts", text: "❤️".repeat(HANG_MAX_WRONG) });
      var wordRow = el("div", { class: "hang-word" });
      var kb = el("div", { class: "keyboard" });
      var keyBtns = {};
      function renderWord() {
        wordRow.innerHTML = "";
        letters.forEach(function (ch) {
          if (!hangIsLetter(ch)) { wordRow.appendChild(el("span", { class: "hang-space", text: ch === " " ? "·" : ch })); return; }
          var show = !!guessed[ch] || done;
          wordRow.appendChild(el("span", { class: "hang-slot" + (show ? " filled" : ""), text: show ? ch : "" }));
        });
      }
      function finish(won) {
        if (done) return; done = true;
        renderWord();
        api.submit({ solved: won, wrong: wrong });
      }
      function guess(L) {
        if (guessed[L] || done) return;
        guessed[L] = true;
        var btn = keyBtns[L];
        if (btn) { btn.disabled = true; }
        if (letters.indexOf(L) >= 0) {
          if (btn) btn.classList.add("right");
          try { kit().beep && kit().beep("good"); } catch (e) {}
          renderWord();
          if (letters.filter(hangIsLetter).every(function (c) { return guessed[c]; })) return finish(true);
        } else {
          wrong++;
          if (btn) btn.classList.add("miss");
          faceEl.textContent = HANG_FACES[Math.min(wrong, HANG_FACES.length - 1)];
          heartsEl.textContent = "❤️".repeat(Math.max(0, HANG_MAX_WRONG - wrong));
          try { kit().beep && kit().beep("bad"); } catch (e) {}
          if (wrong >= HANG_MAX_WRONG) return finish(false);
        }
      }
      HANG_ALPHABET.forEach(function (L) {
        var btn = el("button", { class: "key", attrs: { type: "button" }, text: L, on: { click: function () { guess(L); } } });
        keyBtns[L] = btn; kb.appendChild(btn);
      });
      renderWord();
      return el("div", { class: "hang-player" }, [
        el("div", { class: "hang-status" }, [faceEl, heartsEl]),
        wordRow, kb
      ]);
    },
    score: function (round, payload, elapsedMs, timeLimit) {
      if (!payload || !payload.solved) return { correct: false, points: 0 };
      var wrong = payload.wrong || 0;
      var heartsFrac = Math.max(0, (HANG_MAX_WRONG - wrong) / HANG_MAX_WRONG);
      var frac = Math.max(0, 1 - elapsedMs / timeLimit);
      // Solving scores; fewer wrong guesses + faster = more. (Matches the solo feel.)
      return { correct: true, points: Math.round(400 + 300 * heartsFrac + 300 * frac) };
    },
    correctLabel: function (round) { return round.word; },
    speakOnReveal: function (round) { return round.word; },
    // Speed Challenge: the clue block rides on the phone (self-paced).
    phonePrompt: function (el, round) {
      return tfBlockNode(el, round.reference, "reference", "Clue", round.speed);
    }
  };

  window.LiveGames = {
    quiz: choiceAdapter({ name: "Quiz-Blitz", emoji: "🎯", contentType: "vocab" }),
    passage: passageAdapter,
    truefalse: truefalseAdapter,
    scramble: scrambleAdapter,
    hangman: hangmanAdapter,
    memory: choiceAdapter({ name: "Memory Match", emoji: "🧩", contentType: "vocab" }),
    cases: blanksAdapter,
    wortmonster: compoundAdapter,
    listen: listenAdapter,
    hoerpaare: hoerpaareAdapter
  };
})();

/* =====================================================================
   LiveMode — Live Class Mode controller (host + player).
   Renders into the app's #screen container. Talks to Firestore via
   LiveDB and to per-game adapters via LiveGames. The correct answer is
   NEVER written to the player-readable session doc during a question, so
   phones can't peek — the host holds the answers and scores each round.
   ===================================================================== */
window.LiveMode = (function () {
  var C, el, kit, store, goBack;
  var unsubs = [];

  function stop() {
    // Silence any audio when leaving/changing a Live screen (host listen clip,
    // reveal pronunciation, player match audio) — it must not outlive the screen.
    try { if (window.VoiceBox && window.VoiceBox.stop) window.VoiceBox.stop(); } catch (e) {}
    unsubs.forEach(function (u) { try { u(); } catch (e) {} });
    unsubs = [];
  }
  function track(u) { unsubs.push(u); return u; }
  function show(node) { C.innerHTML = ""; C.appendChild(node); }
  function screen(cls, children) { return el("div", { class: "live " + (cls || "") }, children); }

  // Rebuild a sentence with the blank filled in (article highlighted) — used on
  // the reveal so students see the full, correct sentence.
  function filledSentence(sentence, article) {
    return String(sentence).split(/(\s+)/).map(function (tok) {
      if (/^\s+$/.test(tok)) return document.createTextNode(tok);
      if (tok.indexOf("___") >= 0) return el("span", { class: "rs-fill", text: article });
      return el("span", { text: tok });
    });
  }

  // Lücken-Text reveal: the sentence with every numbered blank replaced by its
  // correct word, each highlighted. `filled` maps blank id -> shown text/class.
  function blanksFilled(sentence, filled) {
    return String(sentence).split(/(___\d+___)/).map(function (part) {
      var m = /^___(\d+)___$/.exec(part);
      if (m) {
        var f = filled(parseInt(m[1], 10));
        return el("span", { class: f.cls, text: f.text });
      }
      return part ? el("span", { text: part }) : document.createTextNode("");
    });
  }

  // A self-contained countdown bar shared by the board and the phones (Per-Question
  // and Speed Challenge Timer Modes). Returns the DOM node plus controls. It calls
  // onExpire exactly once when it hits zero. pause() freezes the remaining time and
  // resume() continues — used so re-showing a passage never eats a student's time.
  function makeCountdown(totalSecs, onExpire) {
    var wrap = document.createElement("div");
    wrap.className = "live-timer";
    var fill = document.createElement("div");
    fill.className = "live-timer-fill";
    var lbl = document.createElement("div");
    lbl.className = "live-timer-num";
    wrap.appendChild(fill); wrap.appendChild(lbl);
    var total = Math.max(1, totalSecs || 1) * 1000;
    // Test-only time compression (window.__TIMER_SCALE__): production leaves this
    // unset so clocks run in real seconds; tests set e.g. 0.03 to make a 10s timer
    // expire in ~300ms so auto-reveal / clock-end paths are exercised quickly.
    try { if (window.__TIMER_SCALE__ > 0) total = Math.round(total * window.__TIMER_SCALE__); } catch (e) {}
    var remaining = total;    // ms left as of the last (re)start
    var since = null;         // Date.now() while running, else null (paused/stopped)
    var iv = null, fired = false;
    function leftMs() {
      var r = remaining - (since != null ? (Date.now() - since) : 0);
      return r < 0 ? 0 : r;
    }
    function paint() {
      var r = leftMs();
      fill.style.width = Math.round((r / total) * 100) + "%";
      lbl.textContent = Math.ceil(r / 1000) + "s";
      if (r <= 8000) wrap.classList.add("urgent"); else wrap.classList.remove("urgent");
      if (r <= 0 && !fired) { fired = true; stop(); try { if (onExpire) onExpire(); } catch (e) {} }
    }
    function start() { if (fired) return; if (since == null) since = Date.now(); if (!iv) iv = setInterval(paint, 100); paint(); }
    function pause() { if (since != null) { remaining = leftMs(); since = null; } }
    function resume() { if (!fired && since == null) { since = Date.now(); } }
    function stop() { if (iv) { clearInterval(iv); iv = null; } }
    return { node: wrap, start: start, pause: pause, resume: resume, stop: stop, leftMs: leftMs };
  }

  /* ---------- entry ---------- */
  function start(container, api) {

            }, [el("div", { class: "setup-emoji", text: t.emoji }), el("div", { text: t.name }), t.english ? el("div", { class: "setup-sub", text: t.english }) : null]));

      if (gameId && topic) {
        var gAdapter3 = window.LiveGames[gameId];
        var n = 3;
        // Timer Mode. Match the Following is self-paced per ROUND (each phone

        var isMatchGame = !!gAdapter3.match;
        step.appendChild(el("div", { class: "live-label", text: n + " · Timer mode" }));
        step.appendChild(el("div", { class: "setup-modes" }, [
          timerPill("manual", "Manual reveal", isMatchGame ? "Teacher ends each round" : "Teacher reveals each answer"),
          timerPill("per_question", isMatchGame ? "Per-round timer" : "Per-question timer", isMatchGame ? "A countdown on every round" : "A countdown on every question"),
          isMatchGame ? null : timerPill("speed", "Speed Challenge", "One clock — students race the whole set")
        ]));
        if (timerMode === "per_question") {
          step.appendChild(secondsSlider(isMatchGame ? "Seconds per round" : "Seconds per question", perQuestionSecs, PQ_MIN, PQ_MAX, 1, secsLabel, function (v) { perQuestionSecs = v; }));
        } else if (timerMode === "speed" && !isMatchGame) {
          step.appendChild(secondsSlider("Total time for the whole set", speedSecs, SPEED_MIN, SPEED_MAX, 5, minsLabel, function (v) { speedSecs = v; }));
        }
        n++;
        if (gAdapter3.supportsTyping) {
          var tl = gAdapter3.typeLabels || { options: ["Tap the article", "Multiple choice — faster"], type: ["Type the article", "Free recall — harder"] };
          step.appendChild(el("div", { class: "live-label", text: n + " · How students answer" }));
          if (timerMode === "speed") {
            // Speed Challenge sends every question to the phone up front; type mode
            // would ship the answer too (peekable). Lock to tap and say why.
            answerMode = "options";
            step.appendChild(el("div", { class: "setup-modes" }, [answerPill("options", tl.options[0], tl.options[1])]));
            step.appendChild(el("p", { class: "live-muted setup-note", text: "Speed Challenge uses tap answers so nobody can peek ahead." }));
          } else {
            step.appendChild(el("div", { class: "setup-modes" }, [
              answerPill("options", tl.options[0], tl.options[1]),
              answerPill("type", tl.type[0], tl.type[1])
            ]));
          }
          n++;
        }
        // Some games only want the speed picker for certain exercises (e.g. a
        // Passage only when its passage is audio) — respect an optional wantsSpeed.
        var showSpeed = gAdapter3.audioSpeed && (!gAdapter3.wantsSpeed || gAdapter3.wantsSpeed(topic));
        if (showSpeed) {
          var isPassageAudio = gameId === "passage";
          step.appendChild(el("div", { class: "live-label", text: n + (isPassageAudio ? " · Passage speed" : " · Audio speed") }));
          var speedRow = el("div", { class: "setup-modes" }, SPEEDS.map(function (s) {
            return el("button", {
              class: "mode-pill" + (speed === s.v ? " sel" : ""),
              on: { click: function () { speed = s.v; renderStep(); } }
            }, [el("b", { text: s.label }), el("span", { text: s.sub })]);
          }));
          step.appendChild(speedRow);
          step.appendChild(el("div", { class: "setup-preview" }, [
            el("span", { class: "live-muted", text: "Preview at " + speed + "×:" }),
            isPassageAudio
              ? el("button", { class: "btn ghost", html: "▶ Passage", attrs: { title: "Hear the passage at this speed" }, on: { click: function () { preview("sentence"); } } })
              : el("button", { class: "btn ghost", html: "▶ Word", attrs: { title: "Hear a word at this speed" }, on: { click: function () { preview("word"); } } }),
            isPassageAudio ? null
              : el("button", { class: "btn ghost", html: "▶ Sentence", attrs: { title: "Hear a full sentence at this speed" }, on: { click: function () { preview("sentence"); } } })
          ]));
          n++;
        }
        step.appendChild(el("div", { class: "live-label", text: n + " · Scoreboard" }));
        var modeRow = el("div", { class: "setup-modes" }, [
          modeBtn("fresh", "Start fresh", opts.freshSub || "Leaderboard resets to zero"),
          modeBtn("continue", opts.continueLabel || "Continue", opts.continueSub || "Add to this class's running scores")
        ]);
        step.appendChild(modeRow);
        step.appendChild(el("button", { class: "btn primary big", text: opts.startLabel || "Start room ▶", on: { click: doStart } }));
      }

      function answerPill(id, title, sub) {
        return el("button", {
          class: "mode-pill" + (answerMode === id ? " sel" : ""),
          on: { click: function () { answerMode = id; renderStep(); } }
        }, [el("b", { text: title }), el("span", { text: sub })]);
      }

      function timerPill(id, title, sub) {
        return el("button", {
          class: "mode-pill" + (timerMode === id ? " sel" : ""),
          on: { click: function () { timerMode = id; renderStep(); } }
        }, [el("b", { text: title }), el("span", { text: sub })]);
      }

      function secsLabel(v) { return v + "s"; }
      function minsLabel(v) {
        if (v < 60) return v + "s";
        var m = Math.floor(v / 60), s = v % 60;
        return s ? m + "m " + s + "s" : m + " min";
      }
      // A scroller (slider) PLUS a manual number box for the per-question /
      // total-time control — drag to dial any value between min…max, or just type
      // the exact seconds. The two stay in sync and both feed `onSet(v)`. Updates
      // happen in place WITHOUT re-rendering the setup (a re-render mid-drag would
      // drop the slider), and clamping only snaps the number box on blur so typing
      // a multi-digit value (e.g. "120") isn't fought mid-keystroke.
      function secondsSlider(labelText, current, min, max, stepv, fmt, onSet) {
        var valLbl = el("span", { class: "setup-secs-val", text: fmt(current) });
        var slider = el("input", { class: "setup-secs-slider", attrs: { type: "range", min: String(min), max: String(max), step: String(stepv), value: String(current), "aria-label": labelText } });
        var numInput = el("input", { class: "setup-secs-input", attrs: { type: "number", min: String(min), max: String(max), step: String(stepv), value: String(current), "aria-label": labelText + " (seconds)" } });
        function apply(v, from) {
          if (isNaN(v)) return;
          var c = Math.round(v);
          if (c < min) c = min; if (c > max) c = max;
          onSet(c);
          valLbl.textContent = fmt(c);
          slider.value = String(c);
          if (from !== "num") numInput.value = String(c); // don't fight the typist
        }
        slider.addEventListener("input", function () { apply(parseInt(slider.value, 10), "slider"); });
        numInput.addEventListener("input", function () { var v = parseInt(numInput.value, 10); if (!isNaN(v)) apply(v, "num"); });
        numInput.addEventListener("change", function () {
          var v = parseInt(numInput.value, 10);
          if (isNaN(v)) v = current;
          if (v < min) v = min; if (v > max) v = max;
          numInput.value = String(v); apply(v, "slider"); // snap the box into range
        });
        return el("div", { class: "setup-secs" }, [
          el("div", { class: "setup-secs-head" }, [
            el("div", { class: "setup-secs-label", text: labelText }),
            valLbl
          ]),
          el("div", { class: "setup-secs-scroller" }, [
            el("span", { class: "setup-secs-end", text: fmt(min) }),
            slider,
            el("span", { class: "setup-secs-end", text: fmt(max) })
          ]),
          el("div", { class: "setup-secs-manual" }, [
            el("span", { class: "setup-secs-manual-lbl", text: "Or type exactly:" }),
            numInput,
            el("span", { class: "setup-secs-unit", text: "sec" })
          ])
        ]);
      }

      function modeBtn(id, title, sub) {
        return el("button", {
          class: "mode-pill" + (persistMode === id ? " sel" : ""),
          on: { click: function () { persistMode = id; renderStep(); } }
        }, [el("b", { text: title }), el("span", { text: sub })]);
      }

      // Play a sample WORD or SENTENCE at the selected speed, so the teacher can
      // judge the pace for both short prompts and connected speech. Samples come
      // from the chosen exercise (split by whether they contain a space), with a
      // sensible fallback if the exercise has none of that kind yet.
      function preview(kind) {
        var words = [], sentences = [];
        try {
          var ex = store.exercise && store.exercise(gameId === "listen" ? "listening" : gameId, topic && topic.id);
          var items = ((ex && (ex.items || ex.words)) || []).slice();
          // Hör-Paare keeps its words inside each question — flatten them in too.
          if (ex && Array.isArray(ex.questions)) {
            ex.questions.forEach(function (q) { (q.words || []).forEach(function (w) { items.push(w); }); });
          }
          items.forEach(function (it) {
            var t = it && (it.word || it.de);
            if (!t) return;
            (/\s/.test(String(t).trim()) ? sentences : words).push(t);
          });
          // A Passage's audio IS the passage — preview it directly.
          if (ex && ex.passage && ex.passage.value) sentences.unshift(String(ex.passage.value));
        } catch (e) {}
        var pool = kind === "sentence" ? sentences : words;
        var fallback = kind === "sentence" ? "Heute lernen wir zusammen ein bisschen Deutsch." : "Kirche";
        var text = pool.length ? pool[Math.floor(Math.random() * pool.length)] : fallback;
        kit.speak(text, { rate: speed });
      }
    }
    renderStep();

    function doStart() {
      var adapter = window.LiveGames[gameId];
      var rounds = adapter.buildRounds(topic);
      if (!rounds.length) { alert("This topic has no usable content."); return; }
      if (adapter.audioSpeed) rounds.forEach(function (r) { r.speed = speed; });
      // Match supports Manual and the per-round countdown; only Speed (whose
      // up-front question set can't drive the match board) is clamped away.
      var tm = (adapter.match && timerMode === "speed") ? "manual" : timerMode;
      var am = (tm === "speed" && adapter.supportsTyping) ? "options" : answerMode;
      opts.onStart({
        gameId: gameId, topic: topic, answerMode: am, persistMode: persistMode,
        adapter: adapter, rounds: rounds, speed: speed,
        timerMode: tm, perQuestionSecs: perQuestionSecs, speedSecs: speedSecs
      });
    }
  }

  function hostSetup(roster) {
    gamePicker({
      title: roster.name,
      sub: "Pick a game and a topic, then start the room.",
      startLabel: "Start room ▶",
      back: hostRosters,
      onStart: function (sel) {
        // Host keeps the full rounds (with answers) in memory only.
        var seed = { scores: {} };
        var afterSeed = function () {
          window.LiveDB.createSession({
            rosterId: roster.id, rosterName: roster.name, students: roster.students,
            gameId: sel.gameId, gameName: sel.adapter.meta.name, topicName: sel.topic.name,
            status: "lobby", questionIndex: -1, totalQuestions: sel.rounds.length,
            round: null, reveal: null, scores: seed.scores, persistMode: sel.persistMode,
            answerMode: sel.answerMode, gameSeq: 0,
            timerMode: sel.timerMode, perQuestionSecs: sel.perQuestionSecs, speedSecs: sel.speedSecs
          }).then(function (code) {
            hostRun(code, sel.adapter, sel.rounds, roster);
          }).catch(function (e) { alert("Could not start: " + e.message); });
        };
        if (sel.persistMode === "continue") {
          window.LiveDB.getLeaderboard(roster.id).then(function (lb) { seed.scores = lb.scores || {}; afterSeed(); });
        } else afterSeed();
      }
    });
  }

  /* ============================================================
     HOST — run the session (lobby → questions → podium)
     ============================================================ */
  function hostRun(code, adapter, rounds, roster, opts) {
    stop();
    // "Play another game": the class is ALREADY in this room, so the next game
    // must start straight away — no second join-lobby, no extra Start tap.
    // Connected phones follow the session doc into the new game on their own;
    // a dropped phone rejoins mid-game via the landing rejoin button / name grid.
    var autoStart = !!(opts && opts.autoStart);
    // Back closes the room; confirm while a question/reveal is on screen (mid-game).
    window.AppNav.set(function () { closeRoom(); }, function () { return !!document.querySelector(".host-controls, .reveal-answer"); });
    var sess = null;
    var answersUnsub = null;
    var latestAnswers = []; // answers delivered by the live listener for the current question
    var timer = null;
    var TL = adapter.timeLimit || 20000;
    var hostRenderedQ = -1; // host question screen is built once per round; later
                            // answers only update the counter, never rebuild the DOM
    var hostPhase = "lobby"; // "lobby" | "passage" | "question" | "reveal" | "speed"
                             // | "podium". Once the teacher reveals, late-arriving
                             // answer/progress snapshots must NOT rebuild the
                             // question screen over the reveal —
                             // renderQuestion/renderMatchHost bail unless we're
                             // actually in the question phase.
    var hostCountdown = null; // Per-Question mode: the board's countdown for the
                              // current question (drives the auto-reveal on expiry).
    var hostSpeedCountdown = null; // Speed Challenge: the single shared clock.
    var speedAnswersUnsub = null;  // Speed Challenge: listener over ALL answers.
    var speedRenderedOnce = false; // Speed board built once, then refreshed in place.
    var speedFinished = false;     // finishSpeed() is idempotent (clock / all-done / button).

    // Timer Mode config — read from the session doc (written at setup). The board
    // is the single authority on advancement in every mode, so these just choose
    // WHICH pacing the shared flow uses.
    function timerMode() { return (sess && sess.timerMode) || "manual"; }
    function perQSecs() { return (sess && sess.perQuestionSecs) || 20; }
    function speedSecs() { return (sess && sess.speedSecs) || 120; }

    // Every write that moves the room forward runs inside a click handler. The
    // Firestore SDK throws SYNCHRONOUSLY on invalid data (e.g. an `undefined`
    // field slipping into a payload) — unguarded, that throw aborts the click
    // handler mid-flight and freezes the host screen (this is exactly how the
    // Reveal button died). Guard the sync throw AND the async rejection: the
    // host screen must always advance; a lost write is re-synced by the next.
    function safeUpdate(data) {
      try {
        var p = window.LiveDB.updateSession(code, data);
        if (p && p.catch) p.catch(function () {});
      } catch (e) {}
    }

    // The Passage game sequences DIFFERENT formats — each round carries `fmt` (the
    // format's LiveGames key). Every per-round render/score call resolves the
    // adapter through here: a normal single-format session has no `fmt`, so it
    // falls back to the session `adapter` and behaves exactly as before.
    function adapterForRound(r) { return (r && r.fmt && window.LiveGames[r.fmt]) || adapter; }
    // The passage (text/audio) rides only on the in-memory round — never written
    // to the session doc, so it can never reach a phone. Kept here for the
    // passage-first screen and the "Show passage again" overlay. passageSpeed is
    // the teacher's chosen playback rate (doStart stamps r.speed on every round).
    var passageInfo = null, passageSpeed = 1;
    (rounds || []).some(function (r) { if (r && r.passage) { passageInfo = r.passage; passageSpeed = r.speed || 1; return true; } return false; });

    // ---- Live presence (who has actually claimed a name) --------------------
    // Each claimed slot is a sessions/{code}/joined/{id} doc with a heartbeat the
    // student refreshes. A slot is "present" only while its heartbeat is fresh;
    // once a phone dies the heartbeat stops and the name frees up. This drives
    // the lobby's joined / "still missing" split, the answered denominators, and
    // the disconnected markers.
    var joinedList = [];
    var STALE = window.LiveDB.JOIN_STALE_MS || 15000;
    function present() {
      var now = Date.now();
      return joinedList.filter(function (j) { return j.name && (now - j.heartbeat) < STALE; });
    }
    function presentMap() { var m = {}; present().forEach(function (j) { m[j.id] = j.name; }); return m; }
    function presentCount() { return present().length; }
    function onPresence() {
      if (!sess) return;
      if (hostPhase === "lobby") return hostLobby();
      // Mid-game: refresh the answered denominator / board markers in place.
      if (hostPhase === "question" && sess.round) renderQuestion(sess.round.index, rounds[sess.round.index], (latestAnswers || []).length);
      if (hostPhase === "speed") return renderSpeedHost();
    }
    track(window.LiveDB.listenJoined(code, function (arr) { joinedList = arr; onPresence(); }));
    // Heartbeats stop silently on disconnect (no write), so poll to notice names
    // going stale even when no snapshot arrives.
    var presenceTimer = setInterval(onPresence, 3000);
    track(function () { clearInterval(presenceTimer); });

    track(window.LiveDB.listenSession(code, function (s) {
      sess = s;
      if (!s) return;
      if (s.status === "lobby") {
        if (autoStart) {
          // Consume the flag first: this runs once, on the snapshot of the
          // new game's own "lobby" write, then takes the exact same path as
          // the lobby's Start button.
          autoStart = false;
          if (adapter.passage) hostPassage(); else beginQuestions();
          return;
        }
        hostLobby();
      }
    }));

    function hostLobby() {
      hostPhase = "lobby";
      var roster = sess.students || [];
      var pm = presentMap();
      var joinedNames = roster.filter(function (s) { return pm[s.id]; });
      var missing = roster.filter(function (s) { return !pm[s.id]; });
      show(screen("host", [
        el("div", { class: "roomcode-wrap" }, [
          el("div", { class: "roomcode-label", text: "Join at this screen's URL — room code:" }),
          el("div", { class: "roomcode", text: code })
        ]),
        el("div", { class: "join-count", text: joinedNames.length + " of " + roster.length + " joined" }),
        joinedNames.length
          ? el("div", { class: "join-chips" }, joinedNames.map(function (s) { return el("span", { class: "join-chip", text: s.name }); }))
          : null,
        // Live "still missing" list — updates in real time as students join and,
        // if a phone drops (heartbeat goes stale), the name reappears here.
        missing.length
          ? el("div", { class: "join-missing" }, [
              el("div", { class: "join-missing-label", text: "⏳ Still missing (" + missing.length + ")" }),
              el("div", { class: "join-chips missing" }, missing.map(function (s) { return el("span", { class: "join-chip out", text: s.name }); }))
            ])
          : el("div", { class: "join-allin", text: "🎉 Everyone's in!" }),
        el("button", { class: "btn primary big", text: "Start game ▶", attrs: joinedNames.length ? {} : { disabled: "true" }, on: { click: (adapter.passage ? hostPassage : beginQuestions) } }),
        el("button", { class: "back-link small", html: "✕ Close room", on: { click: closeRoom } })
      ]));
    }

    // After the lobby (and, for a Passage game, after the shared passage step),
    // pacing splits: Speed Challenge runs the student-paced flow; Manual and
    // Per-Question run the shared question-by-question flow. For a Passage game
    // this is called only when the teacher taps "Start questions", so the Speed
    // clock begins AFTER the shared passage viewing (never counts against it).
    function beginQuestions() {
      if (timerMode() === "speed") return hostSpeed();
      return nextQuestion();
    }

    /* ---- Passage (Lese & Hör): the passage is shown ONLY on the host screen.
       It is never written to the session doc, so it never reaches a phone. The
       teacher shows it first, then advances to the questions; a "Show passage"
       button re-displays it as a host-only overlay at any time without touching
       the current question's state. */
    function passageBodyNodes(passage) {
      if (!passage) return [el("p", { class: "live-muted", text: "No passage." })];
      if (passage.type === "audio") {
        var plays = 0, btn;
        var label = function () { return (plays === 0 ? "🔊 Play the passage" : "🔁 Play again") + (passageSpeed !== 1 ? "  ·  " + passageSpeed + "×" : ""); };
        btn = el("button", { class: "btn primary big listen-play", on: { click: function () { plays++; try { window.MatchTiles.play(kit, passage, passageSpeed); } catch (e) {} btn.innerHTML = label(); } } });
        btn.innerHTML = label();
        return [el("div", { class: "passage-audio" }, [el("div", { class: "listen-emoji", text: "🎧" }), btn])];
      }
      return [el("div", { class: "passage-text", text: passage.value })];
    }
    function hostPassage() {
      hostPhase = "passage";
      // Phones get a "read on the board" wait — NO passage content is sent.
      safeUpdate({ status: "passage", speedActive: false });
      show(screen("host", [
        el("div", { class: "host-topbar" }, [el("div", { class: "host-q-num", text: "📖 " + (sess.topicName || "Passage") })]),
        el("div", { class: "passage-host" }, [
          el("div", { class: "passage-tag", text: (passageInfo && passageInfo.type === "audio") ? "🎧 Listen to the passage" : "📖 Read the passage" })
        ].concat(passageBodyNodes(passageInfo))),
        el("div", { class: "host-controls" }, [
          el("button", { class: "btn primary big", text: "Start questions ▶", on: { click: beginQuestions } })
        ])
      ]));
    }
    // Host-only overlay — sits ON TOP of the current screen (appended to <body>,
    // not via show()), so the question underneath keeps its state and no session
    // write happens (phones are untouched).
    var passageOverlay = null;
    function showPassageOverlay(passage) {
      if (passageOverlay) return;
      pauseClock(); // re-reading must never cost points (no-op until Timer Modes exists)
      passageOverlay = el("div", { class: "passage-overlay" }, [
        el("div", { class: "passage-overlay-card" }, [
          el("div", { class: "passage-tag", text: (passage && passage.type === "audio") ? "🎧 Listen again" : "📖 Read again" })
        ].concat(passageBodyNodes(passage)).concat([
          el("button", { class: "btn primary big", text: "Close ✕", on: { click: closePassageOverlay } })
        ]))
      ]);
      document.body.appendChild(passageOverlay);
    }
    function closePassageOverlay() {
      if (passageOverlay) { try { passageOverlay.remove(); } catch (e) {} passageOverlay = null; }
      try { if (window.VoiceBox && window.VoiceBox.stop) window.VoiceBox.stop(); } catch (e) {}
      resumeClock();
    }
    // Timer-pause hooks: re-showing the passage must never eat a student's time.
    // Pause whichever clock is live (the per-question countdown or the Speed
    // Challenge clock) on both the board AND the phones (qPaused flag), and resume
    // together when the overlay closes. A no-op in Manual mode (no clock).
    function pauseClock() {
      if (hostCountdown) hostCountdown.pause();
      if (hostSpeedCountdown) hostSpeedCountdown.pause();
      safeUpdate({ qPaused: true });
    }
    function resumeClock() {
      if (hostCountdown) hostCountdown.resume();
