<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Skillbee Deutsch Games — Gamify your German lessons</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%233b4de8'/></svg>" />
<style>
/* =====================================================================
   Skillbee Deutsch Games — STYLES
   Bright, friendly, high-contrast for classroom projectors.
   ===================================================================== */
:root {
  --bg: #f4f7fb;
  --bg-grad-1: #eef2ff;
  --bg-grad-2: #fef6f0;
  --ink: #1f2a44;
  --ink-soft: #5a6b8c;
  --card: #ffffff;
  --line: #e6ebf4;
  --brand: #ffb703;         /* gold — used only for the points/score reward badge */
  --brand-ink: #7a4f00;
  --skb: #3b4de8;           /* Skillbee brand blue */
  --skb-dark: #2a38c4;
  --skb-tint: #eef0ff;
  --accent: var(--skb);     /* primary interactive / brand color */
  --accent-dark: var(--skb-dark);
  --good: #2ec4b6;
  --bad: #ff5964;
  --radius: 18px;
  --shadow: 0 10px 30px rgba(31, 42, 68, 0.09);
  --shadow-lg: 0 20px 50px rgba(31, 42, 68, 0.16);
  --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  color: var(--ink);
  background:
    radial-gradient(1200px 600px at 10% -10%, var(--bg-grad-1), transparent 60%),
    radial-gradient(1000px 600px at 110% 0%, var(--bg-grad-2), transparent 55%),
    var(--bg);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

button { font-family: inherit; cursor: pointer; }
kbd {
  background: #fff; border: 1px solid var(--line); border-bottom-width: 2px;
  border-radius: 6px; padding: 1px 6px; font-size: 0.85em; color: var(--ink);
}

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px clamp(14px, 4vw, 40px);
  background: linear-gradient(120deg, var(--skb), var(--skb-dark));
  border-bottom: none;
  box-shadow: 0 6px 20px rgba(42, 56, 196, 0.25);
}
.brand {
  display: flex; align-items: center; gap: 10px;
  background: none; border: 0; font-size: 1.15rem; color: #fff; padding: 4px;
}
.skb-logo { height: 30px; width: auto; display: block; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.18)); }
.brand-text { letter-spacing: .2px; font-weight: 600; }
.brand-text b { color: #fff; font-weight: 800; }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.score-badge {
  display: flex; align-items: center; gap: 6px;
  background: linear-gradient(135deg, #fff3cf, #ffe08a);
  color: var(--brand-ink); font-weight: 800;
  padding: 8px 14px; border-radius: 999px; border: 1px solid #f3d98a;
  box-shadow: var(--shadow);
}
.score-value { min-width: 1.2ch; text-align: center; display: inline-block; }
.score-value.pulse { animation: pop 0.4s ease; }
.icon-btn {
  background: rgba(255, 255, 255, 0.16); border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: 12px; width: 42px; height: 42px; font-size: 1.1rem; color: #fff;
}
.icon-btn:hover { background: rgba(255, 255, 255, 0.28); transform: translateY(-1px); }

/* ---------- screen ---------- */
.screen { padding: clamp(18px, 4vw, 44px); max-width: 1100px; margin: 0 auto; }

/* ---------- hero ---------- */
.hero { text-align: center; margin: 10px 0 26px; }
.hero-title { font-size: clamp(1.8rem, 4.5vw, 3rem); margin: 0 0 8px; letter-spacing: -0.5px; }
.hero-title span { color: var(--accent); }
.hero-sub { color: var(--ink-soft); font-size: clamp(1rem, 2vw, 1.2rem); margin: 0 auto; max-width: 640px; }

/* ---------- game grid (lobby) ---------- */
.game-grid {
  display: grid; gap: 18px;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
}
.game-card {
  position: relative; text-align: left;
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow);
  transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s;
  border-top: 5px solid var(--accent);
  overflow: hidden;
}
.game-card::after {
  content: ""; position: absolute; right: -30px; top: -30px;
  width: 120px; height: 120px; border-radius: 50%;
  background: var(--accent); opacity: 0.07;
}
.game-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
.game-emoji { font-size: 2.6rem; line-height: 1; margin-bottom: 12px; }
.game-name { font-size: 1.3rem; font-weight: 800; margin-bottom: 6px; }
.game-desc { color: var(--ink-soft); font-size: 0.95rem; min-height: 2.6em; }
.game-play { margin-top: 14px; font-weight: 800; color: var(--accent); }

.home-foot { text-align: center; color: var(--ink-soft); margin-top: 34px; font-size: 0.9rem; }

/* ---------- topic picker ---------- */
.picker { text-align: center; margin-bottom: 22px; }
.picker-title { font-size: clamp(1.5rem, 4vw, 2.2rem); margin: 6px 0; }
.picker-sub { color: var(--ink-soft); margin: 0; }
.back-link {
  background: #fff; border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 14px; font-weight: 700; color: var(--ink); box-shadow: var(--shadow);
}
.back-link.small { padding: 6px 10px; font-size: 0.9rem; }
.back-link:hover { border-color: var(--accent); color: var(--accent); }

.topic-grid {
  display: grid; gap: 14px;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
}
.topic-card {
  background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  padding: 18px 12px; text-align: center; box-shadow: var(--shadow);
  transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
}
.topic-card:hover { transform: translateY(-3px); border-color: var(--brand); box-shadow: var(--shadow-lg); }
.topic-emoji { font-size: 2.2rem; }
.topic-name { font-weight: 800; margin-top: 6px; }
.topic-en { color: var(--ink-soft); font-size: 0.85rem; }
.topic-count { margin-top: 8px; font-size: 0.8rem; color: var(--accent); font-weight: 700; }

/* ---------- generic game head ---------- */
.stage { animation: fadeIn 0.25s ease; }
.game-head, .quiz-head {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  margin-bottom: 18px;
}
.head-title { font-weight: 800; font-size: 1.1rem; }
.moves { color: var(--ink-soft); font-weight: 700; }

/* ---------- speaker button ---------- */
.speaker-btn {
  background: #eef6fc; border: 1px solid #d4e8f7; color: var(--accent);
  border-radius: 10px; width: 40px; height: 40px; font-size: 1.05rem;
  vertical-align: middle;
}
.speaker-btn:hover { background: var(--accent); color: #fff; }

/* ---------- buttons ---------- */
.btn {
  border: 1px solid var(--line); background: #fff; color: var(--ink);
  padding: 12px 20px; border-radius: 12px; font-weight: 800; font-size: 1rem;
  box-shadow: var(--shadow); transition: transform 0.12s, box-shadow 0.12s;
}
.btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.btn.primary { background: linear-gradient(135deg, var(--skb), var(--skb-dark)); border-color: var(--skb-dark); color: #fff; }
.btn.ghost { background: transparent; box-shadow: none; }

/* ---------- result card ---------- */
.result-card {
  text-align: center; background: var(--card); border: 1px solid var(--line);
  border-radius: 22px; padding: 40px 24px; box-shadow: var(--shadow-lg);
  max-width: 520px; margin: 30px auto; animation: pop 0.35s ease;
}
.result-card.inline { margin: 20px auto 0; padding: 26px 20px; }
.result-emoji { font-size: 3.6rem; }
.result-card h2 { margin: 8px 0; font-size: 1.6rem; }
.result-score { color: var(--ink-soft); font-size: 1.15rem; }
.result-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 20px; }

/* =====================================================================
   QUIZ
   ===================================================================== */
.quiz-progress { font-weight: 800; }
.quiz-streak { color: var(--bad); font-weight: 800; min-height: 1.2em; }
.timer-bar { height: 10px; background: #e9eef7; border-radius: 999px; overflow: hidden; margin-bottom: 20px; }
.timer-fill { height: 100%; width: 100%; background: linear-gradient(90deg, var(--good), var(--brand), var(--bad)); transition: width 0.06s linear; }
.quiz-question { text-align: center; margin-bottom: 22px; }
.quiz-lang-tag { color: var(--ink-soft); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; font-size: 0.8rem; }
.quiz-word { font-size: clamp(1.8rem, 5vw, 3rem); font-weight: 900; margin: 6px 0; }
.quiz-emoji { font-size: 3rem; }
.quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.quiz-opt {
  display: flex; align-items: center; gap: 12px; text-align: left;
  background: var(--card); border: 2px solid var(--line); border-radius: 16px;
  padding: 18px 20px; font-size: clamp(1rem, 2.2vw, 1.35rem); font-weight: 700;
  box-shadow: var(--shadow); transition: transform 0.12s, border-color 0.12s;
  animation: rise 0.3s backwards; animation-delay: calc(var(--i) * 0.05s);
}
.quiz-opt:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--accent); }
.quiz-opt:disabled { cursor: default; }
.opt-shape { font-size: 1.2rem; }
.quiz-opt.correct { border-color: var(--good); background: #eafaf7; }
.quiz-opt.wrong { border-color: var(--bad); background: #ffeef0; }

/* =====================================================================
   MEMORY
   ===================================================================== */
.memory-board { display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: 12px; max-width: 720px; margin: 0 auto; }
.mem-card { background: none; border: 0; padding: 0; perspective: 800px; aspect-ratio: 3 / 4; }
.mem-inner { position: relative; width: 100%; height: 100%; transition: transform 0.45s; transform-style: preserve-3d; }
.mem-card.flipped .mem-inner, .mem-card.done .mem-inner { transform: rotateY(180deg); }
.mem-front, .mem-back {
  position: absolute; inset: 0; backface-visibility: hidden;
  border-radius: 14px; display: flex; align-items: center; justify-content: center;
  padding: 8px; text-align: center; box-shadow: var(--shadow);
}
.mem-front { background: var(--skb-tint); color: var(--ink); font-size: 2rem; border: 2px solid #d7dcff; }
.mem-logo { width: 56%; height: auto; }
.mem-back {
  transform: rotateY(180deg); background: var(--card); border: 2px solid var(--line);
  font-weight: 800; font-size: clamp(0.85rem, 2vw, 1.15rem); word-break: break-word;
}
.mem-back.de { color: var(--accent); }
.mem-back.en { color: var(--ink); }
.mem-card.done .mem-back { border-color: var(--good); background: #eafaf7; box-shadow: 0 0 0 3px rgba(46,196,182,0.25); }
.mem-card:not(.done):not(.flipped):hover .mem-front { transform: translateY(-3px); }

/* =====================================================================
   HANGMAN
   ===================================================================== */
.hangman { text-align: center; }
.hang-face { font-size: 4.5rem; line-height: 1; margin: 6px 0; }
.hang-hint { color: var(--ink-soft); font-weight: 700; font-size: 1.15rem; margin-bottom: 16px; }
.hang-word { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 24px; }
.hang-slot {
  width: 40px; height: 52px; border-bottom: 4px solid var(--accent);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 1.8rem; font-weight: 900;
}
.hang-slot.filled { animation: pop 0.25s ease; }
.hang-space { width: 22px; color: var(--ink-soft); align-self: flex-end; }
.keyboard { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 640px; margin: 0 auto; }
.key {
  width: 46px; height: 52px; border-radius: 10px; border: 1px solid var(--line);
  background: #fff; font-weight: 800; font-size: 1.1rem; box-shadow: var(--shadow);
  transition: transform 0.1s;
}
.key:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--accent); }
.key.right { background: #eafaf7; border-color: var(--good); color: var(--good); }
.key.miss { background: #ffeef0; border-color: var(--bad); color: var(--bad); opacity: 0.7; }

/* =====================================================================
   SCRAMBLE
   ===================================================================== */
.scramble { text-align: center; }
.scr-hint { color: var(--ink-soft); font-style: italic; font-size: 1.2rem; margin-bottom: 18px; }
.scr-answer {
  min-height: 64px; border: 2px dashed var(--line); border-radius: 14px;
  padding: 12px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center;
  background: #fbfcfe; margin-bottom: 18px;
}
.scr-answer.ok { border-color: var(--good); background: #eafaf7; }
.scr-answer.shake { animation: shake 0.4s; border-color: var(--bad); }
.scr-bank { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 18px; }
.scr-word {
  background: #fff; border: 2px solid var(--line); border-radius: 12px;
  padding: 12px 16px; font-size: clamp(1rem, 2.2vw, 1.3rem); font-weight: 800;
  box-shadow: var(--shadow); transition: transform 0.1s;
  animation: rise 0.3s backwards; animation-delay: calc(var(--i) * 0.04s);
}
.scr-word:hover:not(.used) { transform: translateY(-2px); border-color: var(--accent); }
.scr-word.used { opacity: 0.25; cursor: default; }
.scr-word.chosen { border-color: var(--accent); background: #eef6fc; color: var(--accent); }
.scr-actions { display: flex; gap: 10px; justify-content: center; }

/* =====================================================================
   ADMIN  (Inhalte verwalten)
   ===================================================================== */
.admin { animation: fadeIn 0.25s ease; }
.adm-head { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
.adm-title { margin: 0; font-size: clamp(1.3rem, 3vw, 1.8rem); flex: 1 1 auto; }
.adm-tools { display: flex; gap: 8px; flex-wrap: wrap; }
.btn.small { padding: 8px 12px; font-size: 0.9rem; border-radius: 10px; }
.adm-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
.adm-tab {
  background: #fff; border: 1px solid var(--line); border-radius: 999px;
  padding: 9px 18px; font-weight: 800; color: var(--ink-soft); box-shadow: var(--shadow);
}
.adm-tab.active { background: var(--skb); border-color: var(--skb); color: #fff; }
.adm-hint {
  background: var(--skb-tint); border: 1px solid #dbe0ff; color: #3a4488;
  padding: 12px 16px; border-radius: 12px; font-size: 0.92rem; margin: 0 0 18px;
}
.adm-add { margin-bottom: 16px; }
.adm-empty { color: var(--ink-soft); text-align: center; padding: 20px; }

/* mode tabs (Content bank / Games) sit above everything else */
.adm-modes { margin-bottom: 16px; }
.adm-modes .adm-tab { font-size: 1rem; padding: 10px 20px; }

/* game chooser grid */
.adm-game-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); margin-bottom: 8px; }
.adm-game-card {
  text-align: left; background: var(--card); border: 1px solid var(--line);
  border-top: 4px solid var(--accent); border-radius: 16px; padding: 18px;
  box-shadow: var(--shadow); transition: transform 0.15s, box-shadow 0.15s;
}
.adm-game-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
.adm-game-emoji { font-size: 2rem; }
.adm-game-name { font-weight: 800; margin-top: 6px; }
.adm-game-meta { color: var(--accent); font-weight: 700; font-size: 0.85rem; margin-top: 4px; }

.adm-subhead { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.adm-game-title { margin: 0; font-size: 1.2rem; }

/* include checkbox on a topic in the game view */
.adm-include { display: inline-flex; align-items: center; }
.adm-check { width: 22px; height: 22px; accent-color: var(--skb); cursor: pointer; }
.adm-topic.adm-off { opacity: 0.55; }
.adm-topic.adm-off .adm-count { color: var(--ink-soft); }

.adm-toggle {
  background: #fff; border: 1px solid var(--line); border-radius: 10px;
  padding: 7px 12px; font-weight: 800; color: var(--accent); white-space: nowrap;
}
.adm-toggle:hover { border-color: var(--accent); }
.adm-rows { margin-top: 12px; }

.picker-empty {
  max-width: 520px; margin: 20px auto; text-align: center; color: var(--ink-soft);
  background: var(--skb-tint); border: 1px solid #dbe0ff; border-radius: 12px; padding: 18px;
}

.adm-topic {
  background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow);
}
.adm-topic-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.adm-count { color: var(--accent); font-weight: 800; font-size: 0.85rem; white-space: nowrap; }

.adm-input {
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  font-size: 1rem; font-family: inherit; color: var(--ink); background: #fff; min-width: 0;
}
.adm-input:focus, .adm-emoji:focus { outline: 3px solid rgba(59, 77, 232, 0.25); border-color: var(--skb); }
.adm-input.grow { flex: 1 1 180px; }
.adm-topic-head .adm-input { flex: 1 1 140px; }
.adm-emoji {
  width: 58px; text-align: center; font-size: 1.3rem; border: 1px solid var(--line);
  border-radius: 10px; padding: 8px 4px; background: #fff; font-family: inherit;
}

.adm-row {
  display: grid; grid-template-columns: 58px 1fr 1fr 40px; gap: 8px;
  align-items: center; margin-bottom: 8px;
}
.adm-row-sent { grid-template-columns: 1fr 1fr 40px; }
.adm-row-head { font-size: 0.78rem; font-weight: 800; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
.adm-row-head .adm-emoji-h { text-align: center; }
.adm-del {
  width: 38px; height: 38px; border: 1px solid var(--line); background: #fff;
  border-radius: 10px; color: var(--bad); font-size: 1rem; font-weight: 800;
}
.adm-del:hover { background: #ffeef0; border-color: var(--bad); }
.adm-add-row { margin-top: 6px; }

.adm-toast {
  position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px);
  background: var(--ink); color: #fff; padding: 12px 22px; border-radius: 999px;
  font-weight: 700; box-shadow: var(--shadow-lg); z-index: 60; opacity: 0;
  transition: opacity 0.25s, transform 0.25s;
}
.adm-toast.show { opacity: 1; transform: translate(-50%, 0); }

.foot-admin {
  background: #fff; border: 1px solid var(--line); border-radius: 999px;
  padding: 9px 18px; font-weight: 800; color: var(--accent); box-shadow: var(--shadow);
  margin-bottom: 12px;
}
.foot-admin:hover { border-color: var(--accent); transform: translateY(-1px); }
.foot-note { color: var(--ink-soft); font-size: 0.9rem; }

@media (max-width: 560px) {
  .adm-row { grid-template-columns: 48px 1fr 40px; }
  .adm-row > .adm-input:nth-child(3) { grid-column: 2 / 4; }
  .adm-row-head { display: none; }
}

/* =====================================================================
   MODE SELECT (Solo vs Live)
   ===================================================================== */
.hero-back { position: absolute; }
.mode-grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); max-width: 760px; margin: 10px auto; }
.mode-card {
  text-align: left; background: var(--card); border: 1px solid var(--line);
  border-top: 6px solid var(--accent); border-radius: 20px; padding: 28px;
  box-shadow: var(--shadow); transition: transform 0.15s, box-shadow 0.15s;
}
.mode-card.live { border-top-color: #ff924c; }
.mode-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
.mode-emoji { font-size: 3rem; }
.mode-name { font-size: 1.5rem; font-weight: 900; margin: 10px 0 6px; }
.mode-desc { color: var(--ink-soft); }

/* =====================================================================
   LIVE CLASS MODE — shared
   ===================================================================== */
.live { animation: fadeIn 0.25s ease; }
.live-center { max-width: 640px; margin: 0 auto; text-align: center; }
.live-title { font-size: clamp(1.5rem, 4vw, 2.2rem); margin: 8px 0; text-align: center; }
.live-sub { color: var(--ink-soft); text-align: center; margin: 4px 0 18px; }
.live-muted { color: var(--ink-soft); text-align: center; padding: 14px; }
.live-label { font-weight: 800; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.5px; font-size: 0.8rem; margin: 18px 0 8px; display: block; }
.live-big-emoji { font-size: 3.4rem; line-height: 1; }
.live-card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 34px 24px; box-shadow: var(--shadow-lg); max-width: 480px; margin: 24px auto; }
.btn.big { font-size: 1.2rem; padding: 16px 28px; margin-top: 10px; }

/* landing: Host / Join */
.live-choice { display: grid; gap: 18px; grid-template-columns: 1fr 1fr; margin-top: 20px; }
.live-choice-card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 30px 18px; box-shadow: var(--shadow); transition: transform 0.15s; }
.live-choice-card.host { border-top: 6px solid var(--skb); }
.live-choice-card.join { border-top: 6px solid #ff924c; }
.live-choice-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
.live-choice-name { font-weight: 900; font-size: 1.3rem; margin-top: 10px; }
.live-choice-sub { color: var(--ink-soft); font-size: 0.9rem; margin-top: 4px; }

/* rosters */
.roster-toolbar { display: flex; gap: 10px; flex-wrap: wrap; }
.roster-list { display: flex; flex-direction: column; gap: 10px; margin: 14px 0 18px; }
.roster-row { display: flex; gap: 8px; }

.confetti-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 50; }

/* ==== js/store.js ==== */
/* =====================================================================
   ContentStore — lets teachers edit the game content from inside the app.
   ---------------------------------------------------------------------
   • The built-in content in data.js is the "default".
   • Teacher edits are saved in the browser (localStorage), so they persist
     on that computer even after closing the tab.
   • Export/Import moves content between computers (or to the shared link).
   The games and the topic picker read their content from here, so any edit
   shows up immediately.
   ===================================================================== */
(function () {
  var KEY = "skillbee_deutsch_content_v1";

  function clone(x) {
    return JSON.parse(JSON.stringify(x));
  }

  function defaults() {
    return {
      vocab: clone(window.GameData.VOCAB_TOPICS),
      sentences: clone(window.GameData.SENTENCE_TOPICS),
      // Per-game topic selection. Missing entry / no "topics" list = the game
      // uses ALL topics of its type from the bank (the default).
      games: {}
    };
  }

  var store = {
    data: null,

    load: function () {
      try {
        var raw = localStorage.getItem(KEY);
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.vocab) && Array.isArray(parsed.sentences)) {
            if (!parsed.games || typeof parsed.games !== "object") parsed.games = {};
            this.data = parsed;
            return;
          }
        }
      } catch (e) {
        /* localStorage may be unavailable (e.g. sandboxed) — fall back to defaults */
      }
      this.data = defaults();
    },

    save: function () {
      try {
        localStorage.setItem(KEY, JSON.stringify(this.data));
        return true;
      } catch (e) {
        return false; // still edited in-memory for this session
      }
    },

    reset: function () {
      this.data = defaults();
      try {
        localStorage.removeItem(KEY);
      } catch (e) {}
    },

    isCustomized: function () {
      try {
        return !!localStorage.getItem(KEY);
      } catch (e) {
        return false;
      }
    },

    vocabTopics: function () {
      return this.data.vocab;
    },
    sentenceTopics: function () {
      return this.data.sentences;
    },

    poolFor: function (type) {
      return type === "sentences" ? this.data.sentences : this.data.vocab;
    },

    /* Topics a given game should offer (its selected subset, or all by default). */
    topicsForGame: function (gameId, type) {
      var pool = this.poolFor(type);
      var cfg = this.data.games && this.data.games[gameId];
      if (!cfg || !cfg.topics) return pool;
      var set = {};
      cfg.topics.forEach(function (id) { set[id] = true; });
      return pool.filter(function (t) { return set[t.id]; });
    },

    isTopicInGame: function (gameId, topicId) {
      var cfg = this.data.games && this.data.games[gameId];
      if (!cfg || !cfg.topics) return true; // "all" by default
      return cfg.topics.indexOf(topicId) !== -1;
    },

    setTopicInGame: function (gameId, topicId, type, on) {
      if (!this.data.games) this.data.games = {};
      var cfg = this.data.games[gameId];
      if (!cfg || !cfg.topics) {
        // Was "all" — materialize the full list so unchecking one keeps the rest.
        cfg = { topics: this.poolFor(type).map(function (t) { return t.id; }) };
        this.data.games[gameId] = cfg;
      }
      var i = cfg.topics.indexOf(topicId);
      if (on && i === -1) cfg.topics.push(topicId);
      if (!on && i !== -1) cfg.topics.splice(i, 1);
      this.save();
    },

    /* When a new topic is added from a game view, include it there if that
       game already has an explicit selection (otherwise "all" already covers it). */
    includeTopicIfConfigured: function (gameId, topicId) {
      var cfg = this.data.games && this.data.games[gameId];
      if (cfg && cfg.topics && cfg.topics.indexOf(topicId) === -1) cfg.topics.push(topicId);
    },

    /* Drop a deleted topic id from every game's selection. */
    pruneTopic: function (topicId) {
      var games = this.data.games || {};
      Object.keys(games).forEach(function (gid) {
        var cfg = games[gid];
        if (cfg && cfg.topics) {
          var i = cfg.topics.indexOf(topicId);
          if (i !== -1) cfg.topics.splice(i, 1);
        }
      });
    },

    enabledCount: function (gameId, type) {
      var pool = this.poolFor(type);
      var self = this;
      return pool.filter(function (t) { return self.isTopicInGame(gameId, t.id); }).length;
    },

    newId: function (prefix) {
      return (
        (prefix || "id") +
        "-" +
        Date.now().toString(36) +
        "-" +
        Math.floor(Math.random() * 1e4).toString(36)
      );
    },

    exportJSON: function () {
      return JSON.stringify(this.data, null, 2);
    },

    importJSON: function (text) {
      var parsed = JSON.parse(text);
      if (!parsed || !Array.isArray(parsed.vocab) || !Array.isArray(parsed.sentences)) {
        throw new Error("The file is not in the right format.");
      }
      if (!parsed.games || typeof parsed.games !== "object") parsed.games = {};
      this.data = parsed;
      this.save();
    }
  };

  store.load();
  window.ContentStore = store;
})();


/* ==== js/teacher.js ==== */
/* =====================================================================
   TeacherGate — a lightweight 4-digit PIN that unlocks teacher-only
   actions (hosting a live class, and the content editor).
   • The PIN is stored in Firestore (shared across devices) and cached
     locally, so students on their own phones are actually gated.
   • It is set once by the teacher on first use.
   • Only enforced when online (Firebase available). Offline single-device
     play stays ungated — there's no sharing and edits are local-only.
   • Once entered, it stays unlocked for the browser session.
   ===================================================================== */
window.TeacherGate = (function () {
  var UNLOCK_KEY = "skillbee_teacher_unlocked"; // sessionStorage
  var PIN_CACHE = "skillbee_teacher_pin";       // localStorage (hashed)

  function hashPin(s) {
    var h = 5381;
    for (var i = 0; i < s.length; i++) { h = ((h << 5) + h) + s.charCodeAt(i); h = h & 0xffffffff; }
    return "h" + (h >>> 0).toString(36);
  }

  function gated() { return !!(window.LiveDB && window.LiveDB.available()); }
  function isUnlocked() { try { return sessionStorage.getItem(UNLOCK_KEY) === "1"; } catch (e) { return false; } }
  function unlock() { try { sessionStorage.setItem(UNLOCK_KEY, "1"); } catch (e) {} }
  function lock() { try { sessionStorage.removeItem(UNLOCK_KEY); } catch (e) {} }

  function loadStoredHash() {
    if (gated()) {
      return window.LiveDB.getConfig().then(function (c) {
        var h = c && c.pin ? c.pin : null;
        try { if (h) localStorage.setItem(PIN_CACHE, h); } catch (e) {}
        return h;
      }).catch(function () { try { return localStorage.getItem(PIN_CACHE) || null; } catch (e) { return null; } });
    }
    try { return Promise.resolve(localStorage.getItem(PIN_CACHE) || null); } catch (e) { return Promise.resolve(null); }
  }
  function saveHash(h) {
    try { localStorage.setItem(PIN_CACHE, h); } catch (e) {}
    if (gated()) return window.LiveDB.setConfig({ pin: h });
    return Promise.resolve();
  }

  /* ---- tap-friendly PIN keypad modal ---- */
  function modal(opts) {
    var overlay = document.createElement("div"); overlay.className = "pin-overlay";
    var card = document.createElement("div"); card.className = "pin-card";
    var title = document.createElement("div"); title.className = "pin-title"; title.textContent = opts.title; card.appendChild(title);
    var sub = document.createElement("div"); sub.className = "pin-sub"; sub.textContent = opts.sub || ""; card.appendChild(sub);
    var dots = document.createElement("div"); dots.className = "pin-dots";
    var dotEls = [];
    for (var i = 0; i < 4; i++) { var d = document.createElement("span"); d.className = "pin-dot"; dots.appendChild(d); dotEls.push(d); }
    card.appendChild(dots);
    var errEl = document.createElement("div"); errEl.className = "pin-err"; card.appendChild(errEl);
    var pad = document.createElement("div"); pad.className = "pin-pad";
    var val = "";
    function refresh() { dotEls.forEach(function (d, i) { d.classList.toggle("on", i < val.length); }); }
    function press(n) { if (val.length >= 4) return; val += n; refresh(); if (val.length === 4) { var e = val; setTimeout(function () { opts.onPin(e, api); }, 110); } }
    function del() { val = val.slice(0, -1); refresh(); }
    ["1", "2", "3", "4", "5", "6", "7", "8", "9", "", "0", "⌫"].forEach(function (k) {
      var b = document.createElement("button");
      b.className = "pin-key" + (k === "" ? " empty" : "");
      b.textContent = k;
      if (k === "") b.disabled = true;
      else if (k === "⌫") b.onclick = del;
      else b.onclick = function () { press(k); };
      pad.appendChild(b);
    });
    card.appendChild(pad);
    var cancel = document.createElement("button"); cancel.className = "pin-cancel"; cancel.textContent = "Cancel";
    function close() { overlay.remove(); }
    cancel.onclick = close;
    card.appendChild(cancel);
    overlay.appendChild(card); document.body.appendChild(overlay);
    var api = {
      error: function (m) { errEl.textContent = m; val = ""; refresh(); card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake"); },
      reset: function () { val = ""; refresh(); errEl.textContent = ""; },
      setTitle: function (t) { title.textContent = t; },
      setSub: function (t) { sub.textContent = t; },
      close: close
    };
    return api;
  }

  function createFlow(onOk) {
    var first = null;
    modal({
      title: "Create a teacher PIN",
      sub: "Set a 4-digit PIN. Students won't know it.",
      onPin: function (pin, a) {
        if (first === null) { first = pin; a.reset(); a.setTitle("Re-enter to confirm"); a.setSub(""); }
        else if (pin === first) { saveHash(hashPin(pin)).then(function () { unlock(); a.close(); onOk(); }); }
        else { first = null; a.setTitle("Create a teacher PIN"); a.error("PINs didn't match — start again"); }
      }
    });
  }

  function require(onOk) {
    if (!gated()) return onOk();       // offline: no gate
    if (isUnlocked()) return onOk();
    loadStoredHash().then(function (stored) {
      if (!stored) return createFlow(onOk);
      modal({
        title: "Enter teacher PIN",
        sub: "Ask your teacher if you don't know it.",
        onPin: function (pin, a) {
          if (hashPin(pin) === stored) { unlock(); a.close(); onOk(); }
          else a.error("Wrong PIN");
        }
      });
    });
  }

  function changePin() {
    var first = null;
    modal({
      title: "New teacher PIN",
      sub: "Enter a new 4-digit PIN",
      onPin: function (pin, a) {
        if (first === null) { first = pin; a.reset(); a.setTitle("Confirm new PIN"); a.setSub(""); }
        else if (pin === first) { saveHash(hashPin(pin)).then(function () { unlock(); a.close(); }); }
        else { first = null; a.setTitle("New teacher PIN"); a.error("PINs didn't match"); }
      }
    });
  }

  return { require: require, isUnlocked: isUnlocked, lock: lock, changePin: changePin, gated: gated };
})();


/* ==== js/app.js ==== */
/* =====================================================================
   Skillbee Deutsch Games — CORE APP
   ---------------------------------------------------------------------
   This runs the lobby (home screen), moves between screens, keeps the
   score, and gives every game a shared toolkit (App.kit): shuffling,
   German pronunciation, sounds and confetti.
   (You normally don't need to edit this file to add vocabulary.)
   ===================================================================== */

const App = (function () {
  const games = [];
  let root = null;

  /* ---- tiny helpers to build HTML elements ------------------------- */
  function el(tag, opts = {}, children = []) {
    const node = document.createElement(tag);
    if (opts.class) node.className = opts.class;
    if (opts.html != null) node.innerHTML = opts.html;
    if (opts.text != null) node.textContent = opts.text;
    if (opts.attrs) for (const k in opts.attrs) node.setAttribute(k, opts.attrs[k]);
    if (opts.on) for (const evt in opts.on) node.addEventListener(evt, opts.on[evt]);
    (Array.isArray(children) ? children : [children]).forEach((c) => {
      if (c == null) return;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return node;
  }

  /* ---- shared game toolkit ----------------------------------------- */
  const kit = {
    shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    },
    sample(arr, n) {
      return kit.shuffle(arr).slice(0, n);
    },
    randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    },
    el,

    /* Speak German out loud (browser text-to-speech). */
    speak(text, lang = "de-DE") {
      try {
        if (!("speechSynthesis" in window)) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = lang;
        u.rate = 0.95;
        const voices = window.speechSynthesis.getVoices();
        const de = voices.find((v) => v.lang && v.lang.toLowerCase().startsWith("de"));
        if (de) u.voice = de;
        window.speechSynthesis.speak(u);
      } catch (e) {
        /* ignore — pronunciation is a nice-to-have */
      }
    },

    /* A small "speaker" button that pronounces a German word. */
    speakerButton(text) {
      return el("button", {
        class: "speaker-btn",
        attrs: { "aria-label": "Aussprache anhören", title: "Aussprache anhören" },
        html: "🔊",
        on: {
          click: (e) => {
            e.stopPropagation();
            kit.speak(text);
          }
        }
      });
    },

    /* Simple beeps via the Web Audio API (no sound files needed). */
    beep(type = "good") {
      try {
        if (App.state.muted) return;
        const ctx = (kit._audio = kit._audio || new (window.AudioContext || window.webkitAudioContext)());
        const now = ctx.currentTime;
        const notes =
          type === "good" ? [660, 880] : type === "win" ? [523, 659, 784, 1046] : [220, 160];
        notes.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = type === "bad" ? "sawtooth" : "sine";
          osc.frequency.value = freq;
          const t = now + i * 0.09;
          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
          osc.connect(gain).connect(ctx.destination);
          osc.start(t);
          osc.stop(t + 0.2);
        });
      } catch (e) {
        /* ignore */
      }
    },

    /* Confetti burst on a big win. Pure canvas — no libraries. */
    confetti() {
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const canvas = el("canvas", { class: "confetti-canvas" });
      document.body.appendChild(canvas);
      const ctx = canvas.getContext("2d");
      const resize = () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      };
      resize();
      const colors = ["#ffd60a", "#ff595e", "#1982c4", "#8ac926", "#6a4c93", "#ff924c"];
      const pieces = Array.from({ length: 140 }, () => ({
        x: Math.random() * canvas.width,
        y: -20 - Math.random() * canvas.height,
        r: 4 + Math.random() * 6,
        c: colors[Math.floor(Math.random() * colors.length)],
        vx: -2 + Math.random() * 4,
        vy: 2 + Math.random() * 4,
        rot: Math.random() * Math.PI,
        vr: -0.2 + Math.random() * 0.4
      }));
      let frame = 0;
      (function tick() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach((p) => {
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.vr;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.c;
          ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 0.6);
          ctx.restore();
        });
        frame++;
        if (frame < 160) requestAnimationFrame(tick);
        else canvas.remove();
      })();
    },

    /* Friendly message shown when a topic has no content yet. */
    notice(stage, title, message, api) {
      stage.appendChild(
        el("div", { class: "result-card" }, [
          el("div", { class: "result-emoji", text: "📝" }),
          el("h2", { text: title }),
          el("p", { class: "result-score", text: message }),
          el("div", { class: "result-actions" }, [
            el("button", { class: "btn", text: "Other topic", on: { click: api.backToTopics } }),
            el("button", { class: "btn ghost", text: "Menu", on: { click: api.exit } })
          ])
        ])
      );
    }
  };

  /* ---- score / session state --------------------------------------- */
  const state = {
    score: 0,
    muted: false
  };

  function addScore(points) {
    state.score += points;
    const badge = document.getElementById("score-value");
    if (badge) {
      badge.textContent = state.score;
      badge.classList.remove("pulse");
      void badge.offsetWidth; // restart animation
      badge.classList.add("pulse");
    }
  }

  /* ---- top bar (persistent) ---------------------------------------- */
  function renderTopBar() {
    const bar = el("header", { class: "topbar" }, [
      el("button", {
        class: "brand",
        attrs: { title: "Back to home" },
        on: { click: () => showModeSelect() },
        html:
          '<img class="skb-logo" src="' +
          (window.SkillbeeBrand ? window.SkillbeeBrand.logoWhite : "") +
          '" alt="Skillbee" />' +
          '<span class="brand-text"><b>Deutsch</b> Games</span>'
      }),
      el("div", { class: "topbar-right" }, [
        el("button", {
          class: "icon-btn",
          attrs: { id: "admin-btn", title: "Manage content" },
          html: "⚙️",
          on: { click: () => showAdmin() }
        }),
        el("div", { class: "score-badge", attrs: { title: "Points this session" } }, [
          el("span", { class: "score-star", html: "⭐" }),
          el("span", { class: "score-value", attrs: { id: "score-value" }, text: "0" })
        ]),
        el("button", {
          class: "icon-btn",
          attrs: { id: "mute-btn", title: "Sound on/off" },
          html: "🔊",
          on: {
            click: (e) => {
              state.muted = !state.muted;
              e.currentTarget.innerHTML = state.muted ? "🔇" : "🔊";
            }
          }
        })
      ])
    ]);
    return bar;
  }

  /* ---- home screen (the lobby) ------------------------------------- */
  /* The admin gear is teacher-only: shown in Solo mode, hidden on the mode
     picker and everywhere in Live Mode (so students on phones can't reach it). */
  function setAdminVisible(v) {
    const b = document.getElementById("admin-btn");
    if (b) b.style.display = v ? "" : "none";
  }

  function showModeSelect() {
    if (window.LiveMode) window.LiveMode.stop();
    setAdminVisible(false);
    window.speechSynthesis && window.speechSynthesis.cancel();
    const main = document.getElementById("screen");
    main.innerHTML = "";
    main.appendChild(
      el("section", { class: "hero" }, [
        el("h1", { class: "hero-title", html: 'Skillbee <span>Deutsch</span> Games' }),
        el("p", { class: "hero-sub", text: "Choose how you want to play." })
      ])
    );
    const modeGrid = el("div", { class: "mode-grid" });
    modeGrid.appendChild(
      el("button", { class: "mode-card solo", on: { click: () => showHome() } }, [
        el("div", { class: "mode-emoji", text: "🎮" }),
        el("div", { class: "mode-name", text: "Solo / Offline" }),
        el("div", { class: "mode-desc", text: "Practice on one device — works without internet. Great for a single learner or a station." })
      ])
    );
    modeGrid.appendChild(
      el("button", { class: "mode-card live", on: { click: () => showLive() } }, [
        el("div", { class: "mode-emoji", text: "📡" }),
        el("div", { class: "mode-name", text: "Live Class Mode" }),
        el("div", { class: "mode-desc", text: "Teacher hosts on the smartboard, students play on their phones — room code, live scoring, leaderboard." })
      ])
    );
    main.appendChild(modeGrid);
  }

  function showLive() {
    setAdminVisible(false);
    const main = document.getElementById("screen");
    main.innerHTML = "";
    if (window.LiveMode) {
      window.LiveMode.start(main, { el, kit, store: window.ContentStore, back: () => showModeSelect() });
    }
  }

  function showHome() {
    if (window.LiveMode) window.LiveMode.stop();
    setAdminVisible(true);
    window.speechSynthesis && window.speechSynthesis.cancel();
    const main = document.getElementById("screen");
    main.innerHTML = "";

    main.appendChild(
      el("section", { class: "hero" }, [
        el("button", { class: "back-link hero-back", html: "← Modes", on: { click: () => showModeSelect() } }),
        el("h1", { class: "hero-title", html: 'Welcome! Pick a <span>game</span> 🎲' }),
        el("p", {
          class: "hero-sub",
          text: "Gamify your German lessons — pick a game, choose a topic, and play with the class."
        })
      ])
    );

    const grid = el("div", { class: "game-grid" });
    games.forEach((game) => {
      grid.appendChild(
        el(
          "button",
          {
            class: "game-card",
            attrs: { style: `--accent:${game.color || "#1982c4"}` },
            on: { click: () => openTopicPicker(game) }
          },
          [
            el("div", { class: "game-emoji", text: game.emoji }),
            el("div", { class: "game-name", text: game.name }),
            el("div", { class: "game-desc", text: game.description }),
            el("div", { class: "game-play", html: "Spielen →" })
          ]
        )
      );
    });
    main.appendChild(grid);

    main.appendChild(
      el("footer", { class: "home-foot" }, [
        el("button", {
          class: "foot-admin",
          html: "⚙️ Manage content",
          on: { click: () => showAdmin() }
        }),
        el("div", {
          class: "foot-note",
          html: "Made for Skillbee German teachers · Tip: press <kbd>F11</kbd> for full-screen in class"
        })
      ])
    );
  }

  /* ---- topic picker (shown before a game starts) ------------------- */
  function openTopicPicker(game) {
    const usesSentences = game.contentType === "sentences";
    const topics = window.ContentStore.topicsForGame(game.id, usesSentences ? "sentences" : "vocab");
    const main = document.getElementById("screen");
    main.innerHTML = "";

    main.appendChild(
      el("div", { class: "picker" }, [
        el("button", { class: "back-link", html: "← Back", on: { click: () => showHome() } }),
        el("h2", { class: "picker-title", html: `${game.emoji} ${game.name}` }),
        el("p", { class: "picker-sub", text: usesSentences ? "Choose a topic for the sentences:" : "Choose a vocabulary topic:" })
      ])
    );

    if (!topics.length) {
      main.appendChild(
        el("p", {
          class: "picker-empty",
          html: "No topics are enabled for this game yet. Add or enable topics in <b>⚙️ Manage content → Games</b>."
        })
      );
      return;
    }

    const grid = el("div", { class: "topic-grid" });
    topics.forEach((topic) => {
      const count = usesSentences ? topic.sentences.length : topic.words.length;
      grid.appendChild(
        el(
          "button",
          { class: "topic-card", on: { click: () => launch(game, topic) } },
          [
            el("div", { class: "topic-emoji", text: topic.emoji }),
            el("div", { class: "topic-name", text: topic.name }),
            el("div", { class: "topic-en", text: topic.english }),
            el("div", { class: "topic-count", text: `${count} ${usesSentences ? "sentences" : "words"}` })
          ]
        )
      );
    });
    main.appendChild(grid);
  }

  /* ---- launch a game with a chosen topic --------------------------- */
  function launch(game, topic) {
    const main = document.getElementById("screen");
    main.innerHTML = "";
    const stage = el("div", { class: "stage" });
    main.appendChild(stage);

    const api = {
      kit,
      topic,
      addScore,
      el,
      exit: () => showHome(),
      restart: () => launch(game, topic),
      backToTopics: () => openTopicPicker(game)
    };
    game.mount(stage, api);
  }

  /* ---- admin screen (content editor) ------------------------------- */
  function showAdmin(onExit) {
    // Teacher PIN gate (only enforced online); once unlocked, opens the editor.
    if (window.TeacherGate) window.TeacherGate.require(() => openAdmin(onExit));
    else openAdmin(onExit);
  }

  function openAdmin(onExit) {
    if (window.LiveMode) window.LiveMode.stop();
    setAdminVisible(false);
    window.speechSynthesis && window.speechSynthesis.cancel();
    const main = document.getElementById("screen");
    main.innerHTML = "";
    const container = el("div", { class: "admin" });
    main.appendChild(container);
    if (window.AdminUI) {
      window.AdminUI.mount(container, {
        el,
        kit,
        store: window.ContentStore,
        games: games.map((g) => ({ id: g.id, name: g.name, emoji: g.emoji, color: g.color, contentType: g.contentType })),
        onExit: typeof onExit === "function" ? onExit : () => showHome()
      });
    }
  }

  /* ---- public API -------------------------------------------------- */
  function register(game) {
    games.push(game);
  }

  function init() {
    root = document.getElementById("app");
    // Set the browser-tab icon to the official Skillbee badge.
    if (window.SkillbeeBrand && window.SkillbeeBrand.favicon) {
      let link = document.querySelector('link[rel="icon"]');
      if (!link) {
        link = document.createElement("link");
        link.rel = "icon";
        document.head.appendChild(link);
      }
      link.href = window.SkillbeeBrand.favicon;
    }
    root.appendChild(renderTopBar());
    root.appendChild(el("main", { class: "screen", attrs: { id: "screen" } }));
    // Warm up voices list for speech synthesis.
    if ("speechSynthesis" in window) window.speechSynthesis.getVoices();
    showModeSelect();
  }

  return { register, init, kit, state, addScore, showHome, showAdmin, showModeSelect, showLive, setAdminVisible };
})();

window.App = App;
document.addEventListener("DOMContentLoaded", App.init);


/* ==== js/games/quiz.js ==== */
/* =====================================================================
   GAME: Vokabel-Quiz  (Kahoot-style multiple choice)
   Show a German word (or English word) and 4 answer options with a
   timer. Right answer = points + streak bonus. Great for the whole class.
   ===================================================================== */
(function () {
  App.register({
    id: "quiz",
    name: "Vocabulary Quiz",
    emoji: "🎯",
    color: "#ff595e",
    description: "Multiple-choice quiz with a timer. Answer fast for bonus points!",
    contentType: "words",

    mount(stage, api) {
      const { kit, topic, addScore, el } = api;
      if (!topic.words || topic.words.length === 0) {
        kit.notice(stage, "No words yet", "Add words to this topic via ⚙️ Manage content.", api);
        return;
      }
      const words = topic.words;
      const TOTAL = Math.min(8, words.length);
      const pool = kit.sample(words, TOTAL);
      let index = 0;
      let correct = 0;
      let streak = 0;
      let timer = null;
      let timeLeft = 0;
      // Ask German -> English half the time, English -> German the other half.
      let askGermanToEnglish = true;

      const wrap = el("div", { class: "quiz" });
      stage.appendChild(wrap);

      function render() {
        clearInterval(timer);
        const q = pool[index];
        askGermanToEnglish = index % 2 === 0;
        const prompt = askGermanToEnglish ? q.de : q.en;
        const answer = askGermanToEnglish ? q.en : q.de;

        // Build 3 wrong options from the same topic.
        const others = words.filter((w) => (askGermanToEnglish ? w.en : w.de) !== answer);
        const distractors = kit.sample(others, 3).map((w) => (askGermanToEnglish ? w.en : w.de));
        const options = kit.shuffle([answer, ...distractors]);

        wrap.innerHTML = "";
        wrap.appendChild(
          el("div", { class: "quiz-head" }, [
            el("button", { class: "back-link small", html: "← Menu", on: { click: api.exit } }),
            el("div", { class: "quiz-progress", text: `Question ${index + 1} / ${TOTAL}` }),
            el("div", { class: "quiz-streak", text: streak > 1 ? `🔥 ${streak} streak` : "" })
          ])
        );

        const bar = el("div", { class: "timer-bar" }, [el("div", { class: "timer-fill", attrs: { id: "tfill" } })]);
        wrap.appendChild(bar);

        wrap.appendChild(
          el("div", { class: "quiz-question" }, [
            el("div", { class: "quiz-lang-tag", text: askGermanToEnglish ? "What does this mean?" : "What's the German word?" }),
            el("div", { class: "quiz-word" }, [
              document.createTextNode(prompt + " "),
              askGermanToEnglish ? kit.speakerButton(q.de) : null
            ]),
            q.emoji ? el("div", { class: "quiz-emoji", text: q.emoji }) : null
          ])
        );

        const optWrap = el("div", { class: "quiz-options" });
        const shapes = ["🔺", "🔷", "⬤", "⬛"];
        options.forEach((opt, i) => {
          optWrap.appendChild(
            el("button", {
              class: "quiz-opt",
              attrs: { style: `--i:${i}` },
              on: { click: (e) => choose(e.currentTarget, opt, answer, q) }
            }, [
              el("span", { class: "opt-shape", text: shapes[i] }),
              el("span", { class: "opt-text", text: opt })
            ])
          );
        });
        wrap.appendChild(optWrap);

        // start timer
        timeLeft = 100;
        const fill = document.getElementById("tfill");
        timer = setInterval(() => {
          timeLeft -= 1.5;
          if (fill) fill.style.width = Math.max(0, timeLeft) + "%";
          if (timeLeft <= 0) {
            clearInterval(timer);
            reveal(null, answer, q);
          }
        }, 60);
      }

      function choose(btn, opt, answer, q) {
        clearInterval(timer);
        reveal(btn, answer, q, opt);
      }

      function reveal(btn, answer, q, chosen) {
        const buttons = wrap.querySelectorAll(".quiz-opt");
        buttons.forEach((b) => {
          b.disabled = true;
          const txt = b.querySelector(".opt-text").textContent;
          if (txt === answer) b.classList.add("correct");
          else if (b === btn) b.classList.add("wrong");
        });

        const wasRight = chosen === answer;
        if (wasRight) {
          const bonus = Math.round(timeLeft / 10); // faster = more
          const points = 10 + bonus;
          correct++;
          streak++;
          addScore(points);
          kit.beep("good");
        } else {
          streak = 0;
          kit.beep("bad");
          // Speak the correct German word so students hear it.
          kit.speak(q.de);
        }

        setTimeout(() => {
          index++;
          if (index < TOTAL) render();
          else finish();
        }, 1200);
      }

      function finish() {
        clearInterval(timer);
        const pct = Math.round((correct / TOTAL) * 100);
        if (pct >= 60) kit.confetti();
        kit.beep(pct >= 60 ? "win" : "bad");
        wrap.innerHTML = "";
        wrap.appendChild(
          el("div", { class: "result-card" }, [
            el("div", { class: "result-emoji", text: pct >= 80 ? "🏆" : pct >= 60 ? "🎉" : "💪" }),
            el("h2", { text: pct >= 60 ? "Well done!" : "Keep practising!" }),
            el("p", { class: "result-score", html: `<b>${correct}</b> of <b>${TOTAL}</b> correct · ${pct}%` }),
            el("div", { class: "result-actions" }, [
              el("button", { class: "btn primary", text: "Play again", on: { click: api.restart } }),
              el("button", { class: "btn", text: "Other topic", on: { click: api.backToTopics } }),
              el("button", { class: "btn ghost", text: "Menu", on: { click: api.exit } })
            ])
          ])
        );
      }

      render();
    }
  });
})();


/* ==== js/games/memory.js ==== */
/* =====================================================================
   GAME: Memory  (Paare finden)
   Flip cards to match a German word with its English meaning (with a
   helpful emoji). Fewer moves = more points. Good for small groups/pairs.
   ===================================================================== */
(function () {
  App.register({
    id: "memory",
    name: "Memory",
    emoji: "🧩",
    color: "#8ac926",
    description: "Flip cards to match German words with their meaning.",
    contentType: "words",

    mount(stage, api) {
      const { kit, topic, addScore, el } = api;
      if (!topic.words || topic.words.length === 0) {
        kit.notice(stage, "No words yet", "Add words to this topic via ⚙️ Manage content.", api);
        return;
      }
      const PAIRS = Math.min(6, topic.words.length);
      const chosen = kit.sample(topic.words, PAIRS);

      // Build two cards per word: a German side and an English (+emoji) side.
      let cards = [];
      chosen.forEach((w, i) => {
        cards.push({ pair: i, face: w.de, kind: "de", speak: w.de });
        cards.push({ pair: i, face: (w.emoji ? w.emoji + " " : "") + w.en, kind: "en", speak: w.de });
      });
      cards = kit.shuffle(cards);

      let flipped = [];
      let matched = 0;
      let moves = 0;
      let busy = false;

      const wrap = el("div", { class: "memory" });
      stage.appendChild(wrap);

      wrap.appendChild(
        el("div", { class: "game-head" }, [
          el("button", { class: "back-link small", html: "← Menu", on: { click: api.exit } }),
          el("div", { class: "head-title", text: `${topic.emoji} ${topic.name}` }),
          el("div", { class: "moves", attrs: { id: "moves" }, text: "0 moves" })
        ])
      );

      const board = el("div", { class: "memory-board", attrs: { style: `--cols:${cards.length > 8 ? 4 : 3}` } });
      wrap.appendChild(board);

      cards.forEach((card, idx) => {
        const node = el("button", {
          class: "mem-card",
          attrs: { "data-idx": idx },
          on: { click: () => flip(idx, node) }
        }, [
          el("div", { class: "mem-inner" }, [
            el("div", { class: "mem-front" }, [
              el("img", {
                class: "mem-logo",
                attrs: { src: window.SkillbeeBrand ? window.SkillbeeBrand.favicon : "", alt: "" }
              })
            ]),
            el("div", { class: `mem-back ${card.kind}`, text: card.face })
          ])
        ]);
        board.appendChild(node);
        card.node = node;
      });

      function flip(idx, node) {
        if (busy || node.classList.contains("flipped") || node.classList.contains("done")) return;
        node.classList.add("flipped");
        flipped.push(idx);
        if (flipped.length === 2) {
          busy = true;
          moves++;
          document.getElementById("moves").textContent = moves + (moves === 1 ? " move" : " moves");
          const [a, b] = flipped;
          if (cards[a].pair === cards[b].pair) {
            kit.beep("good");
            kit.speak(cards[a].speak);
            setTimeout(() => {
              cards[a].node.classList.add("done");
              cards[b].node.classList.add("done");
              flipped = [];
              busy = false;
              matched++;
              addScore(15);
              if (matched === PAIRS) finish();
            }, 550);
          } else {
            kit.beep("bad");
            setTimeout(() => {
              cards[a].node.classList.remove("flipped");
              cards[b].node.classList.remove("flipped");
              flipped = [];
              busy = false;
            }, 900);
          }
        }
      }

      function finish() {
        // Bonus for efficiency: perfect game is `PAIRS` moves.
        const bonus = Math.max(0, (PAIRS * 2 - moves)) * 5;
        if (bonus > 0) addScore(bonus);
        kit.confetti();
        kit.beep("win");
        setTimeout(() => {
          wrap.innerHTML = "";
          wrap.appendChild(
            el("div", { class: "result-card" }, [
              el("div", { class: "result-emoji", text: "🎉" }),
              el("h2", { text: "All pairs found!" }),
              el("p", { class: "result-score", html: `In <b>${moves}</b> moves · Bonus: <b>${bonus}</b>` }),
              el("div", { class: "result-actions" }, [
                el("button", { class: "btn primary", text: "Play again", on: { click: api.restart } }),
                el("button", { class: "btn", text: "Other topic", on: { click: api.backToTopics } }),
                el("button", { class: "btn ghost", text: "Menu", on: { click: api.exit } })
              ])
            ])
          );
        }, 700);
      }
    }
  });
})();


/* ==== js/games/hangman.js ==== */
/* =====================================================================
   GAME: Galgenmännchen  (Hangman)
   Guess the German word letter by letter. An English hint + emoji is
   shown. 6 wrong guesses allowed. Nice as a warm-up with the class.
   ===================================================================== */
(function () {
  const ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÜ".split("");
  const MAX_WRONG = 6;
  const STAGES = ["😀", "🙂", "😐", "😟", "😧", "😨", "💀"];

  App.register({
    id: "hangman",
    name: "Hangman",
    emoji: "🔤",
    color: "#6a4c93",
    description: "Guess the German word letter by letter before the timer runs out.",
    contentType: "words",

    mount(stage, api) {
      const { kit, topic, addScore, el } = api;
      if (!topic.words || topic.words.length === 0) {
        kit.notice(stage, "No words yet", "Add words to this topic via ⚙️ Manage content.", api);
        return;
      }
      const entry = kit.sample(topic.words, 1)[0];
      // Strip the article (der/die/das) for guessing; keep it for the reveal.
      const full = entry.de;
      const guessWord = full.replace(/^(der|die|das)\s+/i, "");
      const letters = guessWord.toUpperCase().split("");
      const guessed = new Set();
      let wrong = 0;
      let solved = false;

      const wrap = el("div", { class: "hangman" });
      stage.appendChild(wrap);

      function isLetter(ch) {
        return /[A-ZÄÖÜ]/.test(ch);
      }

      function render() {
        wrap.innerHTML = "";
        wrap.appendChild(
          el("div", { class: "game-head" }, [
            el("button", { class: "back-link small", html: "← Menu", on: { click: api.exit } }),
            el("div", { class: "head-title", text: `${topic.emoji} ${topic.name}` }),
            el("div", { class: "moves", text: `${MAX_WRONG - wrong} ❤️` })
          ])
        );

        wrap.appendChild(el("div", { class: "hang-face", text: STAGES[wrong] }));
        wrap.appendChild(
          el("div", { class: "hang-hint" }, [
            document.createTextNode(`Hint: ${entry.en} `),
            entry.emoji ? el("span", { text: entry.emoji }) : null
          ])
        );

        // The word with blanks
        const wordRow = el("div", { class: "hang-word" });
        letters.forEach((ch) => {
          if (!isLetter(ch)) {
            wordRow.appendChild(el("span", { class: "hang-space", text: ch === " " ? "·" : ch }));
          } else {
            const show = guessed.has(ch) || solved;
            wordRow.appendChild(el("span", { class: "hang-slot" + (show ? " filled" : ""), text: show ? ch : "" }));
          }
        });
        wrap.appendChild(wordRow);

        // Keyboard
        const kb = el("div", { class: "keyboard" });
        ALPHABET.forEach((L) => {
          const used = guessed.has(L);
          const inWord = letters.includes(L);
          kb.appendChild(
            el("button", {
              class: "key" + (used ? (inWord ? " right" : " miss") : ""),
              attrs: used ? { disabled: "true" } : {},
              text: L,
              on: { click: () => guess(L) }
            })
          );
        });
        wrap.appendChild(kb);
      }

      function guess(L) {
        if (guessed.has(L) || solved) return;
        guessed.add(L);
        if (letters.includes(L)) {
          kit.beep("good");
          if (letters.filter(isLetter).every((c) => guessed.has(c))) return win();
        } else {
          wrong++;
          kit.beep("bad");
          if (wrong >= MAX_WRONG) return lose();
        }
        render();
      }

      function win() {
        solved = true;
        const points = 20 + (MAX_WRONG - wrong) * 5;
        addScore(points);
        render();
        kit.confetti();
        kit.beep("win");
        kit.speak(full);
        banner(true, points);
      }

      function lose() {
        solved = true;
        render();
        kit.beep("bad");
        kit.speak(full);
        banner(false, 0);
      }

      function banner(won, points) {
        wrap.appendChild(
          el("div", { class: "result-card inline" }, [
            el("div", { class: "result-emoji", text: won ? "🎉" : "😅" }),
            el("h2", { html: won ? `Correct! <b>${full}</b>` : `The word was: <b>${full}</b>` }),
            won ? el("p", { class: "result-score", html: `+${points} points` }) : null,
            el("div", { class: "result-actions" }, [
              el("button", { class: "btn primary", text: "New word", on: { click: api.restart } }),
              el("button", { class: "btn", text: "Other topic", on: { click: api.backToTopics } }),
              el("button", { class: "btn ghost", text: "Menu", on: { click: api.exit } })
            ])
          ])
        );
      }

      // Allow physical keyboard typing too.
      function onKey(e) {
        const L = (e.key || "").toUpperCase();
        if (ALPHABET.includes(L)) guess(L);
      }
      document.addEventListener("keydown", onKey);
      // Clean up the listener when leaving via any button that clears the stage.
      const cleanup = new MutationObserver(() => {
        if (!document.body.contains(wrap)) {
          document.removeEventListener("keydown", onKey);
          cleanup.disconnect();
        }
      });
      cleanup.observe(document.body, { childList: true, subtree: true });

      render();
    }
  });
})();


/* ==== js/games/scramble.js ==== */
/* =====================================================================
   GAME: Satzbau  (Sentence Scramble)
   The words of a German sentence are shuffled. Click them in the right
   order to rebuild the sentence. Teaches word order (great for A1–A2).
   ===================================================================== */
(function () {
  App.register({
    id: "scramble",
    name: "Sentence Scramble",
    emoji: "🧱",
    color: "#3b4de8",
    description: "Put the shuffled German words back into the correct order.",
    contentType: "sentences", // uses SENTENCE_TOPICS instead of words

    mount(stage, api) {
      const { kit, topic, addScore, el } = api;
      if (!topic.sentences || topic.sentences.length === 0) {
        kit.notice(stage, "No sentences yet", "Add sentences to this topic via ⚙️ Manage content.", api);
        return;
      }
      const TOTAL = Math.min(5, topic.sentences.length);
      const pool = kit.sample(topic.sentences, TOTAL);
      let index = 0;
      let solvedCount = 0;

      const wrap = el("div", { class: "scramble" });
      stage.appendChild(wrap);

      function render() {
        const item = pool[index];
        const target = item.de.replace(/\s+/g, " ").trim();
        const targetWords = target.split(" ");
        let build = []; // chosen words (indexes into bank)

        wrap.innerHTML = "";
        wrap.appendChild(
          el("div", { class: "game-head" }, [
            el("button", { class: "back-link small", html: "← Menu", on: { click: api.exit } }),
            el("div", { class: "head-title", text: `Sentence ${index + 1} / ${TOTAL}` }),
            el("div", { class: "moves", text: topic.emoji + " " + topic.name })
          ])
        );

        wrap.appendChild(el("div", { class: "scr-hint", text: `„${item.en}"` }));

        const answerRow = el("div", { class: "scr-answer", attrs: { id: "answer" } });
        wrap.appendChild(answerRow);

        const bankRow = el("div", { class: "scr-bank", attrs: { id: "bank" } });
        wrap.appendChild(bankRow);

        // Build a shuffled bank; reshuffle if it happens to match the answer.
        let order = kit.shuffle(targetWords.map((_, i) => i));
        if (targetWords.length > 1 && order.every((v, i) => v === i)) order = order.reverse();

        const bankButtons = [];
        order.forEach((wordIdx, pos) => {
          const btn = el("button", {
            class: "scr-word",
            attrs: { style: `--i:${pos}` },
            text: targetWords[wordIdx],
            on: { click: () => pick(pos) }
          });
          bankButtons.push(btn);
          bankRow.appendChild(btn);
        });

        const checkBtn = el("button", { class: "btn primary scr-check", text: "Check ✓", attrs: { disabled: "true" }, on: { click: check } });
        const clearBtn = el("button", { class: "btn ghost", text: "Reset", on: { click: render } });
        wrap.appendChild(el("div", { class: "scr-actions" }, [clearBtn, checkBtn]));

        function pick(pos) {
          const btn = bankButtons[pos];
          if (btn.classList.contains("used")) return;
          btn.classList.add("used");
          build.push(pos);
          kit.beep("good");
          renderAnswer();
        }

        function unpick(buildPos) {
          const pos = build[buildPos];
          bankButtons[pos].classList.remove("used");
          build.splice(buildPos, 1);
          renderAnswer();
        }

        function renderAnswer() {
          answerRow.innerHTML = "";
          build.forEach((pos, i) => {
            answerRow.appendChild(
              el("button", { class: "scr-word chosen", text: bankButtons[pos].textContent, on: { click: () => unpick(i) } })
            );
          });
          checkBtn.disabled = build.length !== targetWords.length;
          answerRow.classList.remove("shake", "ok");
        }

        function check() {
          const attempt = build.map((pos) => bankButtons[pos].textContent);
          const correct = attempt.join(" ") === targetWords.join(" ");
          if (correct) {
            answerRow.classList.add("ok");
            addScore(20);
            solvedCount++;
            kit.beep("win");
            kit.speak(target);
            checkBtn.disabled = true;
            setTimeout(next, 1300);
          } else {
            answerRow.classList.add("shake");
            kit.beep("bad");
          }
        }
      }

      function next() {
        index++;
        if (index < TOTAL) render();
        else finish();
      }

      function finish() {
        kit.confetti();
        kit.beep("win");
        wrap.innerHTML = "";
        wrap.appendChild(
          el("div", { class: "result-card" }, [
            el("div", { class: "result-emoji", text: "🏗️" }),
            el("h2", { text: "All sentences built!" }),
            el("p", { class: "result-score", html: `<b>${solvedCount}</b> of <b>${TOTAL}</b> sentences` }),
            el("div", { class: "result-actions" }, [
              el("button", { class: "btn primary", text: "Play again", on: { click: api.restart } }),
              el("button", { class: "btn", text: "Other topic", on: { click: api.backToTopics } }),
              el("button", { class: "btn ghost", text: "Menu", on: { click: api.exit } })
            ])
          ])
        );
      }

      render();
    }
  });
})();


/* ==== js/admin.js ==== */
/* =====================================================================
   AdminUI — the in-app "Manage content" screen.
   Two modes:
     • Content bank — the master word/sentence sets that feed every game.
     • Games        — per game, tick which topics that game offers, and edit
                      content inline (edits also update the shared bank).
   Every change is saved automatically via ContentStore.
   ===================================================================== */
(function () {
  window.AdminUI = {
    mount: function (container, api) {
      var el = api.el;
      var store = api.store;
      var games = api.games || [];

      var mode = "bank"; // "bank" | "games"
      var bankTab = "vocab"; // "vocab" | "sentences" (within the bank)
      var currentGame = null; // gameId when configuring one game

      function typeOfGame(g) {
        return g.contentType === "sentences" ? "sentences" : "vocab";
      }

      /* A text input bound two-way to obj[field]; saves on every keystroke. */
      function input(obj, field, placeholder, cls, maxlen) {
        var attrs = { type: "text", value: obj[field] == null ? "" : obj[field], placeholder: placeholder || "" };
        if (maxlen) attrs.maxlength = maxlen;
        return el("input", {
          class: cls || "adm-input",
          attrs: attrs,
          on: {
            input: function (e) {
              obj[field] = e.target.value;
              store.save();
            }
          }
        });
      }

      function toast(msg) {
        var t = el("div", { class: "adm-toast", text: msg });
        document.body.appendChild(t);
        setTimeout(function () { t.classList.add("show"); }, 10);
        setTimeout(function () {
          t.classList.remove("show");
          setTimeout(function () { t.remove(); }, 300);
        }, 1800);
      }

      function confirmDelete(msg) {
        try { return window.confirm(msg); } catch (e) { return true; }
      }

      /* ---------------- top-level render ---------------- */
      function render() {
        container.innerHTML = "";

        container.appendChild(
          el("div", { class: "adm-head" }, [
            el("button", { class: "back-link", html: "← Menu", on: { click: api.onExit } }),
            el("h2", { class: "adm-title", html: "🛠️ Manage content" }),
            el("div", { class: "adm-tools" }, [
              el("button", { class: "btn small", html: "⬇ Export", attrs: { title: "Save everything to a file" }, on: { click: doExport } }),
              el("button", { class: "btn small", html: "⬆ Import", attrs: { title: "Load from a file" }, on: { click: doImport } }),
              (window.TeacherGate && window.TeacherGate.gated())
                ? el("button", { class: "btn small ghost", html: "🔒 PIN", attrs: { title: "Change teacher PIN" }, on: { click: function () { window.TeacherGate.changePin(); } } })
                : null,
              el("button", { class: "btn small ghost", html: "↺ Reset", on: { click: doReset } })
            ])
          ])
        );

        container.appendChild(
          el("div", { class: "adm-tabs adm-modes" }, [
            modeBtn("bank", "📚 Content bank"),
            modeBtn("games", "🎮 Games")
          ])
        );

        var body = el("div", { class: "adm-body" });
        container.appendChild(body);
        if (mode === "bank") renderBank(body);
        else renderGames(body);
      }

      function modeBtn(id, label) {
        return el("button", {
          class: "adm-tab" + (mode === id ? " active" : ""),
          html: label,
          on: {
            click: function () {
              mode = id;
              currentGame = null;
              render();
            }
          }
        });
      }

      /* ---------------- Content bank ---------------- */
      function renderBank(body) {
        body.appendChild(
          el("div", { class: "adm-tabs" }, [
            subBtn("vocab", "🔤 Words"),
            subBtn("sentences", "🗣️ Sentences")
          ])
        );
        body.appendChild(
          el("p", {
            class: "adm-hint",
            html:
              "This is the shared bank that feeds every game. Words are used by <b>Vocabulary Quiz</b>, <b>Memory</b> and <b>Hangman</b>; sentences by <b>Sentence Scramble</b>. Changes save automatically in this browser."
          })
        );
        addTopicButton(body, bankTab, null);
        var list = store.poolFor(bankTab);
        if (!list.length) body.appendChild(emptyState(bankTab === "vocab" ? "No word topics yet." : "No sentence topics yet."));
        list.forEach(function (topic, i) {
          body.appendChild(topicCard(topic, i, bankTab, { expanded: true }));
        });
      }

      function subBtn(id, label) {
        return el("button", {
          class: "adm-tab" + (bankTab === id ? " active" : ""),
          html: label,
          on: {
            click: function () {
              bankTab = id;
              render();
            }
          }
        });
      }

      /* ---------------- Games ---------------- */
      function renderGames(body) {
        if (!currentGame) {
          body.appendChild(
            el("p", {
              class: "adm-hint",
              html: "Pick a game to choose exactly which topics it offers. You can also edit or add content here — those changes also update the shared bank."
            })
          );
          var grid = el("div", { class: "adm-game-grid" });
          games.forEach(function (g) {
            var type = typeOfGame(g);
            var total = store.poolFor(type).length;
            var on = store.enabledCount(g.id, type);
            grid.appendChild(
              el("button", {
                class: "adm-game-card",
                attrs: { style: "--accent:" + (g.color || "#3b4de8") },
                on: { click: function () { currentGame = g.id; render(); } }
              }, [
                el("div", { class: "adm-game-emoji", text: g.emoji }),
                el("div", { class: "adm-game-name", text: g.name }),
                el("div", { class: "adm-game-meta", text: on + " of " + total + (type === "sentences" ? " sentence sets" : " topics") })
              ])
            );
          });
          body.appendChild(grid);
          return;
        }

        var game = null;
        for (var k = 0; k < games.length; k++) if (games[k].id === currentGame) game = games[k];
        if (!game) { currentGame = null; return renderGames(body); }
        var gtype = typeOfGame(game);

        body.appendChild(
          el("div", { class: "adm-subhead" }, [
            el("button", { class: "back-link small", html: "← Games", on: { click: function () { currentGame = null; render(); } } }),
            el("h3", { class: "adm-game-title", text: game.emoji + " " + game.name })
          ])
        );
        body.appendChild(
          el("p", {
            class: "adm-hint",
            html: "Tick the topics this game should offer. Editing or adding content here also updates the shared bank."
          })
        );
        addTopicButton(body, gtype, game.id);
        var pool = store.poolFor(gtype);
        if (!pool.length) body.appendChild(emptyState(gtype === "vocab" ? "No word topics in the bank yet." : "No sentence topics in the bank yet."));
        pool.forEach(function (topic, i) {
          body.appendChild(topicCard(topic, i, gtype, { expanded: false, gameId: game.id }));
        });
      }

      /* ---------------- reusable topic card ---------------- */
      function topicCard(topic, index, type, opts) {
        opts = opts || {};
        var card = el("div", { class: "adm-topic" });
        var head = el("div", { class: "adm-topic-head" });

        if (opts.gameId) {
          var cb = el("input", { class: "adm-check", attrs: { type: "checkbox", title: "Include in this game" } });
          cb.checked = store.isTopicInGame(opts.gameId, topic.id);
          cb.addEventListener("change", function () {
            store.setTopicInGame(opts.gameId, topic.id, type, cb.checked);
            card.classList.toggle("adm-off", !cb.checked);
          });
          head.appendChild(el("label", { class: "adm-include" }, [cb]));
          if (!cb.checked) card.classList.add("adm-off");
        }

        head.appendChild(input(topic, "emoji", "🙂", "adm-emoji", 6));
        head.appendChild(input(topic, "name", "Topic name (German)", "adm-input grow"));
        head.appendChild(input(topic, "english", "English name", "adm-input"));
        var countText = type === "vocab" ? topic.words.length + " words" : topic.sentences.length + " sentences";
        head.appendChild(el("span", { class: "adm-count", text: countText }));

        var rows = el("div", { class: "adm-rows" });
        if (opts.expanded === false) rows.style.display = "none";
        var toggle = el("button", {
          class: "adm-toggle",
          html: opts.expanded === false ? "Edit ▾" : "▴",
          attrs: { title: "Show / hide content" },
          on: {
            click: function () {
              var hidden = rows.style.display === "none";
              rows.style.display = hidden ? "" : "none";
              toggle.innerHTML = hidden ? "▴" : "Edit ▾";
            }
          }
        });
        head.appendChild(toggle);

        head.appendChild(
          el("button", {
            class: "adm-del",
            html: "🗑",
