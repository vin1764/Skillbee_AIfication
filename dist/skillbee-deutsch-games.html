/* ==== js/store.js ==== */
/* =====================================================================
   ContentStore — lets teachers edit the game content from inside the app.
   ---------------------------------------------------------------------
   • The built-in content in data.js is the "default".
   • Teacher edits are saved in the browser (localStorage) AND synced to the
     cloud (the same Firebase as Live Mode), so an edit on one device shows
     up on every device — including the smartboard used for hosting.
   • Offline (no Firebase), it falls back to localStorage on that device.
   • Backup/Restore (JSON) stays available as an optional safety net.
   The games and the topic picker read their content from here, so any edit
   shows up immediately.
   ===================================================================== */
(function () {
  var KEY = "skillbee_deutsch_content_v1";
  var TS_KEY = "skillbee_deutsch_content_ts_v1";
  // A per-tab id so a device ignores the echo of its own cloud writes.
  var CLIENT_ID = "c" + Math.random().toString(36).slice(2, 10);

  function clone(x) {
    return JSON.parse(JSON.stringify(x));
  }

  function defaultCases() {
    return clone(window.CaseData || { accusative: [], dative: [], genitive: [] });
  }
  function defaultCompounds() {
    return clone(window.CompoundData || []);
  }
  function defaultPlurals() {
    return clone(window.PluralData || []);
  }
  function defaultVerbs() {
    return clone(window.VerbData || []);
  }
  function defaultListening() {
    return clone(window.ListeningData || []);
  }

  /* ---------------------------------------------------------------------
     Exercises — EVERY content game holds its own LIST of named "exercises".
     A teacher builds a fresh exercise for each lesson and keeps the previous
     ones instead of overwriting; in each game they pick which to play.
     Each game owns its content (nothing is shared between games). Shapes:
       words games  (quiz, memory, hangman)  -> { id, name, emoji, english, words: [...] }
       sentence game (scramble)              -> { id, name, emoji, english, sentences: [...] }
       cases (Fall-Detektiv)                 -> { id, name, accusative, dative, genitive }
       item games (compounds/plurals/verbs/listening) -> { id, name, items: [...] }
     --------------------------------------------------------------------- */
  var WORD_GAMES = ["quiz", "memory", "hangman"];
  var ITEM_GAMES = ["compounds", "plurals", "verbs", "listening"];

  function gameKind(gameKey) {
    if (gameKey === "scramble") return "sentences";
    if (gameKey === "cases") return "cases";
    if (gameKey === "hoerpaare") return "pairs";
    if (WORD_GAMES.indexOf(gameKey) >= 0) return "words";
    return "items"; // compounds / plurals / verbs / listening
  }

  function exId() {
    return "ex-" + Date.now().toString(36) + "-" + Math.floor(Math.random() * 1e4).toString(36);
  }
  function wordsExercise(name, words) {
    return { id: exId(), name: name || "Exercise 1", emoji: "📚", english: "", words: Array.isArray(words) ? clone(words) : [] };
  }
  function sentencesExercise(name, sentences) {
    return { id: exId(), name: name || "Exercise 1", emoji: "🗣️", english: "", sentences: Array.isArray(sentences) ? clone(sentences) : [] };
  }
  // A fresh exercise for the case game (three sub-lists). `seed` may be a legacy
  // { accusative, dative, genitive } object whose content is migrated in.
  function caseExercise(name, seed) {
    seed = seed || {};
    return {
      id: exId(), name: name || "Exercise 1",
      accusative: Array.isArray(seed.accusative) ? clone(seed.accusative) : [],
      dative: Array.isArray(seed.dative) ? clone(seed.dative) : [],
      genitive: Array.isArray(seed.genitive) ? clone(seed.genitive) : []
    };
  }
  // A fresh exercise for a flat-list game. `items` may be a legacy array migrated in.
  function listExercise(name, items) {
    return { id: exId(), name: name || "Exercise 1", items: Array.isArray(items) ? clone(items) : [] };
  }
  // Turn a legacy shared-bank topic into a per-game exercise (keeps its name/emoji).
  function topicToExercise(topic, kind) {
    var e = clone(topic || {});
    if (!e.id) e.id = exId();
    if (typeof e.name !== "string" || !e.name) e.name = "Exercise";
    if (typeof e.emoji !== "string") e.emoji = kind === "sentences" ? "🗣️" : "📚";
    if (typeof e.english !== "string") e.english = "";
    if (kind === "sentences") { if (!Array.isArray(e.sentences)) e.sentences = []; delete e.words; }
    else { if (!Array.isArray(e.words)) e.words = []; delete e.sentences; }
    return e;
  }
  function normalizeWordsEx(e) {
    if (!e.id) e.id = exId();
    if (typeof e.name !== "string" || !e.name) e.name = "Exercise";
    if (typeof e.emoji !== "string") e.emoji = "📚";
    if (typeof e.english !== "string") e.english = "";
    if (!Array.isArray(e.words)) e.words = [];
  }
  function normalizeSentencesEx(e) {
    if (!e.id) e.id = exId();
    if (typeof e.name !== "string" || !e.name) e.name = "Exercise";
    if (typeof e.emoji !== "string") e.emoji = "🗣️";
    if (typeof e.english !== "string") e.english = "";
    if (!Array.isArray(e.sentences)) e.sentences = [];
  }
  function normalizeCaseEx(e) {
    if (!e.id) e.id = exId();
    if (typeof e.name !== "string" || !e.name) e.name = "Exercise";
    ["accusative", "dative", "genitive"].forEach(function (k) { if (!Array.isArray(e[k])) e[k] = []; });
  }
  function normalizeListEx(e) {
    if (!e.id) e.id = exId();
    if (typeof e.name !== "string" || !e.name) e.name = "Exercise";
    if (!Array.isArray(e.items)) e.items = [];
  }
  // Hör-Paare (Listen & Match): an exercise is a list of "questions", and each
  // question is a set of words (min 3) students match audio-to-meaning.
  function pairsExercise(name, questions) {
    return { id: exId(), name: name || "Exercise 1", emoji: "🎧", questions: Array.isArray(questions) ? clone(questions) : [] };
  }
  function normalizePairsEx(e) {
    if (!e.id) e.id = exId();
    if (typeof e.name !== "string" || !e.name) e.name = "Exercise";
    if (typeof e.emoji !== "string") e.emoji = "🎧";
    if (!Array.isArray(e.questions)) e.questions = [];
    e.questions = e.questions.filter(function (q) { return q && typeof q === "object"; });
    e.questions.forEach(function (q) { if (!Array.isArray(q.words)) q.words = []; });
  }
  // Seed Hör-Paare with a few ready-made questions (4 words each) from the vocab.
  function defaultPairsQuestions() {
    var vt = (window.GameData && window.GameData.VOCAB_TOPICS) || [];
    var pick = ["zahlen", "farben", "tiere", "essen"];
    return vt.filter(function (t) { return pick.indexOf(t.id) >= 0; }).map(function (t) {
      return { words: (t.words || []).slice(0, 4).map(function (w) { return { de: w.de, en: w.en, emoji: w.emoji || "" }; }) };
    });
  }

  // The topics a legacy store's game offered (its selection subset, or all).
  function legacyTopicsFor(d, gameId, type) {
    var pool = (type === "sentences" ? d.sentences : d.vocab) || [];
    var cfg = d.games && d.games[gameId];
    if (!cfg || !Array.isArray(cfg.topics)) return pool;
    var set = {};
    cfg.topics.forEach(function (id) { set[id] = true; });
    return pool.filter(function (t) { return set[t.id]; });
  }

  function defaultExercises() {
    var vt = (window.GameData && window.GameData.VOCAB_TOPICS) || [];
    var st = (window.GameData && window.GameData.SENTENCE_TOPICS) || [];
    // Each word game starts from a DIFFERENT subset of the built-in topics, so
    // Quiz / Memory / Hangman aren't identical out of the box (teachers add more).
    var pickWords = function (ids) {
      var chosen = ids ? vt.filter(function (t) { return ids.indexOf(t.id) >= 0; }) : vt;
      if (!chosen.length) chosen = vt; // never seed a word game empty on a typo
      return chosen.map(function (t) { return topicToExercise(t, "words"); });
    };
    return {
      quiz: pickWords(null), // the full set
      memory: pickWords(["tiere", "essen", "farben", "familie"]),
      hangman: pickWords(["tiere", "essen", "familie", "verben"]),
      scramble: st.map(function (t) { return topicToExercise(t, "sentences"); }),
      cases: [caseExercise("Exercise 1", defaultCases())],
      compounds: [listExercise("Exercise 1", defaultCompounds())],
      plurals: [listExercise("Exercise 1", defaultPlurals())],
      verbs: [listExercise("Exercise 1", defaultVerbs())],
      listening: [listExercise("Exercise 1", defaultListening())],
      hoerpaare: [pairsExercise("Exercise 1", defaultPairsQuestions())]
    };
  }

  function defaults() {
    // Every game holds its own named exercises, seeded from the built-in data.
    return { exercises: defaultExercises() };
  }

  // Make sure any saved/imported store is in the current shape. Legacy shared
  // banks (d.vocab / d.sentences with d.games selection, and d.cases / d.compounds
  // / …) are migrated into per-game exercises, then dropped.
  function ensureSections(d) {
    if (!d.exercises || typeof d.exercises !== "object") d.exercises = {};
    var ex = d.exercises;

    // word games — migrate the legacy shared vocab bank (honouring old per-game selection)
    WORD_GAMES.forEach(function (g) {
      if (!Array.isArray(ex[g])) ex[g] = legacyTopicsFor(d, g, "vocab").map(function (t) { return topicToExercise(t, "words"); });
      if (!ex[g].length) ex[g] = [wordsExercise("Exercise 1", null)];
      ex[g].forEach(normalizeWordsEx);
    });
    // sentence game (scramble)
    if (!Array.isArray(ex.scramble)) ex.scramble = legacyTopicsFor(d, "scramble", "sentences").map(function (t) { return topicToExercise(t, "sentences"); });
    if (!ex.scramble.length) ex.scramble = [sentencesExercise("Exercise 1", null)];
    ex.scramble.forEach(normalizeSentencesEx);
    // cases (Fall-Detektiv)
    if (!Array.isArray(ex.cases)) ex.cases = [caseExercise("Exercise 1", d.cases)];
    if (!ex.cases.length) ex.cases = [caseExercise("Exercise 1", null)];
    ex.cases.forEach(normalizeCaseEx);
    // flat-list games
    ITEM_GAMES.forEach(function (k) {
      if (!Array.isArray(ex[k])) ex[k] = [listExercise("Exercise 1", d[k])];
      if (!ex[k].length) ex[k] = [listExercise("Exercise 1", null)];
      ex[k].forEach(normalizeListEx);
    });
    // Hör-Paare (pairs)
    if (!Array.isArray(ex.hoerpaare)) ex.hoerpaare = [pairsExercise("Exercise 1", defaultPairsQuestions())];
    if (!ex.hoerpaare.length) ex.hoerpaare = [pairsExercise("Exercise 1", null)];
    ex.hoerpaare.forEach(normalizePairsEx);

    // Legacy fields are now represented as exercises — drop them.
    delete d.vocab; delete d.sentences; delete d.games;
    delete d.cases; delete d.compounds; delete d.plurals; delete d.verbs; delete d.listening;
    return d;
  }

  var store = {
    data: null,
    _ts: 0,                 // last-change timestamp (ms) used to order edits
    syncState: "local",     // local | saving | synced | offline
    editing: false,         // true while the content editor is open
    pendingRemote: null,    // a newer cloud version that arrived mid-edit
    cloudUnsub: null,
    _pushTimer: null,
    onSync: null,           // called after cloud content is adopted (re-render)
    onSyncState: null,      // called when syncState changes (update the chip)
    onRemotePending: null,  // called when a newer cloud version arrives mid-edit

    load: function () {
      try {
        var raw = localStorage.getItem(KEY);
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && (parsed.exercises || Array.isArray(parsed.vocab) || Array.isArray(parsed.sentences))) {
            this.data = ensureSections(parsed);
            this._ts = Number(localStorage.getItem(TS_KEY)) || 0;
            return;
          }
        }
      } catch (e) {
        /* localStorage may be unavailable (e.g. sandboxed) — fall back to defaults */
      }
      this.data = defaults();
      this._ts = 0;
    },

    _saveLocal: function () {
      try {
        localStorage.setItem(KEY, JSON.stringify(this.data));
        localStorage.setItem(TS_KEY, String(this._ts));
        return true;
      } catch (e) { return false; }
    },

    // Called on every edit: save on this device, then sync to the cloud.
    save: function () {
      this._ts = Date.now();
      var ok = this._saveLocal();
      this._scheduleCloudPush();
      return ok;
    },

    reset: function () {
      this.data = defaults();
      this._ts = Date.now();
      this._saveLocal();
      this._scheduleCloudPush();
    },

    /* ---------------- cloud sync (uses the same Firebase as Live Mode) ---------------- */
    _online: function () {
      return !!(window.LiveDB && window.LiveDB.available());
    },
    _setState: function (s) {
      this.syncState = s;
      if (this.onSyncState) this.onSyncState(s);
    },
    _scheduleCloudPush: function () {
      if (!this._online()) { this._setState("offline"); return; }
      var self = this;
      this._setState("saving");
      if (this._pushTimer) clearTimeout(this._pushTimer);
      this._pushTimer = setTimeout(function () { self._pushCloud(); }, 1200);
    },
    _pushCloud: function () {
      if (!this._online()) { this._setState("offline"); return; }
      var self = this;
      window.LiveDB.setContent({ data: this.data, updatedAt: this._ts, clientId: CLIENT_ID })
        .then(function () { self._setState("synced"); })
        .catch(function () { self._setState("offline"); });
    },
    // Start listening once Firebase is ready (called from App.init).
    initCloud: function () {
      if (!this._online()) { this._setState("offline"); return; }
      var self = this;
      this._setState("synced");
      this.cloudUnsub = window.LiveDB.listenContent(function (doc) {
        if (!doc) { self._pushCloud(); return; }          // empty cloud → seed it
        if (doc.clientId === CLIENT_ID) return;            // our own write, echoed
        if (!doc.data || (doc.updatedAt || 0) <= self._ts) return; // not newer
        if (self.editing) {                                // don't clobber active edits
          self.pendingRemote = doc;
          if (self.onRemotePending) self.onRemotePending();
          return;
        }
        self._adoptRemote(doc);
      });
    },
    _adoptRemote: function (doc) {
      this.data = ensureSections(doc.data);
      this._ts = doc.updatedAt || Date.now();
      this._saveLocal();
      this.pendingRemote = null;
      this._setState("synced");
      if (this.onSync) this.onSync();
    },
    applyPendingRemote: function () {
      if (this.pendingRemote) this._adoptRemote(this.pendingRemote);
    },

    isCustomized: function () {
      try {
        return !!localStorage.getItem(KEY);
      } catch (e) {
        return false;
      }
    },

    /* -------- Exercises — every content game -------- */
    gameKind: function (gameKey) { return gameKind(gameKey); },
    // The list of exercises for one game ("quiz" | "cases" | "compounds" | ...).
    exercisesFor: function (gameKey) {
      var arr = this.data.exercises && this.data.exercises[gameKey];
      return Array.isArray(arr) ? arr : [];
    },
    // One exercise by id (falls back to the first exercise of that game).
    exercise: function (gameKey, id) {
      var arr = this.exercisesFor(gameKey);
      if (id) { for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return arr[i]; }
      return arr[0] || null;
    },
    _blankExercise: function (gameKey, name) {
      var kind = gameKind(gameKey);
      if (kind === "cases") return caseExercise(name, null);
      if (kind === "words") return wordsExercise(name, null);
      if (kind === "sentences") return sentencesExercise(name, null);
      if (kind === "pairs") return pairsExercise(name, [{ words: [{ de: "", en: "", emoji: "" }, { de: "", en: "", emoji: "" }, { de: "", en: "", emoji: "" }] }]);
      return listExercise(name, null);
    },
    addExercise: function (gameKey, name) {
      var arr = this.exercisesFor(gameKey);
      var e = this._blankExercise(gameKey, name || "Exercise " + (arr.length + 1));
      arr.push(e);
      this.save();
      return e;
    },
    duplicateExercise: function (gameKey, id) {
      var src = this.exercise(gameKey, id);
      if (!src) return null;
      var copy = clone(src);
      copy.id = exId();
      copy.name = (src.name || "Exercise") + " (copy)";
      this.exercisesFor(gameKey).push(copy);
      this.save();
      return copy;
    },
    renameExercise: function (gameKey, id, name) {
      var e = this.exercise(gameKey, id);
      if (e) { e.name = String(name || "").trim() || e.name; this.save(); }
    },
    deleteExercise: function (gameKey, id) {
      var arr = this.exercisesFor(gameKey);
      for (var i = 0; i < arr.length; i++) if (arr[i].id === id) { arr.splice(i, 1); break; }
      if (!arr.length) arr.push(this._blankExercise(gameKey, "Exercise 1")); // keep at least one
      this.save();
    },
    // Copy an exercise from another content-compatible game into this one.
    copyExerciseFrom: function (destKey, srcKey, srcId) {
      if (gameKind(destKey) !== gameKind(srcKey)) return null;
      var src = this.exercise(srcKey, srcId);
      if (!src) return null;
      var copy = clone(src);
      copy.id = exId();
      this.exercisesFor(destKey).push(copy);
      this.save();
      return copy;
    },

    /* Back-compat accessors — the FIRST exercise's content (used as a fallback
       when no specific exercise is chosen, e.g. by the audio helper). */
    casesData: function () {
      var e = this.exercise("cases");
      return e ? { accusative: e.accusative, dative: e.dative, genitive: e.genitive } : { accusative: [], dative: [], genitive: [] };
    },
    compoundsData: function () { var e = this.exercise("compounds"); return e ? e.items : []; },
    pluralsData: function () { var e = this.exercise("plurals"); return e ? e.items : []; },
    verbsData: function () { var e = this.exercise("verbs"); return e ? e.items : []; },
    listeningData: function () { var e = this.exercise("listening"); return e ? e.items : []; },

    newId: function (prefix) {
      return (
        (prefix || "id") +
        "-" +
        Date.now().toString(36) +
        "-" +
        Math.floor(Math.random() * 1e4).toString(36)
      );
    },

    exportJSON: function () {
      return JSON.stringify(this.data, null, 2);
    },

    importJSON: function (text) {
      var parsed = JSON.parse(text);
      if (!parsed || typeof parsed !== "object" ||
          (!parsed.exercises && !Array.isArray(parsed.vocab) && !Array.isArray(parsed.sentences))) {
        throw new Error("The file is not in the right format.");
      }
      this.data = ensureSections(parsed);
      this._ts = Date.now();
      this._saveLocal();
      this._scheduleCloudPush();
    }
  };

  store.load();
  window.ContentStore = store;
})();


/* ==== js/teacher.js ==== */
/* =====================================================================
   TeacherGate — a lightweight 4-digit PIN that unlocks teacher-only
   actions (hosting a live class, and the content editor).
   • The PIN is stored in Firestore (shared across devices) and cached
     locally, so students on their own phones are actually gated.
   • It is set once by the teacher on first use.
   • Only enforced when online (Firebase available). Offline single-device
     play stays ungated — there's no sharing and edits are local-only.
   • Once entered, it stays unlocked for the browser session.
   ===================================================================== */
window.TeacherGate = (function () {
  var UNLOCK_KEY = "skillbee_teacher_unlocked"; // sessionStorage
  var PIN_CACHE = "skillbee_teacher_pin";       // localStorage (hashed)

  function hashPin(s) {
    var h = 5381;
    for (var i = 0; i < s.length; i++) { h = ((h << 5) + h) + s.charCodeAt(i); h = h & 0xffffffff; }
    return "h" + (h >>> 0).toString(36);
  }

  function gated() { return !!(window.LiveDB && window.LiveDB.available()); }
  function isUnlocked() { try { return sessionStorage.getItem(UNLOCK_KEY) === "1"; } catch (e) { return false; } }
  function unlock() { try { sessionStorage.setItem(UNLOCK_KEY, "1"); } catch (e) {} }
  function lock() { try { sessionStorage.removeItem(UNLOCK_KEY); } catch (e) {} }

  function loadStoredHash() {
    if (gated()) {
      return window.LiveDB.getConfig().then(function (c) {
        var h = c && c.pin ? c.pin : null;
        try { if (h) localStorage.setItem(PIN_CACHE, h); } catch (e) {}
        return h;
      }).catch(function () { try { return localStorage.getItem(PIN_CACHE) || null; } catch (e) { return null; } });
    }
    try { return Promise.resolve(localStorage.getItem(PIN_CACHE) || null); } catch (e) { return Promise.resolve(null); }
  }
  function saveHash(h) {
    try { localStorage.setItem(PIN_CACHE, h); } catch (e) {}
    if (gated()) return window.LiveDB.setConfig({ pin: h });
    return Promise.resolve();
  }

  /* ---- tap-friendly PIN keypad modal ---- */
  function modal(opts) {
    var overlay = document.createElement("div"); overlay.className = "pin-overlay";
    var card = document.createElement("div"); card.className = "pin-card";
    var title = document.createElement("div"); title.className = "pin-title"; title.textContent = opts.title; card.appendChild(title);
    var sub = document.createElement("div"); sub.className = "pin-sub"; sub.textContent = opts.sub || ""; card.appendChild(sub);
    var dots = document.createElement("div"); dots.className = "pin-dots";
    var dotEls = [];
    for (var i = 0; i < 4; i++) { var d = document.createElement("span"); d.className = "pin-dot"; dots.appendChild(d); dotEls.push(d); }
    card.appendChild(dots);
    var errEl = document.createElement("div"); errEl.className = "pin-err"; card.appendChild(errEl);
    var pad = document.createElement("div"); pad.className = "pin-pad";
    var val = "";
    function refresh() { dotEls.forEach(function (d, i) { d.classList.toggle("on", i < val.length); }); }
    function press(n) { if (val.length >= 4) return; val += n; refresh(); if (val.length === 4) { var e = val; setTimeout(function () { opts.onPin(e, api); }, 110); } }
    function del() { val = val.slice(0, -1); refresh(); }
    ["1", "2", "3", "4", "5", "6", "7", "8", "9", "", "0", "⌫"].forEach(function (k) {
      var b = document.createElement("button");
      b.className = "pin-key" + (k === "" ? " empty" : "");
      b.textContent = k;
      if (k === "") b.disabled = true;
      else if (k === "⌫") b.onclick = del;
      else b.onclick = function () { press(k); };
      pad.appendChild(b);
    });
    card.appendChild(pad);
    var cancel = document.createElement("button"); cancel.className = "pin-cancel"; cancel.textContent = "Cancel";
    function close() { overlay.remove(); }
    cancel.onclick = close;
    card.appendChild(cancel);
    overlay.appendChild(card); document.body.appendChild(overlay);
    var api = {
      error: function (m) { errEl.textContent = m; val = ""; refresh(); card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake"); },
      reset: function () { val = ""; refresh(); errEl.textContent = ""; },
      setTitle: function (t) { title.textContent = t; },
      setSub: function (t) { sub.textContent = t; },
      close: close
    };
    return api;
  }

  function createFlow(onOk) {
    var first = null;
    modal({
      title: "Create a teacher PIN",
      sub: "Set a 4-digit PIN. Students won't know it.",
      onPin: function (pin, a) {
        if (first === null) { first = pin; a.reset(); a.setTitle("Re-enter to confirm"); a.setSub(""); }
        else if (pin === first) { saveHash(hashPin(pin)).then(function () { unlock(); a.close(); onOk(); }); }
        else { first = null; a.setTitle("Create a teacher PIN"); a.error("PINs didn't match — start again"); }
      }
    });
  }

  function require(onOk) {
    if (!gated()) return onOk();       // offline: no gate
    if (isUnlocked()) return onOk();
    loadStoredHash().then(function (stored) {
      if (!stored) return createFlow(onOk);
      modal({
        title: "Enter teacher PIN",
        sub: "Ask your teacher if you don't know it.",
        onPin: function (pin, a) {
          if (hashPin(pin) === stored) { unlock(); a.close(); onOk(); }
          else a.error("Wrong PIN");
        }
      });
    });
  }

  // Like require(), but ALWAYS asks for the PIN — it ignores the session unlock
  // cache and never unlocks. For guarding a single dangerous action (e.g. Reset)
  // so the teacher must re-enter their PIN each time. Cancelling just does nothing.
  function verify(onOk) {
    if (!gated()) return onOk();               // offline: no PIN system
    loadStoredHash().then(function (stored) {
      if (!stored) return onOk();              // no PIN configured — nothing to check
      modal({
        title: "Enter teacher PIN",
        sub: "Confirm it's you before resetting.",
        onPin: function (pin, a) {
          if (hashPin(pin) === stored) { a.close(); onOk(); }
          else a.error("Wrong PIN");
        }
      });
    });
  }

  function changePin() {
    var first = null;
    modal({
      title: "New teacher PIN",
      sub: "Enter a new 4-digit PIN",
      onPin: function (pin, a) {
        if (first === null) { first = pin; a.reset(); a.setTitle("Confirm new PIN"); a.setSub(""); }
        else if (pin === first) { saveHash(hashPin(pin)).then(function () { unlock(); a.close(); }); }
        else { first = null; a.setTitle("New teacher PIN"); a.error("PINs didn't match"); }
      }
    });
  }

  return { require: require, verify: verify, isUnlocked: isUnlocked, lock: lock, changePin: changePin, gated: gated };
})();


/* ==== js/app.js ==== */
/* =====================================================================
   Skillbee Deutsch Games — CORE APP
   ---------------------------------------------------------------------
   This runs the lobby (home screen), moves between screens, keeps the
   score, and gives every game a shared toolkit (App.kit): shuffling,
   German pronunciation, sounds and confetti.
   (You normally don't need to edit this file to add vocabulary.)
   ===================================================================== */

const App = (function () {
  const games = [];
  let root = null;

  /* ---- tiny helpers to build HTML elements ------------------------- */
  function el(tag, opts = {}, children = []) {
    const node = document.createElement(tag);
    if (opts.class) node.className = opts.class;
    if (opts.html != null) node.innerHTML = opts.html;
    if (opts.text != null) node.textContent = opts.text;
    if (opts.attrs) for (const k in opts.attrs) node.setAttribute(k, opts.attrs[k]);
    if (opts.on) for (const evt in opts.on) node.addEventListener(evt, opts.on[evt]);
    (Array.isArray(children) ? children : [children]).forEach((c) => {
      if (c == null) return;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return node;
  }

  /* ---- shared game toolkit ----------------------------------------- */
  const kit = {
    shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    },
    sample(arr, n) {
      return kit.shuffle(arr).slice(0, n);
    },
    randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    },
    el,

    /* Speak German out loud. Routed through VoiceBox so the voice chosen in
       Settings is used everywhere; falls back to plain browser speech.
       opts.rate scales the playback speed (1 = normal). */
    speak(text, opts) {
      if (window.VoiceBox) return window.VoiceBox.speak(text, opts);
      try {
        if (!("speechSynthesis" in window)) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "de-DE";
        u.rate = 0.95 * ((opts && opts.rate) || 1);
        const voices = window.speechSynthesis.getVoices();
        const de = voices.find((v) => v.lang && v.lang.toLowerCase().startsWith("de"));
        if (de) u.voice = de;
        window.speechSynthesis.speak(u);
      } catch (e) {
        /* ignore — pronunciation is a nice-to-have */
      }
    },

    /* A small "speaker" button that pronounces a German word. */
    speakerButton(text) {
      return el("button", {
        class: "speaker-btn",
        attrs: { "aria-label": "Aussprache anhören", title: "Aussprache anhören" },
        html: "🔊",
        on: {
          click: (e) => {
            e.stopPropagation();
            kit.speak(text);
          }
        }
      });
    },

    /* Simple beeps via the Web Audio API (no sound files needed). */
    beep(type = "good") {
      try {
        if (App.state.muted) return;
        const ctx = (kit._audio = kit._audio || new (window.AudioContext || window.webkitAudioContext)());
        const now = ctx.currentTime;
        const notes =
          type === "good" ? [660, 880] : type === "win" ? [523, 659, 784, 1046] : [220, 160];
        notes.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = type === "bad" ? "sawtooth" : "sine";
          osc.frequency.value = freq;
          const t = now + i * 0.09;
          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
          osc.connect(gain).connect(ctx.destination);
          osc.start(t);
          osc.stop(t + 0.2);
        });
      } catch (e) {
        /* ignore */
      }
    },

    /* Confetti burst on a big win. Pure canvas — no libraries. */
    confetti() {
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const canvas = el("canvas", { class: "confetti-canvas" });
      document.body.appendChild(canvas);
      const ctx = canvas.getContext("2d");
      const resize = () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      };
      resize();
      const colors = ["#0A84FF", "#FF3B67", "#12C08A", "#FFA51F", "#0B3FDD", "#FFB703"];
      const pieces = Array.from({ length: 140 }, () => ({
        x: Math.random() * canvas.width,
        y: -20 - Math.random() * canvas.height,
        r: 4 + Math.random() * 6,
        c: colors[Math.floor(Math.random() * colors.length)],
        vx: -2 + Math.random() * 4,
        vy: 2 + Math.random() * 4,
        rot: Math.random() * Math.PI,
        vr: -0.2 + Math.random() * 0.4
      }));
      let frame = 0;
      (function tick() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach((p) => {
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.vr;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.c;
          ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 0.6);
          ctx.restore();
        });
        frame++;
        if (frame < 160) requestAnimationFrame(tick);
        else canvas.remove();
      })();
    },

    /* Friendly message shown when a topic has no content yet. */
    notice(stage, title, message, api) {
      stage.appendChild(
        el("div", { class: "result-card" }, [
          el("div", { class: "result-emoji", text: "📝" }),
          el("h2", { text: title }),
          el("p", { class: "result-score", text: message }),
          el("div", { class: "result-actions" }, [
            el("button", { class: "btn", text: "Other topic", on: { click: api.backToTopics } }),
            el("button", { class: "btn ghost", text: "Menu", on: { click: api.exit } })
          ])
        ])
      );
    }
  };

  /* ---- score / session state --------------------------------------- */
  const state = {
    score: 0,
    muted: false
  };

  function addScore(points) {
    state.score += points;
    const badge = document.getElementById("score-value");
    if (badge) {
      badge.textContent = state.score;
      badge.classList.remove("pulse");
      void badge.offsetWidth; // restart animation
      badge.classList.add("pulse");
    }
  }

  /* ---- top bar (persistent) ---------------------------------------- */
  function renderTopBar() {
    const bar = el("header", { class: "topbar" }, [
      el("button", {
        class: "brand",
        attrs: { title: "Back to home" },
        on: { click: () => showModeSelect() },
        html:
          '<img class="skb-logo" src="' +
          (window.SkillbeeBrand ? window.SkillbeeBrand.logoWhite : "") +
          '" alt="Skillbee" />' +
          '<span class="brand-text"><b>Deutsch</b> Games</span>'
      }),
      el("div", { class: "topbar-right" }, [
        el("div", { class: "score-badge", attrs: { title: "Points this session" } }, [
          el("span", { class: "score-star", html: "⭐" }),
          el("span", { class: "score-value", attrs: { id: "score-value" }, text: "0" })
        ]),
        el("button", {
          class: "icon-btn",
          attrs: { id: "voice-btn", title: "Voice settings" },
          html: "🎙️",
          on: { click: () => { if (window.VoiceBox) window.VoiceBox.openSettings(); } }
        }),
        el("button", {
          class: "icon-btn",
          attrs: { id: "mute-btn", title: "Sound on/off" },
          html: "🔊",
          on: {
            click: (e) => {
              state.muted = !state.muted;
              e.currentTarget.innerHTML = state.muted ? "🔇" : "🔊";
            }
          }
        })
      ])
    ]);
    return bar;
  }

  /* ---- home screen (the lobby) ------------------------------------- */
  /* The admin gear is teacher-only: shown in Solo mode, hidden on the mode
     picker and everywhere in Live Mode (so students on phones can't reach it). */
  function setAdminVisible(v) {
    const b = document.getElementById("admin-btn");
    if (b) b.style.display = v ? "" : "none";
  }

  function showModeSelect() {
    if (window.LiveMode) window.LiveMode.stop();
    setAdminVisible(false);
    window.speechSynthesis && window.speechSynthesis.cancel();
    const main = document.getElementById("screen");
    main.innerHTML = "";
    main.appendChild(
      el("section", { class: "hero" }, [
        el("h1", { class: "hero-title", html: 'Skillbee <span>Deutsch</span> Games' }),
        el("p", { class: "hero-sub", text: "Choose how you want to play." })
      ])
    );
    const modeGrid = el("div", { class: "mode-grid" });
    modeGrid.appendChild(
      el("button", { class: "mode-card solo", on: { click: () => showHome() } }, [
        el("div", { class: "mode-emoji", text: "🎮" }),
        el("div", { class: "mode-name", text: "Solo / Offline" }),
        el("div", { class: "mode-desc", text: "Practice on one device — works without internet. Great for a single learner or a station." })
      ])
    );
    modeGrid.appendChild(
      el("button", { class: "mode-card live", on: { click: () => showLive() } }, [
        el("div", { class: "mode-emoji", text: "📡" }),
        el("div", { class: "mode-name", text: "Live Class Mode" }),
        el("div", { class: "mode-desc", text: "Teacher hosts on the smartboard, students play on their phones — room code, live scoring, leaderboard." })
      ])
    );
    main.appendChild(modeGrid);
  }

  function showLive() {
    setAdminVisible(false);
    const main = document.getElementById("screen");
    main.innerHTML = "";
    if (window.LiveMode) {
      window.LiveMode.start(main, { el, kit, store: window.ContentStore, back: () => showModeSelect() });
    }
  }

  function showHome() {
    if (window.LiveMode) window.LiveMode.stop();
    setAdminVisible(true);
    window.speechSynthesis && window.speechSynthesis.cancel();
    const main = document.getElementById("screen");
    main.innerHTML = "";

    main.appendChild(
      el("div", { class: "screen-back" }, [
        el("button", { class: "back-link", html: "← Modes", on: { click: () => showModeSelect() } })
      ])
    );

    main.appendChild(
      el("section", { class: "hero" }, [
        el("h1", { class: "hero-title", html: 'Welcome! Pick a <span>game</span> 🎲' }),
        el("p", {
          class: "hero-sub",
          text: "Gamify your German lessons — pick a game, choose a topic, and play with the class."
        })
      ])
    );

    const grid = el("div", { class: "game-grid" });
    games.forEach((game) => {
      grid.appendChild(
        el(
          "button",
          {
            class: "game-card",
            attrs: { style: `--accent:${game.color || "#1982c4"}` },
            on: { click: () => openTopicPicker(game) }
          },
          [
            el("div", { class: "game-emoji", text: game.emoji }),
            el("div", { class: "game-name", text: game.name }),
            el("div", { class: "game-desc", text: game.description }),
            el("div", { class: "game-play", html: "Spielen →" })
          ]
        )
      );
    });
    main.appendChild(grid);

    main.appendChild(
      el("footer", { class: "home-foot" }, [
        el("div", {
          class: "foot-note",
          html: "Made for Skillbee German teachers · Tip: press <kbd>F11</kbd> for full-screen in class"
        })
      ])
    );
  }

  /* ---- exercise picker (shown before a game starts) ---------------- */
  function openTopicPicker(game) {
    const main = document.getElementById("screen");
    main.innerHTML = "";

    main.appendChild(
      el("div", { class: "picker" }, [
        el("button", { class: "back-link", html: "← Back", on: { click: () => showHome() } }),
        el("h2", { class: "picker-title", html: `${game.emoji} ${game.name}` }),
        el("p", { class: "picker-sub", text: "Choose an exercise:" })
      ])
    );

    // Live-derived Solo games supply their own topic list (built from their
    // adapter); plain word/sentence games list their exercises directly.
    let topics, makeCard;
    if (typeof game.getTopics === "function") {
      topics = game.getTopics() || [];
      makeCard = (t) =>
        el("button", { class: "topic-card", on: { click: () => launch(game, t) } }, [
          el("div", { class: "topic-emoji", text: t.emoji || game.emoji }),
          el("div", { class: "topic-name", text: t.name }),
          el("div", { class: "topic-count", text: t.english || "" })
        ]);
    } else {
      const usesSentences = game.contentType === "sentences";
      topics = window.ContentStore.exercisesFor(game.id);
      makeCard = (ex) => {
        const count = usesSentences ? (ex.sentences || []).length : (ex.words || []).length;
        return el("button", { class: "topic-card", on: { click: () => launch(game, ex) } }, [
          el("div", { class: "topic-emoji", text: ex.emoji || (usesSentences ? "🗣️" : "📚") }),
          el("div", { class: "topic-name", text: ex.name }),
          el("div", { class: "topic-en", text: ex.english || "" }),
          el("div", { class: "topic-count", text: `${count} ${usesSentences ? "sentences" : "words"}` })
        ]);
      };
    }

    if (!topics.length) {
      main.appendChild(
        el("p", {
          class: "picker-empty",
          html: "No exercises for this game yet. Add one in <b>⚙️ Manage content</b>."
        })
      );
      return;
    }

    const grid = el("div", { class: "topic-grid" });
    topics.forEach((t) => grid.appendChild(makeCard(t)));
    main.appendChild(grid);
  }

  /* ---- launch a game with a chosen topic --------------------------- */
  function launch(game, topic) {
    const main = document.getElementById("screen");
    main.innerHTML = "";
    const stage = el("div", { class: "stage" });
    main.appendChild(stage);

    const api = {
      kit,
      topic,
      addScore,
      el,
      exit: () => showHome(),
      restart: () => launch(game, topic),
      backToTopics: () => openTopicPicker(game)
    };
    game.mount(stage, api);
  }

  /* ---- admin screen (content editor) ------------------------------- */
  function showAdmin(onExit) {
    // Teacher PIN gate (only enforced online); once unlocked, opens the editor.
    if (window.TeacherGate) window.TeacherGate.require(() => openAdmin(onExit));
    else openAdmin(onExit);
  }

  function openAdmin(onExit) {
    if (window.LiveMode) window.LiveMode.stop();
    setAdminVisible(false);
    window.speechSynthesis && window.speechSynthesis.cancel();
    const main = document.getElementById("screen");
    main.innerHTML = "";
    const container = el("div", { class: "admin" });
    main.appendChild(container);
    if (window.AdminUI) {
      window.AdminUI.mount(container, {
        el,
        kit,
        store: window.ContentStore,
        // Live-wrapped Solo games are excluded here — their content is edited
        // under the Live games, so listing them again would duplicate editors.
        games: games.filter((g) => !g.liveWrapped).map((g) => ({ id: g.id, name: g.name, emoji: g.emoji, color: g.color, contentType: g.contentType })),
        onExit: typeof onExit === "function" ? onExit : () => showHome()
      });
    }
  }

  /* ---- public API -------------------------------------------------- */
  function register(game) {
    games.push(game);
  }

  /* A fixed, decorative backdrop of floating doodles (gems, sparkles, German
     letters, a speech bubble) behind everything. Pure SVG so it stays crisp on
     a projector and works offline; content sits on opaque cards above it. */
  function renderBackdrop() {
    var bg = document.createElement("div");
    bg.className = "app-bg";
    bg.setAttribute("aria-hidden", "true");
    var gem = function (fill, op, facet) {
      return '<path d="M50 20 78 44 50 86 22 44Z" fill="' + fill + '" opacity="' + op + '"/>' +
        (facet ? '<path d="M22 44 50 56 78 44" stroke="' + fill + '" stroke-opacity="0.28" stroke-width="3" fill="none"/>' : '');
    };
    var star = function (fill, op) {
      return '<path d="M20 2 24 16 38 20 24 24 20 38 16 24 2 20 16 16Z" fill="' + fill + '" opacity="' + op + '"/>';
    };
    bg.innerHTML =
      '<svg class="ab ab-float" style="top:11%;left:4%" width="72" height="72" viewBox="0 0 100 100">' + gem("#0A84FF", 0.16, true) + '</svg>' +
      '<svg class="ab ab-float s2" style="bottom:12%;left:6%" width="54" height="54" viewBox="0 0 100 100">' + gem("#7A2BFF", 0.15, false) + '</svg>' +
      '<svg class="ab ab-float s3" style="top:16%;right:5%" width="60" height="60" viewBox="0 0 100 100">' + gem("#0B3FDD", 0.15, false) + '</svg>' +
      '<svg class="ab ab-float s2" style="bottom:16%;right:4%" width="46" height="46" viewBox="0 0 100 100">' + gem("#0A84FF", 0.14, false) + '</svg>' +
      '<svg class="ab ab-float" style="top:45%;left:2.5%" width="30" height="30" viewBox="0 0 40 40">' + star("#FFB703", 0.45) + '</svg>' +
      '<svg class="ab ab-float s3 ab-sm" style="bottom:30%;right:8%" width="26" height="26" viewBox="0 0 40 40">' + star("#0A84FF", 0.4) + '</svg>' +
      '<div class="ab ab-float s2 ab-letter ab-sm" style="top:12%;right:24%;font-size:3.4rem;color:#0A84FF;opacity:.11">ä</div>' +
      '<div class="ab ab-float ab-letter ab-sm" style="bottom:13%;right:21%;font-size:3rem;color:#7A2BFF;opacity:.11">ü</div>' +
      '<div class="ab ab-float s3 ab-letter ab-sm" style="bottom:34%;left:20%;font-size:2.6rem;color:#0B3FDD;opacity:.11">ß</div>' +
      '<svg class="ab ab-float ab-sm" style="top:36%;right:10%" width="90" height="74" viewBox="0 0 120 100">' +
        '<rect x="6" y="6" width="108" height="66" rx="20" fill="#0A84FF" opacity="0.12"/>' +
        '<path d="M30 70 26 92 50 70Z" fill="#0A84FF" opacity="0.12"/>' +
        '<text x="60" y="47" text-anchor="middle" font-family="' + "inherit" + '" font-weight="900" font-size="26" fill="#0B3FDD" fill-opacity="0.45">Hallo!</text>' +
      '</svg>';
    document.body.insertBefore(bg, document.body.firstChild);
  }

  function init() {
    root = document.getElementById("app");
    renderBackdrop();
    // Set the browser-tab icon to the official Skillbee badge.
    if (window.SkillbeeBrand && window.SkillbeeBrand.favicon) {

    }
    root.appendChild(renderTopBar());
    root.appendChild(el("main", { class: "screen", attrs: { id: "screen" } }));
    // Warm up voices list for speech synthesis.
    if ("speechSynthesis" in window) window.speechSynthesis.getVoices();
    // Start cloud content sync now that Firebase (if present) has loaded.
    if (window.ContentStore && window.ContentStore.initCloud) window.ContentStore.initCloud();
    showModeSelect();
  }

  return { register, init, kit, state, addScore, showHome, showAdmin, showModeSelect, showLive, setAdminVisible };
})();

/* ==== js/voice.js ==== */
/* =====================================================================
   VoiceBox — one pluggable text-to-speech layer for the whole app.
   Everything that speaks German (speaker buttons, game reveals, the
   Hör-gut-zu! word) goes through VoiceBox.speak(), so the voice chosen in
   Settings is used everywhere.

   Two engines:
   • Browser voices — the operating system's built-in German voices. Free,
     no setup, works offline. Quality varies by device (Chrome's "Google
     Deutsch" is good).
   • Azure neural voices — much higher quality. The app never calls Azure
     directly (the key must stay off this public site); instead a one-time
     script pre-generates the audio into /audio, and VoiceBox plays those
     files, falling back to a browser voice for anything not pre-generated.

   The chosen voice is stored per device (voices differ between a laptop and
   a phone), not synced.
   ===================================================================== */
(function () {
  var KEY = "skillbee_voice_v1";
  var manifest = null; // { files: {hash:1}, voices:[id] } once Azure audio exists

  // Curated Azure German neural voices offered in Settings.
  var AZURE_VOICES = [
    { id: "azure:de-DE-KatjaNeural", label: "Katja · Deutschland (weiblich)" },
    { id: "azure:de-DE-ConradNeural", label: "Conrad · Deutschland (männlich)" },
    { id: "azure:de-DE-AmalaNeural", label: "Amala · Deutschland (weiblich)" },
    { id: "azure:de-DE-KillianNeural", label: "Killian · Deutschland (männlich)" },
    { id: "azure:de-AT-IngridNeural", label: "Ingrid · Österreich (weiblich)" },
    { id: "azure:de-CH-LeniNeural", label: "Leni · Schweiz (weiblich)" }
  ];

  var chosen = loadChoice();

  function loadChoice() { try { return localStorage.getItem(KEY) || "system"; } catch (e) { return "system"; } }
  function setChoice(id) { chosen = id; try { localStorage.setItem(KEY, id); } catch (e) {} }

  // djb2 — must match scripts/generate-audio.js so filenames line up.
  function hash(s) {
    var h = 5381;
    for (var i = 0; i < s.length; i++) { h = ((h << 5) + h) + s.charCodeAt(i); h = h & 0xffffffff; }
    return (h >>> 0).toString(36);
  }
  function fileFor(voiceId, text) { return hash(voiceId + "|" + text); }

  function loadManifest() {
    try {
      fetch("audio/manifest.json")
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) { if (j && j.files) manifest = j; })
        .catch(function () {});
    } catch (e) {}
  }

  function browserVoices() {
    try {
      return (window.speechSynthesis ? window.speechSynthesis.getVoices() : [])
        .filter(function (v) { return v.lang && v.lang.toLowerCase().indexOf("de") === 0; });
    } catch (e) { return []; }
  }

  function speakBrowser(text, rate) {
    try {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "de-DE";
      u.rate = 0.95 * (rate || 1);
      var vs = browserVoices(), pick = null;
      if (chosen && chosen.indexOf("browser:") === 0) {
        var want = chosen.slice(8);
        pick = vs.filter(function (v) { return (v.voiceURI || v.name) === want || v.name === want; })[0];
      }
      if (!pick) pick = vs[0];
      if (pick) u.voice = pick;
      window.speechSynthesis.speak(u);
    } catch (e) { /* pronunciation is a nice-to-have */ }
  }

  // Play a specific voice's Azure file if it exists; returns true if it started.
  // `rate` (1 = normal) sets the mp3 playback speed.
  function playAzureFile(voiceId, text, rate) {
    if (!manifest || !manifest.files) return false;
    var h = fileFor(voiceId, text);
    if (!manifest.files[h]) return false;
    try {
      var a = new Audio("audio/" + h + ".mp3");
      if (rate && rate !== 1) { try { a.playbackRate = rate; } catch (e) {} }
      a.play().catch(function () { speakBrowser(text, rate); });
      return true;
    } catch (e) { return false; }
  }

  // speak(text, opts) — opts.rate scales the playback speed (1 = normal).
  function speak(text, opts) {
    text = String(text == null ? "" : text).trim();
    if (!text) return;
    var rate = (opts && opts.rate) || 1;
    if (chosen && chosen.indexOf("azure:") === 0) {
      if (playAzureFile(chosen, text, rate)) return; // pre-generated file
    }
    speakBrowser(text, rate); // fallback / browser voice
  }

  function azureReady() { return !!(manifest && manifest.files); }
  function voiceGenerated(id) {
    return !!(manifest && manifest.voices && manifest.voices.indexOf(id) >= 0);
  }

  /* ------- list of choices for the Settings screen ------- */
  function listVoices() {
    var out = [{ id: "system", label: "System default", kind: "browser" }];
    browserVoices().forEach(function (v) {
      out.push({ id: "browser:" + (v.voiceURI || v.name), label: v.name, kind: "browser" });
    });
    AZURE_VOICES.forEach(function (av) {
      out.push({ id: av.id, label: av.label, kind: "azure", ready: voiceGenerated(av.id) });
    });
    return out;
  }

  /* ------- Settings modal ------- */
  function openSettings() {
    var el = window.App && window.App.kit && window.App.kit.el;
    var overlay = document.createElement("div");
    overlay.className = "voice-overlay";
    function close() { overlay.remove(); }
    overlay.addEventListener("click", function (e) { if (e.target === overlay) close(); });

    var card = document.createElement("div");
    card.className = "voice-card";
    card.innerHTML =
      '<div class="voice-title">🎙️ Voice</div>' +
      '<p class="voice-sub">Pick the German voice used everywhere the app speaks. Saved on this device.</p>';

    var listWrap = document.createElement("div");
    listWrap.className = "voice-list";

    function row(v) {
      var r = document.createElement("label");
      r.className = "voice-row" + (chosen === v.id ? " sel" : "");
      var disabled = v.kind === "azure" && !v.ready;

      var radio = document.createElement("input");
      radio.type = "radio"; radio.name = "voice"; radio.className = "voice-radio";
      radio.checked = chosen === v.id; radio.disabled = disabled;
      radio.addEventListener("change", function () {
        setChoice(v.id);
        Array.prototype.forEach.call(listWrap.children, function (c) { c.classList.remove("sel"); });
        r.classList.add("sel");
      });

      var name = document.createElement("span");
      name.className = "voice-name";
      name.textContent = v.label + (v.kind === "azure" ? "  ✨" : "");

      var test = document.createElement("button");
      test.className = "voice-test"; test.type = "button"; test.textContent = "▶";
      test.title = "Hear a sample";
      test.disabled = disabled;
      test.addEventListener("click", function (e) {
        e.preventDefault();
        var prev = chosen; chosen = v.id;        // temporarily use this voice
        speak("Hallo! Ich spreche Deutsch.");
        chosen = prev;
      });

      r.appendChild(radio); r.appendChild(name); r.appendChild(test);
      if (disabled) { var tag = document.createElement("span"); tag.className = "voice-tag"; tag.textContent = "needs setup"; r.appendChild(tag); }
      return r;
    }

    listVoices().forEach(function (v) { listWrap.appendChild(row(v)); });
    card.appendChild(listWrap);

    if (!azureReady()) {
      var note = document.createElement("p");
      note.className = "voice-note";
      note.innerHTML = "✨ <b>Azure neural voices</b> are higher quality. They appear once your admin has generated the audio (see <code>docs/AUDIO_SETUP.md</code>).";
      card.appendChild(note);
    }

    var done = document.createElement("button");
    done.className = "btn primary voice-done"; done.textContent = "Done";
    done.addEventListener("click", close);
    card.appendChild(done);

    overlay.appendChild(card);
    document.body.appendChild(overlay);
  }

  window.VoiceBox = {
    speak: speak,
    listVoices: listVoices,
    openSettings: openSettings,
    get: function () { return chosen; },
    set: setChoice,
    azureReady: azureReady,
    hash: hash
  };
  loadManifest();
})();


/* ==== js/games/quiz.js ==== */
/* =====================================================================
   GAME: Vokabel-Quiz  (Kahoot-style multiple choice)
   Show a German word (or English word) and 4 answer options with a
   timer. Right answer = points + streak bonus. Great for the whole class.
   ===================================================================== */
(function () {
  App.register({
    id: "quiz",
    name: "Vocabulary Quiz",
    emoji: "🎯",
    color: "#ff595e",
    description: "Multiple-choice quiz with a timer. Answer fast for bonus points!",
    contentType: "words",

    mount(stage, api) {
      const { kit, topic, addScore, el } = api;
      if (!topic.words || topic.words.length === 0) {
        kit.notice(stage, "No words yet", "Add words to this topic via ⚙️ Manage content.", api);
        return;
      }
      const words = topic.words;
      const TOTAL = Math.min(8, words.length);
      const pool = kit.sample(words, TOTAL);
      let index = 0;
      let correct = 0;
      let streak = 0;
      let timer = null;
      let timeLeft = 0;
      // Ask German -> English half the time, English -> German the other half.
      let askGermanToEnglish = true;

      const wrap = el("div", { class: "quiz" });
      stage.appendChild(wrap);

      function render() {
        clearInterval(timer);
        const q = pool[index];
        askGermanToEnglish = index % 2 === 0;
        const prompt = askGermanToEnglish ? q.de : q.en;
        const answer = askGermanToEnglish ? q.en : q.de;

        // Build 3 wrong options from the same topic.
        const others = words.filter((w) => (askGermanToEnglish ? w.en : w.de) !== answer);
        const distractors = kit.sample(others, 3).map((w) => (askGermanToEnglish ? w.en : w.de));
        const options = kit.shuffle([answer, ...distractors]);

        wrap.innerHTML = "";
        wrap.appendChild(
          el("div", { class: "quiz-head" }, [
            el("button", { class: "back-link small", html: "← Menu", on: { click: api.exit } }),
            el("div", { class: "quiz-progress", text: `Question ${index + 1} / ${TOTAL}` }),
            el("div", { class: "quiz-streak", text: streak > 1 ? `🔥 ${streak} streak` : "" })
          ])
        );

        const bar = el("div", { class: "timer-bar" }, [el("div", { class: "timer-fill", attrs: { id: "tfill" } })]);
        wrap.appendChild(bar);

        wrap.appendChild(
          el("div", { class: "quiz-question" }, [
            el("div", { class: "quiz-lang-tag", text: askGermanToEnglish ? "What does this mean?" : "What's the German word?" }),
            el("div", { class: "quiz-word" }, [
              document.createTextNode(prompt + " "),
              askGermanToEnglish ? kit.speakerButton(q.de) : null
            ]),
            q.emoji ? el("div", { class: "quiz-emoji", text: q.emoji }) : null
          ])
        );

        const optWrap = el("div", { class: "quiz-options" });
        const shapes = ["🔺", "🔷", "⬤", "⬛"];
        options.forEach((opt, i) => {
          optWrap.appendChild(
            el("button", {
              class: "quiz-opt",
              attrs: { style: `--i:${i}` },
              on: { click: (e) => choose(e.currentTarget, opt, answer, q) }
            }, [
              el("span", { class: "opt-shape", text: shapes[i] }),
              el("span", { class: "opt-text", text: opt })
            ])
          );
        });
        wrap.appendChild(optWrap);

        // start timer
        timeLeft = 100;
        const fill = document.getElementById("tfill");
        timer = setInterval(() => {
          timeLeft -= 1.5;
          if (fill) fill.style.width = Math.max(0, timeLeft) + "%";
          if (timeLeft <= 0) {
            clearInterval(timer);
            reveal(null, answer, q);
          }
        }, 60);
      }

      function choose(btn, opt, answer, q) {
        clearInterval(timer);
        reveal(btn, answer, q, opt);
      }

      function reveal(btn, answer, q, chosen) {
        const buttons = wrap.querySelectorAll(".quiz-opt");
        buttons.forEach((b) => {
          b.disabled = true;
          const txt = b.querySelector(".opt-text").textContent;
          if (txt === answer) b.classList.add("correct");
          else if (b === btn) b.classList.add("wrong");
        });

        const wasRight = chosen === answer;
        if (wasRight) {
          const bonus = Math.round(timeLeft / 10); // faster = more
          const points = 10 + bonus;
          correct++;
          streak++;
          addScore(points);
          kit.beep("good");
        } else {
          streak = 0;
          kit.beep("bad");
          // Speak the correct German word so students hear it.
          kit.speak(q.de);
        }

        setTimeout(() => {
          index++;
          if (index < TOTAL) render();
          else finish();
        }, 1200);
      }

      function finish() {
        clearInterval(timer);
        const pct = Math.round((correct / TOTAL) * 100);
        if (pct >= 60) kit.confetti();
        kit.beep(pct >= 60 ? "win" : "bad");
        wrap.innerHTML = "";
        wrap.appendChild(
          el("div", { class: "result-card" }, [
            el("div", { class: "result-emoji", text: pct >= 80 ? "🏆" : pct >= 60 ? "🎉" : "💪" }),
            el("h2", { text: pct >= 60 ? "Well done!" : "Keep practising!" }),
            el("p", { class: "result-score", html: `<b>${correct}</b> of <b>${TOTAL}</b> correct · ${pct}%` }),
            el("div", { class: "result-actions" }, [
              el("button", { class: "btn primary", text: "Play again", on: { click: api.restart } }),
              el("button", { class: "btn", text: "Other topic", on: { click: api.backToTopics } }),
              el("button", { class: "btn ghost", text: "Menu", on: { click: api.exit } })
            ])
          ])
        );
      }

      render();
    }
  });
})();


/* ==== js/games/memory.js ==== */
/* =====================================================================
   GAME: Memory  (Paare finden)
   Flip cards to match a German word with its English meaning (with a
   helpful emoji). Fewer moves = more points. Good for small groups/pairs.
   ===================================================================== */
(function () {
  App.register({
    id: "memory",
    name: "Memory",
    emoji: "🧩",
    color: "#8ac926",
    description: "Flip cards to match German words with their meaning.",
    contentType: "words",

    mount(stage, api) {
      const { kit, topic, addScore, el } = api;
      if (!topic.words || topic.words.length === 0) {
        kit.notice(stage, "No words yet", "Add words to this topic via ⚙️ Manage content.", api);
        return;
      }
      const PAIRS = Math.min(6, topic.words.length);
      const chosen = kit.sample(topic.words, PAIRS);

      // Build two cards per word: a German side and an English (+emoji) side.
      let cards = [];
      chosen.forEach((w, i) => {
        cards.push({ pair: i, face: w.de, kind: "de", speak: w.de });
        cards.push({ pair: i, face: (w.emoji ? w.emoji + " " : "") + w.en, kind: "en", speak: w.de });
      });
      cards = kit.shuffle(cards);

      let flipped = [];
      let matched = 0;
      let moves = 0;
      let busy = false;

      const wrap = el("div", { class: "memory" });
      stage.appendChild(wrap);

      wrap.appendChild(
        el("div", { class: "game-head" }, [
          el("button", { class: "back-link small", html: "← Menu", on: { click: api.exit } }),
          el("div", { class: "head-title", text: `${topic.emoji} ${topic.name}` }),
          el("div", { class: "moves", attrs: { id: "moves" }, text: "0 moves" })
        ])
      );

      const board = el("div", { class: "memory-board", attrs: { style: `--cols:${cards.length > 8 ? 4 : 3}` } });
      wrap.appendChild(board);

      cards.forEach((card, idx) => {
        const node = el("button", {
          class: "mem-card",
          attrs: { "data-idx": idx },
          on: { click: () => flip(idx, node) }
        }, [
          el("div", { class: "mem-inner" }, [
            el("div", { class: "mem-front" }, [
              el("img", {
                class: "mem-logo",
                attrs: { src: window.SkillbeeBrand ? window.SkillbeeBrand.favicon : "", alt: "" }
              })
            ]),
            el("div", { class: `mem-back ${card.kind}`, text: card.face })
          ])
        ]);
        board.appendChild(node);
        card.node = node;
      });

      function flip(idx, node) {
        if (busy || node.classList.contains("flipped") || node.classList.contains("done")) return;
        node.classList.add("flipped");
        flipped.push(idx);
        if (flipped.length === 2) {
          busy = true;
          moves++;
          document.getElementById("moves").textContent = moves + (moves === 1 ? " move" : " moves");
          const [a, b] = flipped;
          if (cards[a].pair === cards[b].pair) {
            kit.beep("good");
            kit.speak(cards[a].speak);
            setTimeout(() => {
              cards[a].node.classList.add("done");
              cards[b].node.classList.add("done");
              flipped = [];
              busy = false;
              matched++;
              addScore(15);
              if (matched === PAIRS) finish();
            }, 550);
          } else {
            kit.beep("bad");
            setTimeout(() => {
              cards[a].node.classList.remove("flipped");
              cards[b].node.classList.remove("flipped");
              flipped = [];
              busy = false;
            }, 900);
          }
        }
      }

      function finish() {
        // Bonus for efficiency: perfect game is `PAIRS` moves.
        const bonus = Math.max(0, (PAIRS * 2 - moves)) * 5;
        if (bonus > 0) addScore(bonus);
        kit.confetti();
        kit.beep("win");
        setTimeout(() => {
          wrap.innerHTML = "";
          wrap.appendChild(
            el("div", { class: "result-card" }, [
              el("div", { class: "result-emoji", text: "🎉" }),
              el("h2", { text: "All pairs found!" }),
              el("p", { class: "result-score", html: `In <b>${moves}</b> moves · Bonus: <b>${bonus}</b>` }),
              el("div", { class: "result-actions" }, [
                el("button", { class: "btn primary", text: "Play again", on: { click: api.restart } }),
                el("button", { class: "btn", text: "Other topic", on: { click: api.backToTopics } }),
                el("button", { class: "btn ghost", text: "Menu", on: { click: api.exit } })
              ])
            ])
          );
        }, 700);
      }
    }
  });
})();


/* ==== js/games/hangman.js ==== */
/* =====================================================================
   GAME: Galgenmännchen  (Hangman)
   Guess the German word letter by letter. An English hint + emoji is
   shown. 6 wrong guesses allowed. Nice as a warm-up with the class.
   ===================================================================== */
(function () {
  const ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÜ".split("");
  const MAX_WRONG = 6;
  const STAGES = ["😀", "🙂", "😐", "😟", "😧", "😨", "💀"];

  App.register({
    id: "hangman",
    name: "Hangman",
    emoji: "🔤",
    color: "#6a4c93",
    description: "Guess the German word letter by letter before the timer runs out.",
    contentType: "words",

    mount(stage, api) {
      const { kit, topic, addScore, el } = api;
      if (!topic.words || topic.words.length === 0) {
        kit.notice(stage, "No words yet", "Add words to this topic via ⚙️ Manage content.", api);
        return;
      }
      const entry = kit.sample(topic.words, 1)[0];
      // Strip the article (der/die/das) for guessing; keep it for the reveal.
      const full = entry.de;
      const guessWord = full.replace(/^(der|die|das)\s+/i, "");
      const letters = guessWord.toUpperCase().split("");
      const guessed = new Set();
      let wrong = 0;
      let solved = false;

      const wrap = el("div", { class: "hangman" });
      stage.appendChild(wrap);

      function isLetter(ch) {
        return /[A-ZÄÖÜ]/.test(ch);
      }

      function render() {
        wrap.innerHTML = "";
        wrap.appendChild(
          el("div", { class: "game-head" }, [
            el("button", { class: "back-link small", html: "← Menu", on: { click: api.exit } }),
            el("div", { class: "head-title", text: `${topic.emoji} ${topic.name}` }),
            el("div", { class: "moves", text: `${MAX_WRONG - wrong} ❤️` })
          ])
        );

        wrap.appendChild(el("div", { class: "hang-face", text: STAGES[wrong] }));
        wrap.appendChild(
          el("div", { class: "hang-hint" }, [
            document.createTextNode(`Hint: ${entry.en} `),
            entry.emoji ? el("span", { text: entry.emoji }) : null
          ])
        );

        // The word with blanks
        const wordRow = el("div", { class: "hang-word" });
        letters.forEach((ch) => {
          if (!isLetter(ch)) {
            wordRow.appendChild(el("span", { class: "hang-space", text: ch === " " ? "·" : ch }));
          } else {
            const show = guessed.has(ch) || solved;
            wordRow.appendChild(el("span", { class: "hang-slot" + (show ? " filled" : ""), text: show ? ch : "" }));
          }
        });
        wrap.appendChild(wordRow);

        // Keyboard
        const kb = el("div", { class: "keyboard" });
        ALPHABET.forEach((L) => {
          const used = guessed.has(L);
          const inWord = letters.includes(L);
          kb.appendChild(
            el("button", {
              class: "key" + (used ? (inWord ? " right" : " miss") : ""),
              attrs: used ? { disabled: "true" } : {},
              text: L,
              on: { click: () => guess(L) }
            })
          );
        });
        wrap.appendChild(kb);
      }

      function guess(L) {
        if (guessed.has(L) || solved) return;
        guessed.add(L);
        if (letters.includes(L)) {
          kit.beep("good");
          if (letters.filter(isLetter).every((c) => guessed.has(c))) return win();
        } else {
          wrong++;
          kit.beep("bad");
          if (wrong >= MAX_WRONG) return lose();
        }
        render();
      }

      function win() {
        solved = true;
        const points = 20 + (MAX_WRONG - wrong) * 5;
        addScore(points);
        render();
        kit.confetti();
        kit.beep("win");
        kit.speak(full);
        banner(true, points);
      }

      function lose() {
        solved = true;
        render();
        kit.beep("bad");
        kit.speak(full);
        banner(false, 0);
      }

      function banner(won, points) {
        wrap.appendChild(
          el("div", { class: "result-card inline" }, [
            el("div", { class: "result-emoji", text: won ? "🎉" : "😅" }),
            el("h2", { html: won ? `Correct! <b>${full}</b>` : `The word was: <b>${full}</b>` }),
            won ? el("p", { class: "result-score", html: `+${points} points` }) : null,
            el("div", { class: "result-actions" }, [
              el("button", { class: "btn primary", text: "New word", on: { click: api.restart } }),
              el("button", { class: "btn", text: "Other topic", on: { click: api.backToTopics } }),
              el("button", { class: "btn ghost", text: "Menu", on: { click: api.exit } })
            ])
          ])
        );
      }

      // Allow physical keyboard typing too.
      function onKey(e) {
        const L = (e.key || "").toUpperCase();
        if (ALPHABET.includes(L)) guess(L);
      }
      document.addEventListener("keydown", onKey);
      // Clean up the listener when leaving via any button that clears the stage.
      const cleanup = new MutationObserver(() => {
        if (!document.body.contains(wrap)) {
          document.removeEventListener("keydown", onKey);
          cleanup.disconnect();
        }
      });
      cleanup.observe(document.body, { childList: true, subtree: true });

      render();
    }
  });
})();


/* ==== js/games/scramble.js ==== */
/* =====================================================================
   GAME: Satzbau  (Sentence Scramble)
   The words of a German sentence are shuffled. Click them in the right
   order to rebuild the sentence. Teaches word order (great for A1–A2).
   ===================================================================== */
(function () {
  App.register({
    id: "scramble",
    name: "Sentence Scramble",
    emoji: "🧱",
    color: "#3b4de8",
    description: "Put the shuffled German words back into the correct order.",
    contentType: "sentences", // uses SENTENCE_TOPICS instead of words

    mount(stage, api) {
      const { kit, topic, addScore, el } = api;
      if (!topic.sentences || topic.sentences.length === 0) {
        kit.notice(stage, "No sentences yet", "Add sentences to this topic via ⚙️ Manage content.", api);
        return;
      }
      const TOTAL = Math.min(5, topic.sentences.length);
      const pool = kit.sample(topic.sentences, TOTAL);
      let index = 0;
      let solvedCount = 0;

      const wrap = el("div", { class: "scramble" });
      stage.appendChild(wrap);

      function render() {
        const item = pool[index];
        const target = item.de.replace(/\s+/g, " ").trim();
        const targetWords = target.split(" ");
        let build = []; // chosen words (indexes into bank)

        wrap.innerHTML = "";
        wrap.appendChild(
          el("div", { class: "game-head" }, [
            el("button", { class: "back-link small", html: "← Menu", on: { click: api.exit } }),
            el("div", { class: "head-title", text: `Sentence ${index + 1} / ${TOTAL}` }),
            el("div", { class: "moves", text: topic.emoji + " " + topic.name })
          ])
        );

        wrap.appendChild(el("div", { class: "scr-hint", text: `„${item.en}"` }));

        const answerRow = el("div", { class: "scr-answer", attrs: { id: "answer" } });
        wrap.appendChild(answerRow);

        const bankRow = el("div", { class: "scr-bank", attrs: { id: "bank" } });
        wrap.appendChild(bankRow);

        // Build a shuffled bank; reshuffle if it happens to match the answer.
        let order = kit.shuffle(targetWords.map((_, i) => i));
        if (targetWords.length > 1 && order.every((v, i) => v === i)) order = order.reverse();

        const bankButtons = [];
        order.forEach((wordIdx, pos) => {
          const btn = el("button", {
            class: "scr-word",
            attrs: { style: `--i:${pos}` },
            text: targetWords[wordIdx],
            on: { click: () => pick(pos) }
          });
          bankButtons.push(btn);
          bankRow.appendChild(btn);
        });

        const checkBtn = el("button", { class: "btn primary scr-check", text: "Check ✓", attrs: { disabled: "true" }, on: { click: check } });
        const clearBtn = el("button", { class: "btn ghost", text: "Reset", on: { click: render } });
        wrap.appendChild(el("div", { class: "scr-actions" }, [clearBtn, checkBtn]));

        function pick(pos) {
          const btn = bankButtons[pos];
          if (btn.classList.contains("used")) return;
          btn.classList.add("used");
          build.push(pos);
          kit.beep("good");
          renderAnswer();
        }

        function unpick(buildPos) {
          const pos = build[buildPos];
          bankButtons[pos].classList.remove("used");
          build.splice(buildPos, 1);
          renderAnswer();
        }

        function renderAnswer() {
          answerRow.innerHTML = "";
          build.forEach((pos, i) => {
            answerRow.appendChild(
              el("button", { class: "scr-word chosen", text: bankButtons[pos].textContent, on: { click: () => unpick(i) } })
            );
          });
          checkBtn.disabled = build.length !== targetWords.length;
          answerRow.classList.remove("shake", "ok");
        }

        function check() {
          const attempt = build.map((pos) => bankButtons[pos].textContent);
          const correct = attempt.join(" ") === targetWords.join(" ");
          if (correct) {
            answerRow.classList.add("ok");
            addScore(20);
            solvedCount++;
            kit.beep("win");
            kit.speak(target);
            checkBtn.disabled = true;
            setTimeout(next, 1300);
          } else {
            answerRow.classList.add("shake");
            kit.beep("bad");
          }
        }
      }

      function next() {
        index++;
        if (index < TOTAL) render();
        else finish();
      }

      function finish() {
        kit.confetti();
        kit.beep("win");
        wrap.innerHTML = "";
        wrap.appendChild(
          el("div", { class: "result-card" }, [
            el("div", { class: "result-emoji", text: "🏗️" }),
            el("h2", { text: "All sentences built!" }),
            el("p", { class: "result-score", html: `<b>${solvedCount}</b> of <b>${TOTAL}</b> sentences` }),
            el("div", { class: "result-actions" }, [
              el("button", { class: "btn primary", text: "Play again", on: { click: api.restart } }),
              el("button", { class: "btn", text: "Other topic", on: { click: api.backToTopics } }),
              el("button", { class: "btn ghost", text: "Menu", on: { click: api.exit } })
            ])
          ])
        );
      }

      render();
    }
  });
})();


/* ==== js/translate.js ==== */
/* =====================================================================
   AutoTranslate — German → English, using the BROWSER'S BUILT-IN
   on-device translator (Chrome / Edge). Same spirit as the built-in
   speech voice: no API key, no server, runs on the device (offline once
   the language model has downloaded once).

   The actual translate call lives behind translateText()/translateBatch()
   so the engine can be swapped later without touching any UI code.

   If the browser has no built-in translator (e.g. Safari, Firefox, older
   Chrome), the feature simply reports "not available" — there is no other
   fallback by design.

   NOTE: exposed as window.AutoTranslate on purpose — NOT window.Translator —
   because modern Chrome exposes a native global called `Translator`, and we
   must not clobber it (we call it).
   ===================================================================== */
(function () {
  var SRC = "de", TGT = "en";
  var _t = null;        // cached translator instance
  var _pending = null;  // in-flight create()

  // Find whichever shape of the built-in translator this browser exposes.
  function factory() {
    try {
      if (typeof self !== "undefined" && self.Translator && typeof self.Translator.create === "function") return self.Translator;             // Chrome 138+ (stable)
      if (typeof self !== "undefined" && self.ai && self.ai.translator && typeof self.ai.translator.create === "function") return self.ai.translator; // earlier shape
    } catch (e) {}
    return null;
  }

  // Is a built-in translator present at all? (Sync — safe to gate UI on.)
  function supported() { return !!factory(); }

  function notSupported() {
    var e = new Error("This browser has no built-in translator.");
    e.code = "unsupported";
    return e;
  }

  // 'available' | 'downloadable' | 'downloading' | 'unavailable'
  function availability() {
    var f = factory();
    if (!f) return Promise.resolve("unavailable");
    try {
      if (typeof f.availability === "function") {
        return Promise.resolve(f.availability({ sourceLanguage: SRC, targetLanguage: TGT }));
      }
      if (typeof f.capabilities === "function") { // older capabilities() API
        return Promise.resolve(f.capabilities()).then(function (c) {
          var s = c && typeof c.languagePairAvailable === "function"
            ? c.languagePairAvailable(SRC, TGT) : (c && c.available) || "available";
          if (s === "readily") return "available";
          if (s === "after-download") return "downloadable";
          if (s === "no") return "unavailable";
          return s || "available";
        }).catch(function () { return "available"; });
      }
    } catch (e) {}
    return Promise.resolve("available"); // create() exists but no capability probe — assume usable
  }

  function getTranslator() {
    if (_t) return Promise.resolve(_t);
    if (_pending) return _pending;
    var f = factory();
    if (!f) return Promise.reject(notSupported());
    _pending = Promise.resolve(f.create({ sourceLanguage: SRC, targetLanguage: TGT }))
      .then(function (t) { _t = t; _pending = null; return t; })
      .catch(function (e) { _pending = null; throw e; });
    return _pending;
  }

  function translateText(germanText) {
    var text = String(germanText == null ? "" : germanText);
    if (!text.trim()) return Promise.resolve("");
    return getTranslator().then(function (t) { return t.translate(text); }).then(function (en) { return en || ""; });
  }

  // The on-device model translates one string at a time; chain them so a bulk
  // fill works without firing dozens of concurrent calls.
  function translateBatch(texts) {
    if (!Array.isArray(texts) || !texts.length) return Promise.resolve([]);
    return getTranslator().then(function (t) {
      return texts.reduce(function (chain, txt) {
        return chain.then(function (acc) {
          var s = String(txt == null ? "" : txt);
          if (!s.trim()) { acc.push(""); return acc; }
          return Promise.resolve(t.translate(s)).then(function (en) { acc.push(en || ""); return acc; });
        });
      }, Promise.resolve([]));
    });
  }

  window.AutoTranslate = {
    supported: supported,       // sync boolean — is the built-in translator present?
    availability: availability, // async status string
    translateText: translateText,
    translateBatch: translateBatch
  };
})();

  // Normalise a term for lookup: lowercase, trim punctuation, drop a leading
  // article ("der/die/das", "the/a/an") or "to " (for verbs).
  function norm(s) {
    s = String(s == null ? "" : s).toLowerCase();
    try { s = s.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, ""); } catch (e) { s = s.replace(/^[^a-z0-9äöüß]+|[^a-z0-9äöüß]+$/g, ""); }

    return s.trim();
  }

  // Return an emoji for `text`, or "" if nothing sensible matches.
  function forText(text) {
    var n = norm(text);
    if (!n) return "";

      if (w.length > 3 && w.charAt(w.length - 1) === "s" && DICT[w.slice(0, -1)]) return DICT[w.slice(0, -1)]; // English plural
    }

  function forTexts(arr) {
    for (var i = 0; i < (arr || []).length; i++) {
      var e = forText(arr[i]);
      if (e) return e;
    }
