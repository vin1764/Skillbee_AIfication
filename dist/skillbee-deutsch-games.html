<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Skillbee Deutsch Games — Gamify your German lessons</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%233b4de8'/></svg>" />
<style>
/* =====================================================================
   Skillbee Deutsch Games — STYLES
   Bright, friendly, high-contrast for classroom projectors.
   ===================================================================== */
:root {
  --bg: #F4F7FF;
  --bg-grad-1: #E9F1FF;
  --bg-grad-2: #EAF2FF;
  --ink: #0B1533;
  --ink-soft: #59688F;
  --card: #ffffff;
  --line: #E2EAF9;
  --line-deep: #CBD8F1;     /* darker hairline — the "lip" under pushable buttons/cards */
  --brand: #ffb703;         /* gold — used only for the points/score reward badge */
  --brand-ink: #7a4f00;
  --azure: #0A84FF;         /* Skillbee gem — light end (sampled from the logo) */
  --skb: #0B3FDD;           /* Skillbee royal blue — primary */
  --skb-dark: #002CBF;      /* Skillbee gem — deep end */
  --skb-lip: #05219E;       /* pressed shadow under blue buttons */
  --skb-tint: #EAF0FF;
  --accent: var(--skb);     /* primary interactive / brand color */
  --accent-dark: var(--skb-dark);
  --grad: linear-gradient(140deg, #0A84FF 0%, #0B3FDD 55%, #002CBF 100%);
  --good: #12C08A;          /* emerald */
  --bad: #FF3B67;           /* ruby */
  --radius: 18px;
  --shadow: 0 12px 30px rgba(7, 21, 80, 0.10);
  --shadow-lg: 0 24px 56px rgba(7, 21, 80, 0.20);
  --font: "Nunito", "Segoe UI Rounded", ui-rounded, "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  color: var(--ink);
  background:
    radial-gradient(820px 560px at 6% 2%, rgba(10, 132, 255, 0.14), transparent 60%),
    radial-gradient(760px 560px at 96% 98%, rgba(122, 43, 255, 0.11), transparent 60%),
    var(--bg);
  background-attachment: fixed;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ---------- playful backdrop: floating cartoon doodles (behind all content) ---------- */
#app { position: relative; z-index: 1; }
.app-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.app-bg .ab { position: absolute; }
.app-bg .ab-letter { font-family: var(--font); font-weight: 900; line-height: 1; }
.app-bg .ab-float { animation: abFloat 8s ease-in-out infinite; will-change: transform; }
.app-bg .ab-float.s2 { animation-duration: 10.5s; }
.app-bg .ab-float.s3 { animation-duration: 13s; }
@keyframes abFloat { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-12px) rotate(4deg); } }
@media (prefers-reduced-motion: reduce) { .app-bg .ab-float { animation: none; } }
@media (max-width: 760px) { .app-bg .ab-sm { display: none; } }

button { font-family: inherit; cursor: pointer; }
kbd {
  background: #fff; border: 1px solid var(--line); border-bottom-width: 2px;
  border-radius: 6px; padding: 1px 6px; font-size: 0.85em; color: var(--ink);
}

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20; overflow: hidden;
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px clamp(14px, 4vw, 40px);
  background: var(--grad);
  border-bottom: none;
  box-shadow: 0 8px 22px rgba(7, 21, 80, 0.28);
}
/* faint Skillbee-gem watermark */
.topbar::after {
  content: ""; position: absolute; right: -18px; top: -34px; width: 118px; height: 118px;
  background: #fff; opacity: 0.08; pointer-events: none;
  clip-path: polygon(50% 0, 100% 38%, 50% 100%, 0 38%);
}
.brand {
  display: flex; align-items: center; gap: 10px;
  background: none; border: 0; font-size: 1.15rem; color: #fff; padding: 4px;
}
.skb-logo { height: 30px; width: auto; display: block; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.18)); }
.brand-text { letter-spacing: .2px; font-weight: 600; }
.brand-text b { color: #fff; font-weight: 800; }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.score-badge {
  display: flex; align-items: center; gap: 6px;
  background: linear-gradient(135deg, #fff3cf, #ffe08a);
  color: var(--brand-ink); font-weight: 800;
  padding: 8px 14px; border-radius: 999px; border: 1px solid #f3d98a;
  box-shadow: var(--shadow);
}
.score-value { min-width: 1.2ch; text-align: center; display: inline-block; }
.score-value.pulse { animation: pop 0.4s ease; }
.icon-btn {
  background: rgba(255, 255, 255, 0.16); border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: 12px; width: 42px; height: 42px; font-size: 1.1rem; color: #fff;
}
.icon-btn:hover { background: rgba(255, 255, 255, 0.28); transform: translateY(-1px); }

/* ---------- screen ---------- */
.screen { padding: clamp(18px, 4vw, 44px); max-width: 1100px; margin: 0 auto; }

/* ---------- hero ---------- */
.hero { text-align: center; margin: 10px 0 26px; }
.hero-title { font-size: clamp(1.8rem, 4.5vw, 3rem); margin: 0 0 8px; letter-spacing: -0.5px; }
.hero-title span { color: var(--accent); }
.hero-sub { color: var(--ink-soft); font-size: clamp(1rem, 2vw, 1.2rem); margin: 0 auto; max-width: 640px; }

/* ---------- game grid (lobby) ---------- */
.game-grid {
  display: grid; gap: 18px;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
}
.game-card {
  position: relative; text-align: left;
  background: var(--card); border: 2px solid var(--line);
  border-radius: var(--radius); padding: 20px; box-shadow: 0 8px 0 var(--line-deep);
  transition: transform 0.08s ease, box-shadow 0.08s ease;
  overflow: hidden;
}
.game-card:hover { transform: translateY(-3px); }
.game-card:active { transform: translateY(4px); box-shadow: 0 4px 0 var(--line-deep); }
/* emoji sits in a rounded-square tile — the shape of the Skillbee app badge */
.game-emoji {
  display: inline-grid; place-items: center; width: 56px; height: 56px;
  border-radius: 16px; font-size: 1.7rem; line-height: 1; margin-bottom: 12px;
  box-shadow: 0 5px 12px rgba(7, 21, 80, 0.08);
  background: var(--skb-tint);
  background: color-mix(in srgb, var(--accent) 16%, #fff);
}
.game-name { font-size: 1.25rem; font-weight: 800; margin-bottom: 6px; }
.game-desc { color: var(--ink-soft); font-size: 0.95rem; min-height: 2.6em; }
.game-play { margin-top: 12px; font-weight: 800; color: var(--skb); }

.home-foot { text-align: center; color: var(--ink-soft); margin-top: 34px; font-size: 0.9rem; }

/* ---------- topic picker ---------- */
.picker { text-align: center; margin-bottom: 22px; }
.picker-title { font-size: clamp(1.5rem, 4vw, 2.2rem); margin: 6px 0; }
.picker-sub { color: var(--ink-soft); margin: 0; }
/* One standard back button, pinned to the upper-left of every screen. */
/* Pinned just BELOW the sticky top bar (≈66px tall) so it never collides with it. */
.back-link {
  position: fixed; top: 76px; left: clamp(14px, 4vw, 40px); z-index: 15;
  background: #fff; border: 0; border-radius: 12px;
  padding: 8px 15px; font-weight: 800; color: var(--accent);
  box-shadow: 0 4px 0 var(--line-deep), inset 0 0 0 2px var(--line);
  transition: transform 0.06s, box-shadow 0.06s;
}
.back-link.small { padding: 7px 13px; font-size: 0.92rem; }
.back-link:hover { box-shadow: 0 4px 0 var(--line-deep), inset 0 0 0 2px var(--accent); }
.back-link:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line-deep), inset 0 0 0 2px var(--accent); }
/* Reserve room for the pinned button on screens that have one. */
.screen:has(.back-link) { padding-top: 66px; }

.topic-grid {
  display: grid; gap: 14px;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
}
.topic-card {
  background: var(--card); border: 2px solid var(--line); border-radius: 16px;
  padding: 18px 12px; text-align: center; box-shadow: 0 7px 0 var(--line-deep);
  transition: transform 0.08s, box-shadow 0.08s;
}
.topic-card:hover { transform: translateY(-3px); }
.topic-card:active { transform: translateY(4px); box-shadow: 0 3px 0 var(--line-deep); }
.topic-emoji {
  display: inline-grid; place-items: center; width: 54px; height: 54px; border-radius: 15px;
  background: var(--skb-tint); font-size: 1.65rem; margin-bottom: 4px;
}
.topic-name { font-weight: 800; margin-top: 6px; }
.topic-en { color: var(--ink-soft); font-size: 0.85rem; }
.topic-count { margin-top: 8px; font-size: 0.8rem; color: var(--accent); font-weight: 700; }

/* ---------- generic game head ---------- */
.stage { animation: fadeIn 0.25s ease; }
.game-head, .quiz-head {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  margin-bottom: 18px;
}
.head-title { font-weight: 800; font-size: 1.1rem; }
.moves { color: var(--ink-soft); font-weight: 700; }

/* ---------- speaker button ---------- */
.speaker-btn {
  background: #eef6fc; border: 1px solid #d4e8f7; color: var(--accent);
  border-radius: 10px; width: 40px; height: 40px; font-size: 1.05rem;
  vertical-align: middle;
}
.speaker-btn:hover { background: var(--accent); color: #fff; }

/* ---------- buttons ---------- */
/* Chunky "pushable" buttons — they sink when pressed (Duolingo-style). */
.btn {
  border: 0; background: #fff; color: var(--ink); font-family: inherit;
  padding: 12px 20px; border-radius: 14px; font-weight: 800; font-size: 1rem;
  box-shadow: 0 5px 0 var(--line-deep), inset 0 0 0 2px var(--line);
  transition: transform 0.06s ease, box-shadow 0.06s ease, filter 0.12s;
}
.btn:hover { filter: brightness(1.03); }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--line-deep), inset 0 0 0 2px var(--line); }
.btn.primary { background: var(--grad); color: #fff; box-shadow: 0 6px 0 var(--skb-lip); }
.btn.primary:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--skb-lip); }
.btn.ghost { background: #fff; color: var(--accent); box-shadow: inset 0 0 0 2px var(--line); }
.btn.ghost:hover { box-shadow: inset 0 0 0 2px var(--accent); }
.btn.ghost:active { transform: none; box-shadow: inset 0 0 0 2px var(--accent); }

/* ---------- result card ---------- */
.result-card {
  text-align: center; background: var(--card); border: 1px solid var(--line);
  border-radius: 22px; padding: 40px 24px; box-shadow: var(--shadow-lg);
  max-width: 520px; margin: 30px auto; animation: pop 0.35s ease;
}
.result-card.inline { margin: 20px auto 0; padding: 26px 20px; }
.result-emoji { font-size: 3.6rem; }
.result-card h2 { margin: 8px 0; font-size: 1.6rem; }
.result-score { color: var(--ink-soft); font-size: 1.15rem; }
.result-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 20px; }

/* =====================================================================
   QUIZ
   ===================================================================== */
.quiz-progress { font-weight: 800; }
.quiz-streak { color: var(--bad); font-weight: 800; min-height: 1.2em; }
.timer-bar { height: 10px; background: #e9eef7; border-radius: 999px; overflow: hidden; margin-bottom: 20px; }
.timer-fill { height: 100%; width: 100%; background: linear-gradient(90deg, var(--good), var(--brand), var(--bad)); transition: width 0.06s linear; }
.quiz-question { text-align: center; margin-bottom: 22px; }
.quiz-lang-tag { color: var(--ink-soft); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; font-size: 0.8rem; }
.quiz-word { font-size: clamp(1.8rem, 5vw, 3rem); font-weight: 900; margin: 6px 0; }
.quiz-emoji { font-size: 3rem; }
.quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.quiz-opt {
  display: flex; align-items: center; gap: 12px; text-align: left;
  background: var(--card); border: 2px solid var(--line); border-radius: 16px;
  padding: 18px 20px; font-size: clamp(1rem, 2.2vw, 1.35rem); font-weight: 700;
  box-shadow: var(--shadow); transition: transform 0.12s, border-color 0.12s;
  animation: rise 0.3s backwards; animation-delay: calc(var(--i) * 0.05s);
}
.quiz-opt:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--accent); }
.quiz-opt:disabled { cursor: default; }
.opt-shape { font-size: 1.2rem; }
.quiz-opt.correct { border-color: var(--good); background: #eafaf7; }
.quiz-opt.wrong { border-color: var(--bad); background: #ffeef0; }
/* Audio MCQ options (phone + solo): playing and choosing are SEPARATE
   controls, so a student can replay an option any number of times before
   committing. ✓ Choose unlocks after the first listen. */
.live-opt.split, .quiz-opt.split { cursor: default; gap: 10px; }
.live-opt.split:active { transform: none; box-shadow: 0 6px 0 var(--lip); }
.quiz-opt.split:active { transform: none; }
.mcq-audio-play, .mcq-audio-choose {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  border: 2px solid rgba(255, 255, 255, 0.55); background: rgba(255, 255, 255, 0.14);
  color: #fff; border-radius: 12px; font-weight: 800; font-size: 1rem;
  padding: 12px 10px; min-height: 52px;
}
.mcq-audio-play { flex: 1.25; }
.mcq-audio-play .match-slabel { flex: 0 0 auto; text-align: center; font-size: 0.95rem; }
.mcq-audio-choose { flex: 1; }
.mcq-audio-play:not(:disabled):active, .mcq-audio-choose:not(:disabled):active { background: rgba(255, 255, 255, 0.34); }
.mcq-audio-choose:disabled { opacity: 0.6; border-style: dashed; font-weight: 700; font-size: 0.85rem; }
/* Solo quiz — typed question media + typed option tiles */
.quiz-audio { margin: 14px 0; }
.quiz-media { display: flex; justify-content: center; margin: 8px 0 14px; }
.quiz-opt .match-mtext { flex: 1; text-align: left; }
.quiz-opt .match-memoji { flex: 0 0 auto; }
.quiz-opt .match-icon-big { flex: 1; text-align: center; font-size: 2rem; line-height: 1; }
.quiz-opt .match-img { flex: 1; min-width: 0; max-height: 80px; object-fit: contain; border-radius: 8px; }
.quiz-opt .match-ico { flex: 0 0 auto; font-size: 1.5rem; }
.quiz-opt .match-slabel { flex: 1; text-align: left; color: var(--ink-soft); font-weight: 700; }

/* =====================================================================
   SOLO wrappers for the Live games (reuse the Live adapter UI)
   ===================================================================== */
.solo-live { max-width: 580px; margin: 0 auto; }
.solo-live-card { text-align: center; margin-top: 6px; }
/* the reused Live prompt/answer blocks sit comfortably in the narrower Solo column */
.solo-live-card .live-q-word { margin: 6px 0 14px; }
.solo-live-card .cases-sentence.phone { margin-top: 6px; }
.solo-live-card .listen-audio { margin: 8px 0 18px; }
/* ring the correct tap-option on reveal (options keep their own colour) */
.solo-live .live-opt.phone.correct { outline: 4px solid var(--good); outline-offset: 2px; }
.solo-live .match-board { margin-top: 6px; }
/* feedback strip shown after each answer */
.solo-reveal {
  display: flex; align-items: center; gap: 14px; text-align: left;
  max-width: 460px; margin: 16px auto 0; padding: 14px 18px;
  border-radius: 16px; border: 2px solid var(--line); background: var(--card);
  box-shadow: var(--shadow); animation: rise 0.25s backwards;
}
.solo-reveal.good { border-color: var(--good); background: #eafaf7; }
.solo-reveal.bad { border-color: var(--bad); background: #ffeef0; }
.solo-reveal-icon {
  flex: 0 0 auto; width: 40px; height: 40px; border-radius: 50%;
  display: grid; place-items: center; font-size: 1.3rem; font-weight: 900; color: #fff;
}
.solo-reveal.good .solo-reveal-icon { background: var(--good); }
.solo-reveal.bad .solo-reveal-icon { background: var(--bad); }
.solo-reveal-title { font-weight: 800; }
.solo-reveal-ans { color: var(--ink-soft); font-weight: 600; font-size: 0.95rem; overflow-wrap: anywhere; }

/* =====================================================================
   MEMORY
   ===================================================================== */
.memory-board { display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: 12px; max-width: 720px; margin: 0 auto; }
.mem-card { background: none; border: 0; padding: 0; perspective: 800px; aspect-ratio: 3 / 4; }
.mem-inner { position: relative; width: 100%; height: 100%; transition: transform 0.45s; transform-style: preserve-3d; }
.mem-card.flipped .mem-inner, .mem-card.done .mem-inner { transform: rotateY(180deg); }
.mem-front, .mem-back {
  position: absolute; inset: 0; backface-visibility: hidden;
  border-radius: 14px; display: flex; align-items: center; justify-content: center;
  padding: 8px; text-align: center; box-shadow: var(--shadow);
}
.mem-front { background: var(--skb-tint); color: var(--ink); font-size: 2rem; border: 2px solid #d7dcff; }
.mem-logo { width: 56%; height: auto; }
.mem-back {
  transform: rotateY(180deg); background: var(--card); border: 2px solid var(--line);
  font-weight: 800; font-size: clamp(0.85rem, 2vw, 1.15rem); word-break: break-word;
}
.mem-back.de { color: var(--accent); }
.mem-back.en { color: var(--ink); }
.mem-card.done .mem-back { border-color: var(--good); background: #eafaf7; box-shadow: 0 0 0 3px rgba(46,196,182,0.25); }
.mem-card:not(.done):not(.flipped):hover .mem-front { transform: translateY(-3px); }

/* =====================================================================
   HANGMAN
   ===================================================================== */
.hangman { text-align: center; }
.hang-face { font-size: 4.5rem; line-height: 1; margin: 6px 0; }
.hang-hint { color: var(--ink-soft); font-weight: 700; font-size: 1.15rem; margin-bottom: 16px; }
.hang-word { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 24px; }
.hang-slot {
  width: 40px; height: 52px; border-bottom: 4px solid var(--accent);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 1.8rem; font-weight: 900;
}
.hang-slot.filled { animation: pop 0.25s ease; }
.hang-space { width: 22px; color: var(--ink-soft); align-self: flex-end; }
.keyboard { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 640px; margin: 0 auto; }
.key {
  width: 46px; height: 52px; border-radius: 10px; border: 1px solid var(--line);
  background: #fff; font-weight: 800; font-size: 1.1rem; box-shadow: var(--shadow);
  transition: transform 0.1s;
}
.key:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--accent); }
.key.right { background: #eafaf7; border-color: var(--good); color: var(--good); }
.key.miss { background: #ffeef0; border-color: var(--bad); color: var(--bad); opacity: 0.7; }

/* =====================================================================
   SCRAMBLE
   ===================================================================== */
.scramble { text-align: center; }
.scr-hint { color: var(--ink-soft); font-style: italic; font-size: 1.2rem; margin-bottom: 18px; }
.scr-answer {
  min-height: 64px; border: 2px dashed var(--line); border-radius: 14px;
  padding: 12px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center;
  background: #fbfcfe; margin-bottom: 18px;
}
.scr-answer.ok { border-color: var(--good); background: #eafaf7; }
.scr-answer.shake { animation: shake 0.4s; border-color: var(--bad); }
.scr-bank { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 18px; }
.scr-word {
  background: #fff; border: 2px solid var(--line); border-radius: 12px;
  padding: 12px 16px; font-size: clamp(1rem, 2.2vw, 1.3rem); font-weight: 800;
  box-shadow: var(--shadow); transition: transform 0.1s;
  animation: rise 0.3s backwards; animation-delay: calc(var(--i) * 0.04s);
}
.scr-word:hover:not(.used) { transform: translateY(-2px); border-color: var(--accent); }
.scr-word.used { opacity: 0.25; cursor: default; }
.scr-word.chosen { border-color: var(--accent); background: #eef6fc; color: var(--accent); }
.scr-actions { display: flex; gap: 10px; justify-content: center; }

/* =====================================================================
   ADMIN  (Inhalte verwalten)
   ===================================================================== */
.admin { animation: fadeIn 0.25s ease; }
.adm-head { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
.adm-title { margin: 0; font-size: clamp(1.3rem, 3vw, 1.8rem); flex: 1 1 auto; }
.adm-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn.small { padding: 8px 12px; font-size: 0.9rem; border-radius: 10px; }
.adm-sync {
  display: inline-flex; align-items: center; font-size: 0.8rem; font-weight: 800;
  padding: 7px 11px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap;
}
.adm-sync.ok { color: #1a7f37; background: #eafaf0; border-color: #bce8cd; }
.adm-sync.busy { color: #8a6d00; background: #fff7e0; border-color: #f0e0a0; }
.adm-sync.off { color: var(--ink-soft); background: #f2f4f8; }
.adm-remote-banner {
  display: flex; align-items: center; gap: 12px; justify-content: center;
  background: #fff3cf; border: 1px solid #f0d98a; color: var(--brand-ink);
  padding: 10px 14px; border-radius: 12px; margin-bottom: 12px; font-weight: 700;
}
.adm-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
.adm-tab {
  background: #fff; border: 1px solid var(--line); border-radius: 999px;
  padding: 9px 18px; font-weight: 800; color: var(--ink-soft); box-shadow: var(--shadow);
}
.adm-tab.active { background: var(--skb); border-color: var(--skb); color: #fff; }
.adm-hint {
  background: var(--skb-tint); border: 1px solid #dbe0ff; color: #3a4488;
  padding: 12px 16px; border-radius: 12px; font-size: 0.92rem; margin: 0 0 18px;
}
.adm-add { margin-bottom: 16px; }
.adm-empty { color: var(--ink-soft); text-align: center; padding: 20px; }

/* mode tabs (Content bank / Games) sit above everything else */
.adm-modes { margin-bottom: 16px; }
.adm-modes .adm-tab { font-size: 1rem; padding: 10px 20px; }

/* game chooser grid */
.adm-game-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); margin-bottom: 8px; }
.adm-game-card {
  position: relative; text-align: left; background: var(--card); border: 2px solid var(--line);
  border-radius: 16px; padding: 18px; box-shadow: 0 6px 0 var(--line-deep);
  transition: transform 0.1s, box-shadow 0.1s;
}
.adm-game-card:hover { transform: translateY(-2px); }
.adm-game-card:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--line-deep); }
.adm-game-badge {
  position: absolute; top: 10px; right: 10px;
  background: var(--skb-tint); color: var(--skb); font-size: 0.58rem; font-weight: 800;
  letter-spacing: 0.4px; text-transform: uppercase; padding: 4px 9px; border-radius: 999px;
}
.adm-game-emoji {
  display: inline-grid; place-items: center; width: 46px; height: 46px; border-radius: 13px; font-size: 1.5rem;
  background: var(--skb-tint);
  background: color-mix(in srgb, var(--accent) 15%, #fff);
}
.adm-game-name { font-weight: 800; margin-top: 8px; }
.adm-game-meta { color: var(--skb); font-weight: 800; font-size: 0.85rem; margin-top: 4px; }

/* exercise list (per Live game) */
.adm-ex-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
.adm-ex-card { display: flex; gap: 8px; align-items: stretch; }
.adm-ex-main {
  flex: 1; text-align: left; background: var(--card); border: 1px solid var(--line);
  border-radius: 14px; padding: 14px 18px; box-shadow: var(--shadow);
  display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
}
.adm-ex-main:hover { border-color: var(--accent); }
.adm-ex-name { font-weight: 800; }
.adm-ex-count { color: var(--ink-soft); font-size: 0.85rem; }
.adm-ex-actions { display: flex; gap: 6px; }
.adm-ex-btn {
  width: 46px; background: #fff; border: 1px solid var(--line);
  border-radius: 12px; font-size: 1rem; cursor: pointer;
}
.adm-ex-btn:hover { border-color: var(--accent); }
.adm-ex-btn.danger:hover { border-color: #e5484d; color: #e5484d; }
/* emoji + description row atop a words/sentences exercise editor */
.adm-ex-head { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.adm-ex-head .adm-input { flex: 1; max-width: 360px; }
/* exercise-list action buttons (New / Copy from another game) */
.adm-ex-bar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }

/* "Copy from another game" modal */
.adm-overlay {
  position: fixed; inset: 0; z-index: 1000; padding: 16px;
  background: rgba(15, 23, 42, 0.5);
  display: flex; align-items: center; justify-content: center;
}
.adm-modal {
  background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  padding: 20px; width: 100%; max-width: 460px; max-height: 80vh; overflow-y: auto;
  box-shadow: var(--shadow-lg);
}
.adm-modal-title { font-weight: 800; font-size: 1.1rem; margin-bottom: 6px; }
.adm-modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }

/* "Leave the game?" confirm (browser Back / in-game Back) */
.leave-overlay {
  position: fixed; inset: 0; z-index: 1200; padding: 18px;
  background: rgba(15, 23, 42, 0.55);
  display: flex; align-items: center; justify-content: center;
}
.leave-card {
  background: var(--card); border-radius: 20px; padding: 26px 24px; width: 100%; max-width: 380px;
  text-align: center; box-shadow: var(--shadow-lg); animation: rise 0.2s backwards;
}
.leave-emoji { font-size: 2.6rem; line-height: 1; }
.leave-title { margin: 10px 0 4px; font-size: 1.3rem; font-weight: 900; }
.leave-msg { color: var(--ink-soft); font-weight: 600; margin: 0 0 4px; }
.leave-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
.leave-actions .btn { width: 100%; }
/* Reset is dangerous — keep it visually quiet (muted, no border) until hover. */
.adm-reset { opacity: 0.55; color: var(--ink-soft); box-shadow: none; }
.adm-reset:hover { opacity: 1; color: #fff; background: var(--bad); border-color: var(--bad); }
/* Destructive confirm button — red, and clearly disabled until "RESET" is typed. */
.btn.danger { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.danger:hover:not(:disabled) { filter: brightness(0.95); }
.btn.danger:disabled { opacity: 0.45; cursor: not-allowed; }
.adm-copy-list { display: flex; flex-direction: column; gap: 6px; margin: 12px 0; }
.adm-copy-group {
  font-weight: 800; color: var(--ink-soft); font-size: 0.78rem;
  text-transform: uppercase; letter-spacing: 0.4px; margin-top: 8px;
}
.adm-copy-row {
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  text-align: left; background: #fff; border: 1px solid var(--line);
  border-radius: 12px; padding: 10px 14px; cursor: pointer;
}
.adm-copy-row:hover { border-color: var(--skb); }
.adm-copy-count { color: var(--ink-soft); font-size: 0.82rem; white-space: nowrap; }
.adm-copy-cancel { margin-top: 6px; }

.adm-subhead { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.adm-game-title { margin: 0; font-size: 1.2rem; }

/* include checkbox on a topic in the game view */
.adm-include { display: inline-flex; align-items: center; }
.adm-check { width: 22px; height: 22px; accent-color: var(--skb); cursor: pointer; }
.adm-topic.adm-off { opacity: 0.55; }
.adm-topic.adm-off .adm-count { color: var(--ink-soft); }

.adm-toggle {
  background: #fff; border: 1px solid var(--line); border-radius: 10px;
  padding: 7px 12px; font-weight: 800; color: var(--accent); white-space: nowrap;
}
.adm-toggle:hover { border-color: var(--accent); }
.adm-rows { margin-top: 12px; }

.picker-empty {
  max-width: 520px; margin: 20px auto; text-align: center; color: var(--ink-soft);
  background: var(--skb-tint); border: 1px solid #dbe0ff; border-radius: 12px; padding: 18px;
}

.adm-topic {
  background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow);
}
.adm-topic-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.adm-count { color: var(--accent); font-weight: 800; font-size: 0.85rem; white-space: nowrap; }

.adm-input {
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  font-size: 1rem; font-family: inherit; color: var(--ink); background: #fff; min-width: 0;
}
.adm-input:focus, .adm-emoji:focus { outline: 3px solid rgba(59, 77, 232, 0.25); border-color: var(--skb); }
.adm-input.grow { flex: 1 1 180px; }
.adm-topic-head .adm-input { flex: 1 1 140px; }
.adm-emoji {
  width: 58px; text-align: center; font-size: 1.3rem; border: 1px solid var(--line);
  border-radius: 10px; padding: 8px 4px; background: #fff; font-family: inherit;
}

.adm-row {
  display: grid; grid-template-columns: 58px 1fr 1fr 40px; gap: 8px;
  align-items: center; margin-bottom: 8px;
}
.adm-row-sent { grid-template-columns: 1fr 1fr 40px; }
.adm-row-vocab { grid-template-columns: 58px 1fr 1fr 1.15fr 40px; }
.adm-hint.tiny { font-size: 0.82rem; margin: 2px 0 8px; opacity: 0.92; }
.adm-row-head { font-size: 0.78rem; font-weight: 800; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
.adm-row-head .adm-emoji-h { text-align: center; }
.adm-del {
  width: 38px; height: 38px; border: 1px solid var(--line); background: #fff;
  border-radius: 10px; color: var(--bad); font-size: 1rem; font-weight: 800;
}
.adm-del:hover { background: #ffeef0; border-color: var(--bad); }
.adm-add-row { margin-top: 6px; }

/* Fall-Detektiv (cases) editor */
.adm-case-h { margin: 18px 0 8px; font-size: 1rem; font-weight: 800; color: var(--ink); }
.adm-case {
  border: 1px solid var(--line); border-radius: 12px; padding: 10px;
  margin-bottom: 8px; background: #fff;
}
.adm-case-line { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.adm-case-line:last-child { margin-bottom: 0; }
.adm-case-line > .adm-input { flex: 1 1 140px; }
.adm-case-line > .adm-article { flex: 0 0 78px; text-align: center; font-weight: 800; }
.adm-case-line > .adm-ta { flex: 1 1 100%; }
/* Per-blank answer fields (one row, wraps on small screens) */
.adm-case-blanks { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 2px 0 10px; }
.adm-blank-field { display: inline-flex; align-items: center; gap: 6px; background: #f4f7ff; border: 1px solid var(--line); border-radius: 9px; padding: 4px 8px; }
.adm-blank-num { font-size: 0.72rem; font-weight: 800; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.4px; white-space: nowrap; }
.adm-blank-field > .adm-article { flex: 0 0 90px; }
.adm-blank-hint { color: var(--ink-soft); font-size: 0.85rem; font-style: italic; }
/* Short label in front of a full-width field (word bank / explanation) */
.adm-field-lbl { flex: 0 0 72px; font-size: 0.72rem; font-weight: 800; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.4px; }
.adm-case-line > .adm-input { min-width: 0; }

/* Wortmonster (compounds) editor */
.adm-compound-row {
  display: grid; grid-template-columns: 58px 1fr 1fr 1.1fr 82px 1.2fr 40px;
  gap: 8px; align-items: center; margin-bottom: 8px;
}
.adm-compound-word {
  font-weight: 800; color: var(--skb); text-align: center;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.adm-gender { cursor: pointer; }
/* Plural-Palast editor */
.adm-plural-row { grid-template-columns: 58px 1.2fr 0.85fr 1fr 1.3fr 40px; }
/* Hör gut zu! editor — stacked rows so a single word OR a whole sentence fits */
.adm-listen-item { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; background: #fff; }
.adm-listen-line { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 8px; }
.adm-listen-line:last-child { margin-bottom: 0; }
.adm-listen-lbl { flex: 0 0 74px; padding-top: 9px; font-weight: 700; color: var(--ink-soft); font-size: 0.8rem; }
.adm-listen-line > .adm-input { flex: 1; }
.adm-ta {
  flex: 1; width: 100%; border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font: inherit; font-size: 0.98rem; line-height: 1.4;
  resize: vertical; min-height: 40px; overflow: hidden;
}
.adm-ta:focus { outline: 2px solid var(--skb); outline-offset: -1px; }
@media (max-width: 560px) { .adm-listen-lbl { flex-basis: 60px; } }
/* Konjugations-Karussell editor */
.adm-verb { border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 8px; background: #fff; }
.adm-verb .adm-case-line > .adm-input:first-child { flex: 0 0 40%; }
.adm-verb-forms { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; margin-top: 8px; }
.adm-verb-field { display: flex; flex-direction: column; gap: 3px; }
.adm-verb-lbl { font-size: 0.72rem; font-weight: 800; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.4px; }
/* Hör-Paare editor — each "question" is one matching round of ≥3 word rows */
.adm-pairs-q { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 12px; background: #fff; }
.adm-pairs-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.adm-pairs-title { margin: 0; font-size: 1rem; font-weight: 800; color: var(--ink); }
.adm-pairs-count { font-size: 0.82rem; font-weight: 700; color: var(--good); }
.adm-pairs-count.warn { color: var(--bad); }
.adm-pairs-head .adm-del { margin-left: auto; }

/* One cohesive card per authored question (MCQ / True-False / Scramble /
   Hangman / Passage question). Everything for that question — its header, the
   question block and the options — sits inside a single tinted, rounded card so
   it reads as one unit instead of loose floating boxes. */
.adm-cpair { background: var(--skb-tint); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px 16px; margin: 14px 0; box-shadow: var(--shadow); }
.adm-cpair-topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.adm-cpair-n { font-weight: 800; font-size: 1.02rem; color: var(--ink); }
.adm-cpair-topbar .adm-del { margin-left: auto; }

/* Match the Following — custom-pair authoring (per-question types + entries) */
.adm-cpair-sep { margin: 14px 0 8px; font-size: 0.78rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-soft); border-top: 1px dashed var(--line); padding-top: 10px; }
.adm-custom { background: #f7f9ff; border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
.adm-custom-types { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 12px; }
.adm-typepick { flex: 1 1 220px; }
.adm-side-lbl { font-size: 0.7rem; font-weight: 800; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 4px; }
/* 4-chip type picker */
.adm-typechips { display: flex; gap: 4px; }
.adm-typechip { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 5px 2px; border: 1.5px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer; }
.adm-typechip .adm-typechip-ic { font-size: 1rem; line-height: 1; }
.adm-typechip .adm-typechip-lbl { font-size: 0.64rem; font-weight: 700; color: var(--ink-soft); }
.adm-typechip.sel { border-color: var(--skb); background: var(--skb-tint); }
.adm-typechip.sel .adm-typechip-lbl { color: var(--skb-dark); }
/* entry rows */
.adm-entries { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.adm-entry { display: flex; align-items: center; gap: 6px; }
.adm-entry-n { flex: 0 0 auto; width: 18px; text-align: right; font-size: 0.78rem; font-weight: 800; color: var(--ink-soft); }
.adm-entry-side { flex: 1 1 0; min-width: 0; }
.adm-entry-mid { flex: 0 0 auto; color: var(--ink-soft); font-size: 1rem; }
.adm-entry-side .adm-input { width: 100%; }
.adm-side-row { display: flex; gap: 6px; align-items: center; }
.adm-side-row .adm-input { flex: 1 1 auto; min-width: 0; }
.adm-audio-prev { flex: 0 0 auto; }
.adm-img-prev { display: block; max-width: 100%; border-radius: 8px; border: 1px solid var(--line); object-fit: contain; }
.adm-img-prev.sm { flex: 0 0 auto; width: 40px; height: 40px; }
.adm-icon-btn { width: 100%; min-height: 40px; padding: 6px 10px; border: 1.5px solid var(--line); border-radius: 8px; background: #fff; font-size: 1.3rem; line-height: 1.1; cursor: pointer; }
/* icon picker modal */
.adm-modal-overlay { position: fixed; inset: 0; background: rgba(11, 21, 51, 0.45); display: flex; align-items: center; justify-content: center; z-index: 60; padding: 16px; }
.adm-modal-card { background: #fff; border-radius: 14px; padding: 16px; width: min(460px, 96vw); max-height: 82vh; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 18px 50px rgba(11, 21, 51, 0.3); }
.adm-modal-title { font-weight: 800; font-size: 1.05rem; color: var(--ink); }
.adm-icon-grid { display: flex; flex-wrap: wrap; gap: 2px; overflow-y: auto; }
.adm-icon-grid.big { max-height: 48vh; }
.adm-icon-opt { font-size: 1.35rem; line-height: 1; padding: 4px; border: 1.5px solid transparent; border-radius: 7px; background: none; cursor: pointer; }
.adm-icon-opt:hover { background: var(--skb-tint); }
.adm-icon-opt.sel { border-color: var(--skb); background: var(--skb-tint); }
.adm-modal-cancel { align-self: flex-end; }

/* MCQ authoring (Vocabulary Quiz — picture/audio/icon questions) */
.adm-mcq-q { margin-bottom: 10px; }
.adm-mcq-field { margin-top: 6px; }
.adm-mcq-field .adm-input { width: 100%; }
.adm-mcq-options { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.adm-mcq-opt { display: flex; align-items: center; gap: 8px; }
.adm-mcq-opt .adm-mcq-field { flex: 1 1 0; min-width: 0; margin-top: 0; }
.adm-mcq-radio { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); background: #fff; cursor: pointer; font-weight: 900; color: var(--good); line-height: 1; }
.adm-mcq-radio.sel { border-color: var(--good); background: #eafaf7; }

/* Auto-translate (German → English) — button, AI-draft marker, bulk bar */
.adm-en-cell { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
.adm-en-cell > input { flex: 1 1 60px; min-width: 0; }
.adm-tr-btn {
  flex: 0 0 auto; width: 34px; height: 34px; border: 1px solid var(--line);
  background: #fff; border-radius: 9px; cursor: pointer; font-size: 0.95rem; line-height: 1;
}
.adm-tr-btn:hover:not(:disabled) { border-color: var(--skb); background: var(--skb-tint); }
.adm-tr-btn:disabled { opacity: 0.5; cursor: default; }
.adm-tr-btn.loading { animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
/* an unconfirmed AI suggestion: dashed amber, distinct from saved (solid) fields */
input.ai-draft { border-style: dashed; border-color: #c8961a; background: #fffbf0; }
.adm-ai-badge { flex: 1 1 100%; display: inline-flex; align-items: center; gap: 6px; font-size: 0.72rem; font-weight: 800; color: #9a7400; }
.adm-ai-ok {
  width: 20px; height: 20px; border: 1px solid #e0c477; background: #fff;
  border-radius: 6px; color: var(--good); font-weight: 900; line-height: 1; cursor: pointer;
}
.adm-ai-ok:hover { background: #eafaf7; border-color: var(--good); }
.adm-bulk-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 4px 0 12px; }
.adm-bulk-tr { white-space: nowrap; }
.adm-bulk-note { color: var(--ink-soft); font-size: 0.82rem; font-weight: 600; }
@media (max-width: 560px) {
  .adm-compound-row { display: flex; flex-wrap: wrap; }
  .adm-compound-row > .adm-input, .adm-compound-row > .adm-gender { flex: 1 1 40%; }
  .adm-compound-word { flex: 1 1 100%; text-align: left; }
  .adm-plural-row { display: flex; flex-wrap: wrap; }
  .adm-plural-row > .adm-input { flex: 1 1 42%; }
}

.adm-toast {
  position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px);
  background: var(--ink); color: #fff; padding: 12px 22px; border-radius: 999px;
  font-weight: 700; box-shadow: var(--shadow-lg); z-index: 60; opacity: 0;
  transition: opacity 0.25s, transform 0.25s;
}
.adm-toast.show { opacity: 1; transform: translate(-50%, 0); }

.foot-admin {
  background: #fff; border: 1px solid var(--line); border-radius: 999px;
  padding: 9px 18px; font-weight: 800; color: var(--accent); box-shadow: var(--shadow);
  margin-bottom: 12px;
}
.foot-admin:hover { border-color: var(--accent); transform: translateY(-1px); }
.foot-note { color: var(--ink-soft); font-size: 0.9rem; }

@media (max-width: 560px) {
  .adm-row { grid-template-columns: 48px 1fr 40px; }
  .adm-row > .adm-input:nth-child(3) { grid-column: 2 / 4; }
  .adm-row-head { display: none; }
  .adm-row-vocab { display: flex; flex-wrap: wrap; }
  .adm-row-vocab > .adm-input { flex: 1 1 42%; }
}

/* =====================================================================
   MODE SELECT (Solo vs Live)
   ===================================================================== */
.screen-back { margin-bottom: 4px; }
.mode-grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); max-width: 760px; margin: 10px auto; }
.mode-card {
  position: relative; text-align: left; color: #fff; border: 0; border-radius: 22px; padding: 28px;
  background: var(--grad); box-shadow: 0 10px 0 var(--skb-lip); overflow: hidden;
  transition: transform 0.08s, box-shadow 0.08s, filter 0.12s;
}
.mode-card.live { background: linear-gradient(140deg, #3D5AFF, #7A2BFF); box-shadow: 0 10px 0 #4A17B0; }
.mode-card::after {
  content: ""; position: absolute; right: -22px; bottom: -28px; width: 128px; height: 128px;
  background: #fff; opacity: 0.14; pointer-events: none;
  clip-path: polygon(50% 0, 100% 38%, 50% 100%, 0 38%);
}
.mode-card:hover { filter: brightness(1.04); }
.mode-card:active { transform: translateY(6px); box-shadow: 0 4px 0 var(--skb-lip); }
.mode-card.live:active { box-shadow: 0 4px 0 #4A17B0; }
.mode-emoji { font-size: 3rem; position: relative; }
.mode-name { font-size: 1.5rem; font-weight: 900; margin: 10px 0 6px; color: #fff; position: relative; }
.mode-desc { color: #fff; opacity: 0.92; position: relative; }

/* =====================================================================
   LIVE CLASS MODE — shared
   ===================================================================== */
.live { animation: fadeIn 0.25s ease; }
.live-center { max-width: 640px; margin: 0 auto; text-align: center; }
.live-title { font-size: clamp(1.5rem, 4vw, 2.2rem); margin: 8px 0; text-align: center; }
.live-sub { color: var(--ink-soft); text-align: center; margin: 4px 0 18px; }
.live-muted { color: var(--ink-soft); text-align: center; padding: 14px; }
.live-label { font-weight: 800; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.5px; font-size: 0.8rem; margin: 18px 0 8px; display: block; }
.live-big-emoji { font-size: 3.4rem; line-height: 1; }
.live-card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 34px 24px; box-shadow: var(--shadow-lg); max-width: 480px; margin: 24px auto; }
.btn.big { font-size: 1.2rem; padding: 16px 28px; margin-top: 10px; }

/* landing: Host / Join */
.live-choice { display: grid; gap: 18px; grid-template-columns: 1fr 1fr; margin-top: 20px; }
.live-choice-card {
  background: var(--card); border: 2px solid var(--line); border-radius: 20px;
  padding: 30px 18px; box-shadow: 0 8px 0 var(--line-deep);
  transition: transform 0.08s, box-shadow 0.08s;
}
.live-choice-card:hover { transform: translateY(-3px); }
.live-choice-card:active { transform: translateY(4px); box-shadow: 0 4px 0 var(--line-deep); }
.live-choice-card .live-big-emoji {
  display: inline-grid; place-items: center; width: 68px; height: 68px; border-radius: 18px;
  background: var(--skb-tint); font-size: 2.4rem; margin: 0 auto 8px;
}
.live-choice-card.join .live-big-emoji { background: #FFEEDF; }
.live-choice-name { font-weight: 900; font-size: 1.3rem; margin-top: 6px; }
.live-choice-sub { color: var(--ink-soft); font-size: 0.9rem; margin-top: 4px; }

/* rosters */
.roster-toolbar { display: flex; gap: 10px; flex-wrap: wrap; }
.roster-list { display: flex; flex-direction: column; gap: 10px; margin: 14px 0 18px; }
.roster-row { display: flex; gap: 8px; }
.roster-main { flex: 1; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; box-shadow: var(--shadow); }
.roster-main:hover { border-color: var(--accent); }
.roster-name { font-weight: 800; }
.roster-count { color: var(--ink-soft); font-size: 0.85rem; }
.roster-edit { width: 52px; background: #fff; border: 1px solid var(--line); border-radius: 14px; font-size: 1.1rem; }
.roster-form { display: flex; flex-direction: column; gap: 8px; max-width: 520px; }
.roster-textarea { min-height: 200px; border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-size: 1rem; font-family: inherit; resize: vertical; }
.roster-actions { display: flex; gap: 10px; margin-top: 8px; }

/* host setup */
.setup-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
.setup-card { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 16px 10px; text-align: center; font-weight: 700; box-shadow: var(--shadow); }
.setup-card.sel { border-color: var(--skb); background: var(--skb-tint); }
.setup-emoji { font-size: 1.8rem; }
.setup-modes { display: flex; gap: 10px; flex-wrap: wrap; }
.mode-pill { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 12px 18px; box-shadow: var(--shadow); }
.mode-pill.sel { border-color: var(--skb); background: var(--skb-tint); }
.mode-pill span { color: var(--ink-soft); font-size: 0.82rem; font-weight: 600; }

/* host lobby / room code */
.live.host { max-width: 960px; margin: 0 auto; text-align: center; }
.roomcode-wrap { margin: 10px auto 6px; }
.roomcode-label { color: var(--ink-soft); font-weight: 700; }
.roomcode { font-size: clamp(3.5rem, 14vw, 8rem); font-weight: 900; letter-spacing: 0.12em; color: var(--skb); line-height: 1.1; }
.join-count { font-weight: 800; color: var(--ink-soft); margin-bottom: 12px; }
.join-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 22px; }
.join-chip { background: var(--skb-tint); border: 1px solid #dbe0ff; color: var(--skb-dark); border-radius: 999px; padding: 6px 14px; font-weight: 700; animation: pop 0.3s ease; }

/* host question */
.host-topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.host-q-num { font-weight: 800; font-size: 1.2rem; }
.host-answered { font-weight: 800; color: var(--accent); font-size: 1.2rem; }
.host-controls { margin-top: 18px; }
.live-q { text-align: center; }
.live-q-tag { color: var(--ink-soft); text-transform: uppercase; letter-spacing: 1px; font-weight: 800; font-size: 0.9rem; }
.live-q-word { font-size: clamp(2rem, 6vw, 4rem); font-weight: 900; margin: 8px 0; }
.live-q-en { color: var(--ink-soft); font-size: clamp(1rem, 2.4vw, 1.3rem); font-weight: 600; margin: -4px 0 10px; }
.clock-wrap { display: flex; justify-content: center; margin: 6px 0 16px; }
.clock-svg { width: min(42vh, 320px); height: auto; display: block; filter: drop-shadow(0 6px 16px rgba(42, 56, 196, 0.18)); }
.listen-audio { display: flex; flex-direction: column; align-items: center; gap: 14px; margin: 10px 0 20px; }
.listen-emoji { font-size: clamp(3rem, 10vw, 5.5rem); }
.listen-play[disabled] { opacity: 0.6; }
.listen-typing-note { margin: 6px 0; font-weight: 800; color: var(--skb-dark); font-size: clamp(1rem, 2.6vw, 1.5rem); }

/* Hör gut zu! — type mode diff: a normal sentence with the words coloured in place */
.diff-card { text-align: center; }
.diff-label { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-soft); margin: 14px 0 4px; }
.diff-line { line-height: 1.6; font-size: clamp(1.1rem, 2.8vw, 1.4rem); font-weight: 800; max-width: 92%; margin: 0 auto; overflow-wrap: anywhere; }
.diff-correct { color: var(--good); }
.diff-wrong { color: var(--bad); }
.diff-extra { color: var(--bad); text-decoration: line-through; }
.diff-line.ref { color: var(--ink); font-weight: 700; }
.diff-line.ref .diff-missing { color: var(--bad); text-decoration: underline dotted; text-underline-offset: 3px; }
.diff-score { color: var(--ink-soft); font-weight: 700; margin-top: 6px; }
.diff-wait { margin-top: 12px; }
.live-q-emoji { font-size: 3.5rem; margin-bottom: 10px; }
.live-q-options.board { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; }
/* Neutral, readable answer buttons — the colour + shape are just a position
   marker (matching the board), so they never clash with the answer text
   (e.g. the word "orange" on a red box in the colours topic). */
/* Full-colour, game-show answer tiles — colour marks position; the shape marker
   and the reveal keep them unambiguous even when the text names a colour. */
.live-opt {
  --lip: rgba(0, 0, 0, 0.20);
  display: flex; align-items: center; gap: 14px; border-radius: 16px; padding: 18px 20px;
  font-weight: 800; color: #fff; background: var(--c); border: 0;
  box-shadow: 0 6px 0 var(--lip); transition: transform 0.06s, box-shadow 0.06s;
}
.live-opt:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--lip); }
.live-opt .opt-shape { font-size: 1.3rem; color: #fff; opacity: 0.92; line-height: 1; flex: 0 0 auto; }
.live-opt.board { font-size: clamp(1.1rem, 2.4vw, 1.6rem); }
/* answers wrap for long text — options may be whole sentences (Hör gut zu!) */
.opt-text { flex: 1; overflow-wrap: anywhere; line-height: 1.3; }

/* General MCQ (was Vokabel-Quiz) — typed question media + typed option tiles */
.live-q-media { margin: 12px 0 4px; }
.mcq-q-img { max-width: min(60vh, 480px); max-height: 46vh; border-radius: 14px; box-shadow: 0 8px 24px rgba(11, 21, 51, 0.18); }
.mcq-q-icon { font-size: clamp(4rem, 16vw, 9rem); line-height: 1; }
.live-q-audio { margin: 14px 0; }
/* MatchTiles content rendered inside the coloured option tile */
.live-opt .match-mtext { flex: 1; text-align: left; font-size: inherit; overflow-wrap: anywhere; line-height: 1.3; color: #fff; }
.live-opt .match-memoji { flex: 0 0 auto; }
.live-opt .match-icon-big { flex: 1; text-align: center; font-size: 2.2rem; line-height: 1; }
.live-opt .match-img { flex: 1; min-width: 0; max-height: 84px; object-fit: contain; border-radius: 8px; background: rgba(255, 255, 255, 0.92); padding: 3px; }
.live-opt.board .match-img { max-height: 130px; }
.live-opt .match-ico { flex: 0 0 auto; font-size: 1.6rem; }
.live-opt .match-slabel { flex: 1; text-align: left; color: rgba(255, 255, 255, 0.92); font-weight: 700; font-size: 0.9rem; }
/* MCQ reveal — the winning option rendered by its type */
.reveal-value.mcq-reveal { display: flex; justify-content: center; align-items: center; gap: 8px; }
.reveal-value.mcq-reveal .match-img { max-height: 40vh; border-radius: 12px; }
.reveal-value.mcq-reveal .match-icon-big { font-size: 4rem; }
.mcq-result-answer { display: flex; flex-direction: column; align-items: center; gap: 6px; margin: 6px 0; }
.mcq-result-tile .match-img { max-height: 130px; border-radius: 10px; }
.mcq-result-tile .match-icon-big { font-size: 3rem; }
.reveal-value { overflow-wrap: anywhere; }

/* audio-speed preview row in the Live host setup */
.setup-preview { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 2px 0 6px; }

/* reveal */
.reveal-answer { background: #eafaf7; border: 2px solid var(--good); border-radius: 18px; padding: 22px; margin: 10px auto; max-width: 560px; }
.reveal-label { color: var(--ink-soft); font-weight: 800; text-transform: uppercase; letter-spacing: 1px; font-size: 0.85rem; }
.reveal-value { font-size: clamp(1.8rem, 5vw, 3rem); font-weight: 900; }
.reveal-emoji { font-size: 3rem; margin-top: 6px; }
.reveal-stat { font-weight: 800; color: var(--ink-soft); margin: 12px 0; }
.reveal-board-title { text-align: center; margin: 8px 0 6px; font-size: 1rem; color: var(--ink-soft); font-weight: 800; }

/* Fall-Detektiv (case detective) */
.cases-q { text-align: center; }
.cases-tag { color: var(--ink-soft); text-transform: uppercase; letter-spacing: 1px; font-weight: 800; font-size: 0.9rem; margin-bottom: 12px; }
.cases-sentence { font-size: clamp(1.6rem, 4.5vw, 3rem); font-weight: 800; line-height: 1.6; }
.cases-sentence.phone { font-size: 1.35rem; text-align: center; margin-bottom: 16px; line-height: 1.55; }
.cases-blank { display: inline-block; min-width: 2.4em; border-bottom: 4px solid var(--skb); vertical-align: bottom; color: transparent; }
.cases-clue { padding: 0 4px; border-radius: 5px; animation: clueGlow 0.4s ease 2.5s forwards; }
@keyframes clueGlow { to { background: #fff3a0; box-shadow: 0 0 0 3px #fff3a0; color: var(--ink); } }

/* ---- Lücken-Text (fill in the blank) ---- */
.lt-q { text-align: center; }
.lt-tag { color: var(--ink-soft); text-transform: uppercase; letter-spacing: 1px; font-weight: 800; font-size: 0.9rem; margin-bottom: 12px; }
.lt-sentence { line-height: 2; font-weight: 800; }
.lt-sentence.host { font-size: clamp(1.5rem, 4vw, 2.7rem); }
.lt-sentence.phone { font-size: 1.3rem; text-align: center; margin-bottom: 16px; }
.lt-sentence .lt-txt { white-space: pre-wrap; }
.lt-gap { display: inline-block; min-width: 2.2em; border-bottom: 4px solid var(--skb); color: transparent; vertical-align: bottom; margin: 0 2px; }
.lt-hostnote { margin-top: 18px; color: var(--ink-soft); font-weight: 700; font-size: 1.05rem; }
.lt-player { text-align: center; }
/* Tap-mode gap: a pill you can tap to empty. Filled shows the chosen word. */
.lt-slot { display: inline-block; min-width: 2.6em; margin: 0 3px; padding: 2px 10px; border-radius: 8px; border: 2px dashed var(--skb); background: #fff; font: inherit; font-weight: 900; color: var(--skb-dark); cursor: pointer; vertical-align: baseline; }
.lt-slot.empty { color: var(--skb); letter-spacing: -2px; }
.lt-slot.filled { border-style: solid; background: #eef6fc; }
.lt-slot.filled:hover { border-color: var(--bad); }
/* Type-mode gap: an inline input sized to fit the sentence flow. */
.lt-input { display: inline-block; width: 4.5em; margin: 0 3px; padding: 2px 6px; border: 2px solid var(--line); border-bottom: 3px solid var(--skb); border-radius: 8px; font: inherit; font-weight: 800; text-align: center; color: var(--ink); background: #fff; }
.lt-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,77,232,0.15); }
.lt-typehint { color: var(--ink-soft); font-weight: 600; font-size: 0.9rem; margin: 4px 0 14px; }
.lt-bank { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 4px 0 18px; }
.lt-word { padding: 10px 16px; border-radius: 12px; border: 2px solid var(--line); background: #fff; font: inherit; font-weight: 800; font-size: 1.05rem; color: var(--ink); cursor: pointer; transition: transform 0.08s, border-color 0.12s; }
.lt-word:hover:not(.used) { transform: translateY(-2px); border-color: var(--accent); }
.lt-word.used { opacity: 0.25; cursor: default; }
.lt-submit { width: 100%; max-width: 320px; }
/* Reveal: the student's filled sentence, coloured per blank, + corrections. */
.diff-line.lt-reveal { margin-bottom: 6px; }
.lt-corrections { display: flex; flex-direction: column; gap: 4px; margin: 8px 0 2px; }
.lt-correction { color: var(--good); font-weight: 800; }
.reveal-sentence.lt { text-align: center; }
.reveal-sentence { font-size: clamp(1.15rem, 2.6vw, 1.7rem); font-weight: 700; color: var(--ink); margin-top: 12px; line-height: 1.5; }
.rs-fill { background: var(--skb); color: #fff; padding: 1px 8px; border-radius: 6px; font-weight: 900; }
.reveal-why { margin-top: 10px; color: var(--skb-dark); font-weight: 700; font-style: italic; }
.player-why { color: var(--ink-soft); font-weight: 600; font-size: 0.95rem; margin: 4px 0 0; }
.setup-sub { font-size: 0.78rem; color: var(--ink-soft); margin-top: 2px; }
.type-row { display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
.type-input {
  font-size: 1.8rem; font-weight: 800; text-align: center; padding: 16px;
  border: 2px solid var(--line); border-radius: 14px; width: 100%;
}
.type-input:focus { outline: 3px solid rgba(59, 77, 232, 0.25); border-color: var(--skb); }
.type-go { font-size: 1.15rem; }

/* Wortmonster (compound words) */
.wm-host { text-align: center; }
.wm-emoji.big { font-size: 5rem; line-height: 1; }
.wm-meaning.big { font-size: clamp(1.6rem, 4vw, 2.6rem); font-weight: 900; margin-top: 6px; }
.wm-player { text-align: center; }
.wm-target { display: flex; flex-direction: column; align-items: center; gap: 2px; margin-bottom: 6px; }
.wm-target .wm-emoji { font-size: 2.6rem; }
.wm-target .wm-meaning { font-weight: 800; font-size: 1.2rem; }
.wm-hint { color: var(--ink-soft); font-weight: 700; margin-bottom: 10px; }
.wm-answer {
  min-height: 58px; border: 2px dashed var(--line); border-radius: 14px; background: #fbfcfe;
  display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; padding: 10px; margin-bottom: 12px;
}
.wm-bank { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 14px; }
.wm-tile {
  background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 12px 16px;
  font-size: 1.2rem; font-weight: 800; box-shadow: var(--shadow);
}
.wm-tile:hover:not(.used) { border-color: var(--skb); transform: translateY(-2px); }
.wm-tile.used { opacity: 0.3; }
.wm-tile.chosen { border-color: var(--skb); background: var(--skb-tint); color: var(--skb-dark); }
.wm-submit { width: 100%; }
.reveal-fast { max-width: 460px; margin: 0 auto 18px; display: flex; flex-direction: column; gap: 8px; }
.reveal-fast-row { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; box-shadow: var(--shadow); }
.rf-rank { font-weight: 900; color: var(--accent); }
.rf-name { flex: 1; text-align: left; font-weight: 700; }
.rf-pts { font-weight: 900; color: var(--good); }

/* leaderboard */
.board-list { max-width: 560px; margin: 10px auto 20px; display: flex; flex-direction: column; gap: 8px; }
.board-row { display: flex; align-items: center; gap: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 18px; box-shadow: var(--shadow); }
.board-row.top { border-color: var(--brand); background: #fff9e9; }
.board-rank {
  display: grid; place-items: center; flex: 0 0 auto; width: 30px; height: 34px;
  color: #fff; font-weight: 900; font-size: 0.95rem; background: var(--grad);
  clip-path: polygon(50% 0, 100% 38%, 50% 100%, 0 38%);
}
.board-name { flex: 1; text-align: left; font-weight: 700; font-size: 1.1rem; }
.board-pts { font-weight: 900; font-variant-numeric: tabular-nums; }

/* podium */
.podium { display: flex; justify-content: center; align-items: flex-end; gap: 14px; margin: 20px 0; }
.podium-col { display: flex; flex-direction: column; align-items: center; }
.podium-medal { font-size: 2.4rem; }
.podium-name { font-weight: 800; }
.podium-pts { color: var(--ink-soft); font-weight: 700; }
.podium-block { width: 92px; border-radius: 12px 12px 0 0; color: #fff; font-weight: 900; font-size: 1.6rem; display: flex; align-items: flex-start; justify-content: center; padding-top: 10px; }
.podium-col.p1 .podium-block { height: 150px; background: linear-gradient(180deg, #ffd166, #f0b400); }
.podium-col.p2 .podium-block { height: 110px; background: linear-gradient(180deg, #cfd6e6, #9fb0c9); }
.podium-col.p3 .podium-block { height: 80px; background: linear-gradient(180deg, #e6b98f, #cd9b6a); }
.podium-actions { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 8px; }

/* =====================================================================
   PLAYER (phone)
   ===================================================================== */
.live.player { max-width: 480px; margin: 0 auto; }
.player-join { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.code-input {
  font-size: 2.6rem; font-weight: 900; letter-spacing: 0.3em; text-align: center;
  text-transform: uppercase; width: 100%; max-width: 300px; padding: 14px;
  border: 2px solid var(--line); border-radius: 14px;
}
.code-input:focus { outline: 3px solid rgba(59,77,232,0.25); border-color: var(--skb); }
.code-err { color: var(--bad); font-weight: 700; min-height: 1.2em; }
.name-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.name-btn {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  background: var(--card); border: 2px solid var(--line); border-radius: 14px;
  padding: 18px 10px; font-weight: 800; font-size: 1.1rem; box-shadow: var(--shadow);
  min-height: 60px;
}
.name-btn:hover { border-color: var(--skb); }
.name-btn.taken { opacity: 0.45; }
.name-taken { color: var(--good); }
.player-topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.player-name-tag { font-weight: 800; background: var(--skb-tint); color: var(--skb-dark); padding: 6px 14px; border-radius: 999px; display: inline-block; }
.player-qnum { font-weight: 800; color: var(--ink-soft); }
.player-prompt-hint { text-align: center; color: var(--ink-soft); font-weight: 700; margin-bottom: 12px; }
.live-q-options.phone { display: grid; grid-template-columns: 1fr; gap: 12px; }
.live-opt.phone { min-height: 72px; font-size: 1.25rem; }
.live-opt.phone:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--lip); }
.player-points { font-size: 1.8rem; font-weight: 900; color: var(--skb); margin-top: 8px; }
.res-good .live-card { border-color: var(--good); }
.res-bad .live-card { border-color: var(--bad); }

/* =====================================================================
   Hör-Paare (Listen & Match Pairs) — individual match game
   ===================================================================== */
/* Host — a live progress bar per student instead of a shared prompt. */
.match-host-tag { text-align: center; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 1px; font-weight: 800; font-size: 0.9rem; margin-bottom: 16px; }
.match-progress { max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.match-prow { display: flex; align-items: center; gap: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; box-shadow: var(--shadow); }
.match-prow.done { border-color: var(--good); background: #eafaf7; }
.match-pname { flex: 0 0 32%; font-weight: 700; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.match-pbar { flex: 1; height: 14px; background: #e8ecf7; border-radius: 999px; overflow: hidden; }
.match-pfill { height: 100%; width: 0; background: var(--grad); border-radius: 999px; transition: width 0.4s ease; }
.match-prow.done .match-pfill { background: var(--good); }
.match-pcount { flex: 0 0 auto; font-weight: 900; font-variant-numeric: tabular-nums; color: var(--skb-dark); min-width: 3.2em; text-align: right; }
/* Race board: rank medal + finish line (time + first-try). */
.match-prank { flex: 0 0 auto; min-width: 1.8em; text-align: center; font-weight: 900; font-size: 1.1rem; color: var(--skb-dark); }
.match-pdone { flex: 0 0 auto; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--good); min-width: 8.5em; text-align: right; font-size: 0.9rem; }
.match-prow.offline { opacity: 0.55; }
.match-prow.offline .match-pname { font-style: italic; }
.match-host-tag { text-align: center; color: var(--ink-soft); font-weight: 700; margin: 4px 0 16px; }
/* Projector view of the content: both sides, shuffled, NOT paired up. */
.match-hboard { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; max-width: 720px; margin: 0 auto 18px; }
.match-hcol { gap: 8px; }
.match-hboard .match-tile[disabled] { opacity: 1; }
.match-progress-label { text-align: center; font-size: 0.8rem; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 10px; }
/* Reveal: the answer key (correct pairs) shown to the class. */
.match-answerkey { display: flex; flex-direction: column; gap: 8px; max-width: 560px; margin: 10px auto 0; }
.match-akrow { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; box-shadow: var(--shadow); }
.match-akside { flex: 1; display: flex; align-items: center; gap: 6px; min-width: 0; font-weight: 700; }
.match-akside.mt-image { justify-content: center; }
.match-akside .match-img { max-height: 44px; width: auto; }
.match-akside .match-icon-big { font-size: 1.6rem; }
.match-ak-audio { font-weight: 800; color: var(--skb-dark); }

/* ==== js/data.js ==== */
/* =====================================================================
   Skillbee Deutsch Games — VOCABULARY DATA
   ---------------------------------------------------------------------
   👋 NON-TECHNICAL FRIENDLY: This is the file you edit to change what
   students learn. You do NOT need to touch any other file.

   HOW TO ADD A WORD:
     Copy one line inside a topic's "words" list and change it, e.g.
        { de: "der Apfel", en: "the apple", emoji: "🍎" },

   HOW TO ADD A SENTENCE (used by the "Satzbau" game):

   ===================================================================== */

      { de: "fünf", en: "five", emoji: "5️⃣" },

      { de: "elf", en: "eleven", emoji: "" },
      { de: "zwölf", en: "twelve", emoji: "" }
    ]
  },
  {

// Transform the compact single-blank rows into the general Lücken-Text schema.
// Each becomes a one-blank sentence; the word bank = correct + distractors.
function toBlanks(list) {
  return (list || []).map(function (e) {
    var correct = String(e.correct || "").trim();
    var bank = [correct];
    (e.distractors || []).forEach(function (d) { d = String(d).trim(); if (d && bank.indexOf(d) < 0) bank.push(d); });
    return {
      sentence: String(e.sentence || ""),        // plain ___ marks the blank
      blanks: [{ id: 1, correct: correct }],
      wordBank: bank,
      explanation: e.explanation || ""
    };
  });
}

window.CaseData = {
  items: toBlanks(CASE_DRILLS.accusative)
    .concat(toBlanks(CASE_DRILLS.dative))
    .concat(toBlanks(CASE_DRILLS.genitive))
};

/* ==== js/store.js ==== */
/* =====================================================================
   ContentStore — lets teachers edit the game content from inside the app.
   ---------------------------------------------------------------------
   • The built-in content in data.js is the "default".
   • Teacher edits are saved in the browser (localStorage) AND synced to the
     cloud (the same Firebase as Live Mode), so an edit on one device shows
     up on every device — including the smartboard used for hosting.
   • Offline (no Firebase), it falls back to localStorage on that device.
   • Backup/Restore (JSON) stays available as an optional safety net.
   The games and the topic picker read their content from here, so any edit
   shows up immediately.
   ===================================================================== */
(function () {
  var KEY = "skillbee_deutsch_content_v1";
  var TS_KEY = "skillbee_deutsch_content_ts_v1";
  // A per-tab id so a device ignores the echo of its own cloud writes.
  var CLIENT_ID = "c" + Math.random().toString(36).slice(2, 10);

  function clone(x) {
    return JSON.parse(JSON.stringify(x));
  }

  function defaultCases() {
    return clone(window.CaseData || { items: [] });
  }
  function defaultCompounds() {
    return clone(window.CompoundData || []);
  }
  function defaultListening() {
    return clone(window.ListeningData || []);
  }

  /* ---------------------------------------------------------------------
     Exercises — EVERY content game holds its own LIST of named "exercises".
     A teacher builds a fresh exercise for each lesson and keeps the previous
     ones instead of overwriting; in each game they pick which to play.
     Each game owns its content (nothing is shared between games). Shapes:
       words games  (quiz, memory, hangman)  -> { id, name, emoji, english, words: [...] }
       sentence game (scramble)              -> { id, name, emoji, english, sentences: [...] }
       cases (Lücken-Text)                   -> { id, name, items: [...] }
       item games (compounds/listening)      -> { id, name, items: [...] }
     --------------------------------------------------------------------- */
  var WORD_GAMES = ["quiz", "memory"];
  var ITEM_GAMES = ["compounds", "listening"];

  function gameKind(gameKey) {
    if (gameKey === "scramble") return "scramble";
    if (gameKey === "hangman") return "hangman";
    if (gameKey === "cases") return "cases";
    if (gameKey === "hoerpaare") return "pairs";
    if (gameKey === "truefalse") return "truefalse";
    if (gameKey === "passage") return "passage";
    if (WORD_GAMES.indexOf(gameKey) >= 0) return "words";
    return "items"; // compounds / listening
  }

  function exId() {
    return "ex-" + Date.now().toString(36) + "-" + Math.floor(Math.random() * 1e4).toString(36);
  }
  function wordsExercise(name, words) {
    return { id: exId(), name: name || "Exercise 1", emoji: "📚", english: "", words: Array.isArray(words) ? clone(words) : [] };
  }
  function sentencesExercise(name, sentences) {
    return { id: exId(), name: name || "Exercise 1", emoji: "🗣️", english: "", sentences: Array.isArray(sentences) ? clone(sentences) : [] };
  }
  // A fresh Lücken-Text exercise: one flat list of sentences. `seed` may be new
  // ({ items }) or a legacy case-grouped ({ accusative, dative, genitive }) shape.
  function caseExercise(name, seed) {
    seed = seed || {};
    var items = Array.isArray(seed.items) ? clone(seed.items) : [];
    ["accusative", "dative", "genitive"].forEach(function (k) { if (Array.isArray(seed[k])) items = items.concat(clone(seed[k])); });
    return { id: exId(), name: name || "Exercise 1", items: items };
  }
  // A fresh exercise for a flat-list game. `items` may be a legacy array migrated in.
  function listExercise(name, items) {
    return { id: exId(), name: name || "Exercise 1", items: Array.isArray(items) ? clone(items) : [] };
  }
  // Turn a legacy shared-bank topic into a per-game exercise (keeps its name/emoji).
  function topicToExercise(topic, kind) {
    var e = clone(topic || {});
    if (!e.id) e.id = exId();
    if (typeof e.name !== "string" || !e.name) e.name = "Exercise";
    if (typeof e.emoji !== "string") e.emoji = kind === "sentences" ? "🗣️" : "📚";
    if (typeof e.english !== "string") e.english = "";
    if (kind === "sentences") { if (!Array.isArray(e.sentences)) e.sentences = []; delete e.words; }
    else { if (!Array.isArray(e.words)) e.words = []; delete e.sentences; }
    return e;
  }
  function normalizeWordsEx(e) {
    if (!e.id) e.id = exId();
    if (typeof e.name !== "string" || !e.name) e.name = "Exercise";
    if (typeof e.emoji !== "string") e.emoji = "📚";
    if (typeof e.english !== "string") e.english = "";
    if (!Array.isArray(e.words)) e.words = [];
    // Optional typed MCQ questions (Quiz-Blitz): { question:{type,value},
    // options:[{type,value,correct}] } — keep 4 options with exactly one correct.
    if (Array.isArray(e.mcq)) {
      e.mcq = e.mcq.filter(function (m) { return m && typeof m === "object"; }).map(function (m) {
        var q = (m.question && typeof m.question === "object") ? { type: m.question.type || "text", value: String(m.question.value == null ? "" : m.question.value) } : { type: "text", value: "" };
        var opts = (Array.isArray(m.options) ? m.options : []).map(function (o) { return { type: (o && o.type) || "text", value: String((o && o.value) || ""), correct: !!(o && o.correct) }; });
        while (opts.length < 4) opts.push({ type: (opts[0] || {}).type || "text", value: "", correct: false });
        opts = opts.slice(0, 4);
        if (!opts.some(function (o) { return o.correct; })) opts[0].correct = true;
        return { question: q, options: opts };
      });
    }
  }
  function normalizeSentencesEx(e) {
    if (!e.id) e.id = exId();
    if (typeof e.name !== "string" || !e.name) e.name = "Exercise";
    if (typeof e.emoji !== "string") e.emoji = "🗣️";
    if (typeof e.english !== "string") e.english = "";
    if (!Array.isArray(e.sentences)) e.sentences = [];
  }
  // A Lücken-Text sentence entry: { sentence, blanks:[{id,correct}], wordBank,
  // explanation }. Older stores hold single-blank case rows ({ sentence, correct,
  // distractors, clueWord }) — migrate those forward in place. Idempotent.
  function migrateCaseEntry(e) {
    if (!e || typeof e !== "object") return { sentence: "", blanks: [], wordBank: [], explanation: "" };
    if (Array.isArray(e.blanks)) {
      e.sentence = String(e.sentence || "");
      e.blanks = e.blanks.map(function (b, i) {
        return { id: (b && b.id != null) ? b.id : i + 1, correct: String((b && b.correct) || "").trim() };
      });
      e.wordBank = Array.isArray(e.wordBank) ? e.wordBank.map(function (w) { return String(w).trim(); }).filter(Boolean) : [];
      if (typeof e.explanation !== "string") e.explanation = "";
      delete e.correct; delete e.distractors; delete e.clueWord; delete e.blank; delete e.answer;
      return e;
    }
    var correct = String(e.correct || "").trim();
    var bank = [];
    if (correct) bank.push(correct);
    (Array.isArray(e.distractors) ? e.distractors : []).forEach(function (d) { d = String(d).trim(); if (d && bank.indexOf(d) < 0) bank.push(d); });
    return {
      sentence: String(e.sentence || ""),
      blanks: correct ? [{ id: 1, correct: correct }] : [],
      wordBank: bank,
      explanation: e.explanation || ""
    };
  }
  function normalizeCaseEx(e) {
    if (!e.id) e.id = exId();
    if (typeof e.name !== "string" || !e.name) e.name = "Exercise";
    if (!Array.isArray(e.items)) e.items = [];
    // Fold the old accusative/dative/genitive sub-groups into one flat list.
    ["accusative", "dative", "genitive"].forEach(function (k) {
      if (Array.isArray(e[k]) && e[k].length) e.items = e.items.concat(e[k]);
      delete e[k];
    });
    e.items = e.items.map(migrateCaseEntry);
  }
  function normalizeListEx(e) {
    if (!e.id) e.id = exId();
    if (typeof e.name !== "string" || !e.name) e.name = "Exercise";
    if (!Array.isArray(e.items)) e.items = [];
  }
  // Hör-Paare (Listen & Match): an exercise is a list of "questions", and each
  // question is a set of words (min 3) students match audio-to-meaning.
  function pairsExercise(name, questions) {
    return { id: exId(), name: name || "Exercise 1", emoji: "🔗", questions: Array.isArray(questions) ? clone(questions) : [] };
  }
  function normalizePairsEx(e) {
    if (!e.id) e.id = exId();
    if (typeof e.name !== "string" || !e.name) e.name = "Exercise";
    if (typeof e.emoji !== "string") e.emoji = "🔗";
    if (!Array.isArray(e.questions)) e.questions = [];
    e.questions = e.questions.filter(function (q) { return q && typeof q === "object"; });
    e.questions.forEach(function (q) {
      // A question picks a left + right tile type once, then holds entries
      // { left, right } sharing those types. Default is Audio ↔ Text (spoken
      // German ↔ English) — the classic matching round.
      if (typeof q.leftType !== "string") q.leftType = "audio";
      if (typeof q.rightType !== "string") q.rightType = "text";
      if (!Array.isArray(q.entries)) q.entries = [];
      // Migrate the brief earlier per-pair form into the per-question model.
      if (Array.isArray(q.pairs) && q.pairs.length && !q.entries.length) {
        var first = q.pairs[0] || {};
        q.leftType = (first.question && first.question.type) || "text";
        q.rightType = (first.answer && first.answer.type) || "text";
        q.entries = q.pairs.map(function (p) {
          return { left: String(((p && p.question) || {}).value || ""), right: String(((p && p.answer) || {}).value || "") };
        });
      }
      delete q.pairs;
      // Migrate the old German↔English "words" rows into Audio↔Text entries.
      if (Array.isArray(q.words) && q.words.length) {
        var we = q.words.filter(function (w) { return w && w.de && w.en; }).map(function (w) { return { left: w.de, right: w.en }; });
        if (!q.entries.length) { q.leftType = "audio"; q.rightType = "text"; q.entries = we; }
        else if (q.leftType === "audio" && q.rightType === "text") { q.entries = q.entries.concat(we); }
        // else: incompatible types (rare) — the words are dropped.
      }
      delete q.words;
      q.entries = q.entries.filter(function (en) { return en && typeof en === "object"; });

    });

  // Seed Hör-Paare with a few ready-made questions (4 words each) from the vocab.
  function defaultPairsQuestions() {
    var vt = (window.GameData && window.GameData.VOCAB_TOPICS) || [];
    var pick = ["zahlen", "farben", "tiere", "essen"];
    return vt.filter(function (t) { return pick.indexOf(t.id) >= 0; }).map(function (t) {
      return { words: (t.words || []).slice(0, 4).map(function (w) { return { de: w.de, en: w.en, emoji: w.emoji || "" }; }) };
    });
  }

  /* Wahr oder Falsch? (True or False) — an exercise is a list of statements. Each
     statement has an OPTIONAL context block and a REQUIRED statement block, each
     independently text / audio / image / icon, plus a true|false answer. A block
     is { type, value }; context is null when there's no supporting context. The
     shape is deliberately Passage-ready: a passage-embedded question is the same
     object with context:null (the passage itself provides the context). */
  var TF_BLOCK_TYPES = ["text", "audio", "image", "icon"];
  function tfBlock(b, allowNull) {
    if (allowNull && (b == null)) return null;

    return {
      type: TF_BLOCK_TYPES.indexOf(b.type) >= 0 ? b.type : "text",
      value: String(b.value == null ? "" : b.value)
    };
  }
  function trueFalseExercise(name, questions) {
    return { id: exId(), name: name || "Exercise 1", emoji: "⚖️", english: "", questions: Array.isArray(questions) ? clone(questions) : [] };
  }
  function normalizeTrueFalseEx(e) {
    if (!e.id) e.id = exId();
    if (typeof e.name !== "string" || !e.name) e.name = "Exercise";
    if (typeof e.emoji !== "string") e.emoji = "⚖️";
    if (typeof e.english !== "string") e.english = "";
    if (!Array.isArray(e.questions)) e.questions = [];
    e.questions = e.questions.filter(function (q) { return q && typeof q === "object"; });
    e.questions.forEach(function (q) {

      q.statement = tfBlock(q.statement, false);     // required → always an object
      q.answer = !!q.answer;
    });
  }
  // A few ready-made statements covering all four combos (with/without context,
  // audio/non-audio statement) so the game plays out of the box.
  function defaultTrueFalseQuestions() {
    return [
      { context: null, statement: { type: "text", value: "Deutschland liegt in Europa." }, answer: true },
      { context: null, statement: { type: "text", value: "Eine Katze ist ein Gemüse." }, answer: false },
      { context: { type: "icon", value: "🐶" }, statement: { type: "text", value: "Das ist ein Hund." }, answer: true },
      { context: { type: "icon", value: "🐱" }, statement: { type: "text", value: "Das ist ein großer Elefant." }, answer: false },
      { context: null, statement: { type: "audio", value: "Berlin ist die Hauptstadt von Deutschland." }, answer: true }
    ];
  }

  /* Sentence Scramble (Satzbau) — an exercise is a list of questions, each a
     German answer sentence (scrambled into its own words as tiles) plus a MODE:
       translation      → context is a text hint (the English translation)
       listen-unscramble → no hint; the sentence's audio is played, rebuild by ear
       question-answer   → context is a question (any block type); tiles are the answer
