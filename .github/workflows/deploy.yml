# Publishes the app to GitHub Pages so teachers can open it from a link.
# One-time setup: on GitHub go to Settings → Pages → Source → "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]        # publishes when changes land on the main branch
  workflow_dispatch: {}     # ...or run it manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."          # the whole repo is a static site (no build needed)
      - id: deployment
        uses: actions/deploy-pages@v4
