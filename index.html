<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skillbee Deutsch Games — Gamify your German lessons</title>
    <meta name="description" content="A gamified toolkit of German language games for Skillbee teachers to use in class." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%233b4de8'/><path d='M20 13 H44 L54 27 L32 53 L10 27 Z' fill='white'/></svg>" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="app"><!-- The app renders here (see js/app.js) --></div>

    <!-- Load order matters:
         1) data.js   — the vocabulary (edit this to change content)
         2) app.js    — the core app + shared toolkit
         3) games/*   — each game registers itself into the lobby -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/games/quiz.js"></script>
    <script src="js/games/memory.js"></script>
    <script src="js/games/hangman.js"></script>
    <script src="js/games/scramble.js"></script>
  </body>
</html>
