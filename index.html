<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skillbee Deutsch Games — Gamify your German lessons</title>
    <meta name="description" content="A gamified toolkit of German language games for Skillbee teachers to use in class." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%233b4de8'/></svg>" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="app"><!-- The app renders here (see js/app.js) --></div>

    <!-- Load order matters:
         1) data.js   — the vocabulary (edit this to change content)
         2) app.js    — the core app + shared toolkit
         3) games/*   — each game registers itself into the lobby -->
    <!-- Firebase (Live Class Mode only). Loaded from the CDN; the offline
         bundle omits these, so Live Mode there shows an "online only" note. -->
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

    <script src="js/data.js"></script>
    <script src="js/data-cases.js"></script>
    <script src="js/data-compounds.js"></script>
    <script src="js/brand.js"></script>
    <script src="js/store.js"></script>
    <script src="js/teacher.js"></script>
    <script src="js/app.js"></script>
    <script src="js/games/quiz.js"></script>
    <script src="js/games/memory.js"></script>
    <script src="js/games/hangman.js"></script>
    <script src="js/games/scramble.js"></script>
    <script src="js/admin.js"></script>

    <!-- Live Class Mode -->
    <script src="js/live/firebase.js"></script>
    <script src="js/live/liveGames.js"></script>
    <script src="js/live/live.js"></script>
  </body>
</html>
