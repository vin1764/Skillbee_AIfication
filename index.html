<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skillbee Deutsch Games — Gamify your German lessons</title>
    <meta name="description" content="A gamified toolkit of German language games for Skillbee teachers to use in class." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%233b4de8'/></svg>" />
    <!-- Rounded, friendly display face (matches the Skillbee wordmark). Loads
         online; offline/standalone falls back to the system rounded stack. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" />
    <link rel="stylesheet" href="css/styles.css?v=817b65ed" />
  </head>
  <body>
    <div id="app"><!-- The app renders here (see js/app.js) --></div>

    <!-- Load order matters:
         1) data.js   — the vocabulary (edit this to change content)
         2) app.js    — the core app + shared toolkit
         3) games/*   — each game registers itself into the lobby -->
    <!-- Firebase (Live Class Mode only). Loaded from the CDN; the offline
         bundle omits these, so Live Mode there shows an "online only" note. -->
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

    <script src="js/data.js?v=817b65ed"></script>
    <script src="js/data-cases.js?v=817b65ed"></script>
    <script src="js/data-compounds.js?v=817b65ed"></script>
    <script src="js/data-listening.js?v=817b65ed"></script>
    <script src="js/brand.js?v=817b65ed"></script>
    <script src="js/store.js?v=817b65ed"></script>
    <script src="js/teacher.js?v=817b65ed"></script>
    <script src="js/app.js?v=817b65ed"></script>
    <script src="js/voice.js?v=817b65ed"></script>
    <script src="js/games/quiz.js?v=817b65ed"></script>
    <script src="js/games/memory.js?v=817b65ed"></script>
    <script src="js/translate.js?v=817b65ed"></script>
    <script src="js/emoji.js?v=817b65ed"></script>
    <script src="js/admin.js?v=817b65ed"></script>

    <!-- Live Class Mode -->
    <script src="js/live/firebase.js?v=817b65ed"></script>
    <script src="js/live/liveGames.js?v=817b65ed"></script>
    <script src="js/live/live.js?v=817b65ed"></script>

    <!-- Solo/Offline versions of the Live games (reuses the adapters above) -->
    <script src="js/games/live-solo.js?v=817b65ed"></script>
  </body>
</html>
